<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Kale's Games</title>
<meta name="description" content="Sign in to save scores to the leaderboard.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/games.css?v=1">
<style>
.card{max-width:460px;margin:30px auto;background:var(--forest);color:var(--forest-ink);border-radius:var(--r);padding:30px 24px;display:grid;gap:14px;position:relative;overflow:hidden;isolation:isolate}
.card .blob{width:220px;aspect-ratio:1;right:-70px;top:-80px;background:#2E5440}
.card h1{font-size:clamp(40px,9vw,56px)}
.card p{color:#B9C9AE}
.card input{border:0}
.card .btn{background:var(--butter);color:var(--ink)}
.card .btn.ghost{background:transparent;color:var(--forest-ink);box-shadow:inset 0 0 0 1.5px #ffffff44}
.card a{text-decoration:underline}
</style>
</head>
<body data-page="signin">
<main class="wrap">
<div class="card"><span class="blob"></span><div id="v"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/assets/common.js?v=1"></script>
<script>
const next=(new URLSearchParams(location.search).get('next')||'').match(/^\/[\w\-/]*$/)?.[0]||'/';
const v=document.getElementById('v');
function form(){v.innerHTML=`<div style="display:grid;gap:14px"><h1>Sign in</h1><p>Save your scores to the PVHS leaderboards. We'll email you a sign-in link. No password.</p>
  <input id="em" type="email" placeholder="you@email.com" autocomplete="email"><button class="btn" id="send">Email me a link</button><div id="m"></div>
  <p style="font-size:13px">Same account as kaleerson.com. School emails sometimes block the link, so a personal email works best.</p></div>`;
  const send=async()=>{const em=document.getElementById('em').value.trim();if(!/^\S+@\S+\.\S+$/.test(em))return;document.getElementById('send').disabled=true;
    const r=await SB.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+'/signin/?next='+encodeURIComponent(next)}});
    document.getElementById('send').disabled=false;
    document.getElementById('m').innerHTML=r.error?`<div class="msg">${G.esc(/rate|many/i.test(r.error.message)?'Too many tries. Wait a minute and try again.':r.error.message)}</div>`:'<div class="msg ok">Check your email for the link. You can close this tab.</div>'};
  document.getElementById('send').onclick=send;document.getElementById('em').onkeydown=e=>{if(e.key==='Enter')send()}}
async function signedIn(){const m=await G.me.ready;
  if(next!=='/'&&m.name){location.replace(next);return}
  v.innerHTML=`<div style="display:grid;gap:14px"><h1>${m.name?'Hi, '+G.esc(m.name):'Almost done'}</h1><p>${m.name?'You\'re signed in. Your scores will go on the leaderboards.':'Pick a display name for the leaderboards.'}</p>
    <div class="row">${m.name?`<a class="btn" href="${next}">Keep playing</a>`:'<button class="btn" id="pick">Pick a name</button>'}<button class="btn ghost" id="out">Sign out</button></div></div>`;
  if(document.getElementById('pick'))document.getElementById('pick').onclick=async()=>{if(await G.askName())signedIn()};
  document.getElementById('out').onclick=async()=>{await SB.auth.signOut();location.href='/'}}
(async()=>{if(!SB){v.innerHTML='<h1>Offline</h1><p>Sign-in isn\'t available right now.</p>';return}
  const {data}=await SB.auth.getSession();if(data.session)signedIn();else form();
  SB.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_IN'&&s){G.me.uid=s.user.id;G.me.ready=(async()=>{const p=await SB.from('profiles').select('display_name').eq('user_id',s.user.id).maybeSingle();G.me.name=p.data?.display_name||null;return G.me})();signedIn()}})})();
</script>
</body>
</html>
