<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forum · Kale Erson</title>
<!-- meta -->
<script>try{var t=localStorage.getItem("theme");if(!/^\/(snapwit|ldtimer|card)\//.test(location.pathname)){if(t!=="light"&&(t==="dark"||matchMedia("(prefers-color-scheme: dark)").matches))document.documentElement.dataset.theme="dark"}}catch(e){}</script>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<meta name="theme-color" content="#EEF0EA">
<meta property="og:site_name" content="Kale Erson">
<meta property="og:type" content="website">
<meta property="og:title" content="Forum · Kale Erson">
<meta property="og:description" content="Public forum. Anyone can read; members can post.">
<meta property="og:url" content="https://kaleerson.com/forum/">
<meta property="og:image" content="https://kaleerson.com/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<!-- /meta -->
<meta name="description" content="Public forum. Anyone can read; members can post.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=20261005">
<style>
main.pg{flex:1;padding-block:0 64px}
.phead .blob{background:var(--sky)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:var(--gap)}
.cats{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:5px;max-width:100%;overflow-x:auto}
.cats a{font-size:14px;font-weight:600;color:var(--ink2);padding:8px 14px;border-radius:999px;white-space:nowrap}
.cats a[aria-selected=true]{background:var(--ink);color:var(--on-ink)}
.who{font-size:14px;color:var(--ink2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbtn{font:inherit;font-size:13px;background:var(--card);border:0;border-radius:999px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.list{display:grid;gap:8px}
.thread{background:var(--card);border-radius:20px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;transition:transform .25s var(--ease)}
.thread:hover{transform:translateY(-2px)}
.thread b{font-family:var(--display);font-size:20px;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--ink2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.count{grid-row:span 2;text-align:center;min-width:52px;font-size:12px;color:var(--ink2);line-height:1.1}
.count strong{display:block;font-family:var(--display);font-size:22px;color:var(--ink)}
.cat{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--paper);color:var(--ink)}
.cat.general{background:var(--moss)}.cat.classes{background:var(--lilac)}.cat.clubs{background:var(--peach)}.cat.help{background:var(--sky)}.cat.ideas{background:var(--butter)}
.lock{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:#e3e6df;color:#4a5048}
.box{background:var(--card);border-radius:24px;padding:20px;display:grid;gap:12px;min-width:0}
.box h2{font-size:26px;letter-spacing:-.03em}
input,select,textarea{font:inherit;font-size:16px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);min-width:0;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
label.f{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.04em}
.g2{display:grid;grid-template-columns:3fr 1fr;gap:10px}
@media (max-width:600px){.g2{grid-template-columns:1fr}}
.btn.sm{padding:9px 14px;font-size:14px}
.btn:disabled{opacity:.6}
.msg{padding:11px 14px;border-radius:14px;font-size:14px;background:#fef3f2;color:#b42318}
.empty{color:var(--ink2);font-size:15px;padding:18px 4px}
.back{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink2);padding:20px 0 10px}
.back:hover{color:var(--ink)}
.op{background:var(--card);border-radius:var(--r);padding:24px;display:grid;gap:12px;position:relative;overflow:hidden;isolation:isolate}
.op .blob{width:180px;aspect-ratio:1;right:-60px;top:-70px;background:var(--sky);opacity:.6}
.op h1{font-size:clamp(32px,6vw,52px);overflow-wrap:anywhere}
.post{background:var(--card);border-radius:20px;padding:16px 18px;display:grid;gap:8px;min-width:0}
.md{display:grid;gap:6px;overflow-wrap:anywhere}
.md h3{font-size:19px}.md h4{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-family:var(--body)}
.md ul{padding-left:18px}
.md a{text-decoration:underline}
.md .copy{display:none}
.acts{display:flex;gap:12px;justify-content:flex-end}
.acts button{font:inherit;font-size:13px;color:var(--ink2);background:none;border:0;cursor:pointer;padding:2px 0}
.acts button:hover{color:var(--ink);text-decoration:underline}
.replies{display:grid;gap:8px;margin-top:var(--gap)}
.signin{background:var(--forest);color:var(--forest-ink);border-radius:20px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.signin .btn{background:var(--forest-ink);color:var(--ink)}
.rules{font-size:13px;color:var(--ink2)}
</style>
</head>
<body data-page="forum">
<main class="wrap pg">
  <div id="app"><p class="empty">Loading…</p></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/config.js?v=20261001"></script>
<script src="/lib/sb.js?v=20261001"></script>
<script src="/lib/vault-md.js?v=20261002"></script>
<script src="/lib/community.js?v=20261005"></script>
<script src="/assets/site.js?v=20261005"></script>
<script>
const $=id=>document.getElementById(id);
const E=VaultMD.esc, C=Community, me=C.me;
let STUDY=false;
const CATS={general:'General',classes:'Classes',clubs:'Clubs',help:'Help',ideas:'Ideas'};
const author=r=>Community.nameHTML(r.author);
const canDel=r=>me.uid&&(r.created_by===me.uid||me.admin);
const signinBox=what=>`<div class="signin"><span>Sign in to ${what}. Anyone can read.</span><a class="btn sm" href="/join/?next=${encodeURIComponent('/forum/'+location.hash)}">Sign up or sign in</a></div>`;
const RULES='<p class="rules">Be decent. No test answers, no personal info about other people, no spam. Reported posts get reviewed and removed.</p>';

async function needName(){if(me.name)return true;return C.askName('This shows next to your posts. Your email stays private.')}

async function list(cat){
  cat=CATS[cat]?cat:'';
  $('app').innerHTML=`
    <section class="phead"><span class="blob b2"></span><h1>Forum</h1><p>Talk about classes, clubs, projects, anything. Anyone can read. Members can post.</p>${STUDY?'<a class="btn sm forest" href="/study/" style="margin-top:14px">← Back to PVHS Study</a>':''}</section>
    <div class="bar"><nav class="cats"><a href="#/" aria-selected="${!cat}">All</a>${Object.entries(CATS).map(([k,v])=>`<a href="#/cat/${k}" aria-selected="${cat===k}">${v}</a>`).join('')}</nav>
      ${me.uid?`<div class="who">${me.name?`Posting as <b>${E(me.name)}</b><button class="linkbtn" id="rename">Change</button>`:''}<button class="btn sm" id="newtog">+ New thread</button></div>`:''}</div>
    ${me.uid?'':signinBox('start a thread or reply')}
    <div class="box" id="newbox" hidden style="margin-bottom:var(--gap)"><h2>New thread</h2>
      <div class="g2"><label class="f">Title<input id="nt" maxlength="140"></label><label class="f">Category<select id="nc">${Object.entries(CATS).map(([k,v])=>`<option value="${k}"${k===(cat||'general')?' selected':''}>${v}</option>`).join('')}</select></label></div>
      <label class="f">Post<textarea id="nb" maxlength="8000" placeholder="**bold**, - bullets and links work"></textarea></label>
      ${RULES}<div class="row"><button class="btn sm" id="ngo">Post thread</button><button class="btn sm ghost" id="ncancel">Cancel</button></div><div id="nmsg"></div></div>
    <div class="list" id="threads"><p class="empty">Loading…</p></div>`;
  if(me.uid){
    if($('rename'))$('rename').addEventListener('click',async()=>{if(await C.askName())list(cat)});
    $('newtog').addEventListener('click',async()=>{
      const had=!!me.name;if(!await needName())return;
      if(!had)await list(cat);
      $('newbox').hidden=false;$('nt').focus();
    });
    $('ncancel').addEventListener('click',()=>{$('newbox').hidden=true});
    $('ngo').addEventListener('click',async()=>{
      const title=$('nt').value.trim(),body=$('nb').value.trim();
      const err=t=>$('nmsg').innerHTML=`<div class="msg">${E(t)}</div>`;
      if(title.length<3)return err('Add a title (3+ characters).');
      if(!body)return err('Write something.');
      $('ngo').disabled=true;
      const r=await SB.from('forum_threads').insert({title,body,category:$('nc').value}).select('id').single();
      $('ngo').disabled=false;
      if(r.error)return err(C.errText(r.error));
      location.hash='#/t/'+r.data.id;
    });
  }
  let q=SB.from('forum_threads').select('id,category,title,reply_count,last_post_at,created_at,locked,author:profiles(display_name,username,name_color,tags)').order('last_post_at',{ascending:false}).limit(100);
  if(cat)q=q.eq('category',cat);
  const {data,error}=await q;
  if(error){$('threads').innerHTML=`<div class="msg">${E(C.errText(error))}</div>`;return}
  $('threads').innerHTML=data.map(t=>`<a class="thread" href="#/t/${t.id}"><b>${E(t.title)}</b><span class="count"><strong>${t.reply_count}</strong>${t.reply_count===1?'reply':'replies'}</span>
    <span class="meta"><span class="cat ${t.category}">${CATS[t.category]}</span>${t.locked?'<span class="lock">Locked</span>':''}<span>${author(t)} · active ${C.ago(t.last_post_at)}</span></span></a>`).join('')
    ||`<p class="empty">No threads${cat?' in '+CATS[cat]:''} yet.${me.uid?' Start one.':''}</p>`;
}

async function thread(id){
  const {data:t,error}=await SB.from('forum_threads').select('*,author:profiles(display_name,username,name_color,tags)').eq('id',id).maybeSingle();
  if(error||!t){$('app').innerHTML=`<a class="back" href="#/">← Forum</a><div class="box"><h2>Thread not found</h2><p class="rules">It may have been removed.</p></div>`;return}
  const {data:rs}=await SB.from('forum_replies').select('*,author:profiles(display_name,username,name_color,tags)').eq('thread_id',id).order('created_at').limit(500);
  $('app').innerHTML=`
    <a class="back" href="#/cat/${t.category}">← ${CATS[t.category]}</a>
    <article class="op"><span class="blob"></span>
      <div class="meta"><span class="cat ${t.category}">${CATS[t.category]}</span>${t.locked?'<span class="lock">Locked</span>':''}</div>
      <h1>${E(t.title)}</h1><div class="md">${VaultMD.render(t.body)}</div>
      <div class="meta">${author(t)} · ${C.ago(t.created_at)}</div>
      <div class="acts">${me.admin?`<button id="locktog">${t.locked?'Unlock':'Lock'} thread</button>`:''}<button data-rep="forum_thread:${t.id}">Report</button>${canDel(t)?`<button data-delthread="${t.id}">Delete</button>`:''}</div>
    </article>
    <div class="replies">${(rs||[]).map(r=>`<div class="post" data-r="${r.id}"><div class="md">${VaultMD.render(r.body)}</div><div class="meta">${author(r)} · ${C.ago(r.created_at)}</div>
      <div class="acts"><button data-rep="forum_reply:${r.id}">Report</button>${canDel(r)?`<button data-delreply="${r.id}">Delete</button>`:''}</div></div>`).join('')}
      ${t.locked?'<p class="empty">This thread is locked. No new replies.</p>':me.uid?`<div class="box"><label class="f">Reply<textarea id="rb" maxlength="8000"></textarea></label>${RULES}<div class="row"><button class="btn sm" id="rgo">Reply</button></div><div id="rmsg"></div></div>`:signinBox('reply')}
    </div>`;
  if($('rgo'))$('rgo').addEventListener('click',async()=>{
    const body=$('rb').value.trim();if(!body)return;
    if(!await needName())return;
    $('rgo').disabled=true;
    const r=await SB.from('forum_replies').insert({thread_id:id,body});
    $('rgo').disabled=false;
    if(r.error){$('rmsg').innerHTML=`<div class="msg">${E(C.errText(r.error))}</div>`;return}
    thread(id);
  });
  if($('locktog'))$('locktog').addEventListener('click',async()=>{const r=await SB.from('forum_threads').update({locked:!t.locked}).eq('id',id);if(r.error)return alert(C.errText(r.error));thread(id)});
}

function arm(b,label){if(b.dataset.armed)return true;b.dataset.armed=1;const o=b.textContent;b.textContent=label;setTimeout(()=>{delete b.dataset.armed;b.textContent=o},3000);return false}
document.addEventListener('click',async e=>{
  const rep=e.target.closest('[data-rep]');
  if(rep){const [t,id]=rep.dataset.rep.split(':');C.report(t,+id);return}
  const dt=e.target.closest('[data-delthread]');
  if(dt){if(!arm(dt,'Click again to delete thread'))return;const r=await SB.from('forum_threads').delete().eq('id',+dt.dataset.delthread);if(r.error)return alert(C.errText(r.error));location.hash='#/';return}
  const dr=e.target.closest('[data-delreply]');
  if(dr){if(!arm(dr,'Click again to delete'))return;const r=await SB.from('forum_replies').delete().eq('id',+dr.dataset.delreply);if(r.error)return alert(C.errText(r.error));dr.closest('.post').remove()}
});

function route(){
  const p=location.hash.replace(/^#\/?/,'').split('/');
  if(p[0]==='t'&&+p[1]){window.scrollTo(0,0);return thread(+p[1])}
  return list(p[0]==='cat'?p[1]:'');
}
(async()=>{
  if(!window.SB){$('app').innerHTML='<section class="phead"><h1>Forum</h1><p>Coming soon.</p></section>';return}
  await C.load();
  if(me.uid){const r=await SB.rpc('is_study');STUDY=!!r.data}
  addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
