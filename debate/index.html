<style>
:root{--a:#2451C9;--a-t:#DCE8FB;--b:#B8322F;--b-t:#FBE2DA;--n:#1E3A2C;--n-t:#DCEBD0;--warn:#B86E00;--over:#D12C2C}
html[data-theme=dark]{--a:#7FA4F0;--a-t:#1F2F4A;--b:#F08B7E;--b-t:#43261F;--n:#9FCB8E;--n-t:#22382A;--warn:#E5A33A;--over:#F0695F}
main.pg{flex:1;padding-block:0 64px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:24px 0 14px}
.top h1{font-size:clamp(40px,7vw,76px)}
.top .sub{color:var(--ink2);margin-top:8px}
.back{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink2);padding:16px 0 0}
.back:hover{color:var(--ink)}
.box{background:var(--card);border-radius:24px;padding:20px;display:grid;gap:12px;min-width:0}
.box h2{font-size:24px;letter-spacing:-.03em}
.muted{color:var(--ink2)}
.small{font-size:13px;color:var(--ink2)}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--ink2);padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* hub */
.hub{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--gap)}
.hub .b{grid-column:span 2;min-height:170px}
.hub .b.w{grid-column:span 3}
@media (max-width:900px){.hub{grid-template-columns:repeat(2,1fr)}.hub .b,.hub .b.w{grid-column:span 1}}
@media (max-width:520px){.hub .b,.hub .b.w{grid-column:span 2}}
.hub .b .blob{width:140px;aspect-ratio:1;right:-40px;bottom:-50px;background:#ffffff66}
.hub .b h2{font-size:clamp(26px,3vw,34px)}
.hub .fmt{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em}

/* round timer */
.rt{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:860px){.rt{grid-template-columns:1fr}}
.clock{background:var(--card);border-radius:28px;padding:22px;display:grid;gap:12px;position:relative;overflow:hidden;isolation:isolate}
.clock::before{content:"";position:absolute;z-index:-1;width:300px;aspect-ratio:1;right:-90px;top:-120px;background:var(--side-t,var(--paper));border-radius:58% 42% 51% 49% / 46% 55% 45% 54%;animation:morph 14s ease-in-out infinite}
.clock.sd0{--side:var(--a);--side-t:var(--a-t)}.clock.sd1{--side:var(--b);--side-t:var(--b-t)}.clock.sd2{--side:var(--n);--side-t:var(--n-t)}
.now{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.now .code{font:800 30px/1 var(--display);color:var(--side)}
.now .name{color:var(--ink2);font-weight:500}
.pchip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--warn);color:#fff;align-self:center}
.digits{font:700 clamp(88px,22vw,190px)/.9 var(--display);font-variant-numeric:tabular-nums;text-align:center;padding-block:4px;letter-spacing:-.01em}
.digits.warn{color:var(--warn)}
.digits.over{color:var(--over);animation:pulse 1s steps(2,start) infinite}
.digits.grace{color:var(--warn)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.digits.over{animation:none}}
.csub{text-align:center;color:var(--ink2);font-size:13px;min-height:1.2em}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl .btn{min-width:110px;justify-content:center}
#prev,#next{min-width:64px;font-size:20px}
.btn.go{background:var(--side,var(--ink));font-size:17px;padding:15px 26px;min-width:150px}
.preps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prep{border:0;border-radius:20px;padding:12px 14px;display:grid;gap:2px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.prep.sd0{background:var(--a-t)}.prep.sd1{background:var(--b-t)}
.prep b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.prep span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.prep.on{outline:3px solid var(--warn);outline-offset:-3px}
.prep.out b{color:var(--over)}
.list{display:grid;gap:4px}
.sp{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:14px;border:0;background:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.sp:hover{background:var(--paper)}
.sp.cur{background:var(--paper);box-shadow:inset 3px 0 0 var(--sc)}
.sp.done{color:var(--ink3)}
.sp code{font:800 14px/1 var(--display);color:var(--sc)}
.sp.sd0{--sc:var(--a)}.sp.sd1{--sc:var(--b)}.sp.sd2{--sc:var(--n)}
.sp small{font-variant-numeric:tabular-nums;color:var(--ink2)}
.names{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.names input{width:100%}
.names button{font:inherit;border:0;background:var(--paper);border-radius:999px;width:38px;height:38px;cursor:pointer}
.setrow{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;font-size:14px}
.setrow input{width:100%;text-align:right}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:auto}

/* speech events */
.signal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);cursor:pointer}
.signal b{font:800 min(70vw,70vh)/1 var(--display);font-variant-numeric:tabular-nums}
.signal.grace{background:var(--warn)}.signal.over{background:var(--over)}
.signal small{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font-size:14px;opacity:.7}

/* congress */
.cg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:860px){.cg{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:6px}
td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle}
td.n{font-variant-numeric:tabular-nums;text-align:center}
tr.next td{background:var(--n-t)}
.mini{font:inherit;font-size:12px;font-weight:600;border:0;border-radius:999px;padding:6px 10px;cursor:pointer;background:var(--paper)}
.mini.af{background:var(--a-t)}.mini.ng{background:var(--b-t)}
.docket{display:grid;gap:6px}
.bill{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--paper);font-size:14px}
.bill.cur{background:var(--n-t);font-weight:600}
.bill span{flex:1;min-width:0;overflow-wrap:anywhere}
.log{font-size:13px;color:var(--ink2);display:grid;gap:3px;max-height:220px;overflow:auto}

/* flow */
.flowbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:var(--gap)}
.flow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:8px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--card);border-radius:18px;padding:10px;display:grid;grid-template-rows:auto auto 1fr;gap:6px;min-height:62vh}
.col h3{font:800 15px/1.1 var(--display);letter-spacing:-.01em;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.col.sd0 h3{color:var(--a)}.col.sd1 h3{color:var(--b)}.col.sd2 h3{color:var(--n)}
.col.cx{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.ctools{display:flex;gap:4px;flex-wrap:wrap}
.ctools button{font:600 11px var(--body);border:0;border-radius:999px;padding:5px 9px;background:var(--paper);color:var(--ink2);cursor:pointer}
.ctools button:hover{color:var(--ink)}.ctools button:disabled{opacity:.4;cursor:default}
.cell{position:relative;background:var(--paper);border-radius:12px;min-height:52vh}
.cell textarea,.cell .mirror{font:14px/20px var(--body);letter-spacing:normal;white-space:pre-wrap;overflow-wrap:break-word;word-break:normal;tab-size:4;box-sizing:border-box}
.cell textarea{position:relative;z-index:1;display:block;border:0;border-radius:12px;background:transparent!important;resize:none;overflow:hidden;margin-left:22px;width:calc(100% - 22px);padding:10px 10px 10px 6px;min-height:52vh;color:var(--ink)}
html[data-theme=dark] .cell textarea{background:transparent!important}
.cell textarea:focus{outline:none}.cell:focus-within{outline:2px solid var(--ink);outline-offset:1px}
.mirror{position:absolute;inset:0;padding:10px 10px 10px 28px;color:transparent;overflow:hidden;border-radius:12px;user-select:none}
.ln{position:relative;min-height:20px;margin:0 -10px 0 -28px;padding:0 10px 0 28px;cursor:pointer}
.ln::before{content:'';position:absolute;left:8px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ink3);opacity:.45}
.ln.ta{background:var(--a-t);box-shadow:inset 3px 0 0 var(--a)}.ln.ta::before{background:var(--a);opacity:1}
.ln.tb{background:var(--b-t);box-shadow:inset 3px 0 0 var(--b)}.ln.tb::before{background:var(--b);opacity:1}
.ln.ti{background:var(--butter);box-shadow:inset 3px 0 0 var(--warn)}.ln.ti::before{background:var(--warn);opacity:1}
.ln.dd{text-decoration:line-through;text-decoration-color:var(--ink2);text-decoration-thickness:2px;background-image:linear-gradient(#80808022,#80808022)}
.col.flash .cell{animation:cellflash 1s ease-out}
@keyframes cellflash{0%{box-shadow:0 0 0 3px var(--n)}100%{box-shadow:0 0 0 3px transparent}}
.flowhint{font-size:13px;color:var(--ink2);margin-top:6px}
.flowhint i{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:2px}
.flist{background:var(--card);border-radius:18px;padding:4px 14px;margin-bottom:var(--gap)}
.flist summary{cursor:pointer;font-weight:600;font-size:14px;padding:10px 0;list-style:none;display:flex;justify-content:space-between;gap:8px}
.flist summary::-webkit-details-marker{display:none}
.flist summary::after{content:'▾';color:var(--ink2)}.flist[open] summary::after{content:'▴'}
.flist .fls{display:grid;gap:4px;padding-bottom:10px;max-height:300px;overflow:auto}
.flist .fl1{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:0;background:var(--paper);border-radius:12px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer;min-width:0}
.flist .fl1.cur{box-shadow:inset 3px 0 0 var(--ink)}
.flist .fl1 b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flist .fl1 small{color:var(--ink2);font-size:12px;white-space:nowrap}
.flist .fl1 .prev{grid-column:1/-1;font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.printhead{display:none}
@media print{
  :root,html[data-theme=dark]{--paper:#fff;--card:#fff;--ink:#000;--ink2:#333;--ink3:#777;--line:#bbb;--a:#1a3fa0;--b:#a02a28;--a-t:#e6edfb;--b-t:#fbe6e1;--n:#1e3a2c;--n-t:#e3eedb;--warn:#8a5200;--butter:#fbf0c4}
  @page{size:landscape;margin:10mm}
  html,body{background:#fff!important;color:#000}
  header.nav,footer.foot-site,.back,.top,.flowbar,.flist,.flowhint,.ctools,#site-toast,#kvbar,.site-ui{display:none!important}
  main.pg{padding:0}
  .printhead{display:block;font:800 18px/1.2 var(--display);margin:0 0 8px}
  .printhead small{font:400 12px var(--body);color:#333;margin-left:8px}
  .flow{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;overflow:visible;padding:0}
  .col,.col.cx{min-height:0;border:1px solid #999;border-radius:6px;padding:6px;break-inside:avoid;background:#fff;grid-template-rows:auto 1fr;box-shadow:none}
  .col h3{font-size:12px;color:#000}
  .cell{min-height:0;background:#fff}
  .cell textarea{display:none}
  .mirror{position:static;color:#000;font-size:11px;line-height:15px;padding:4px 2px 4px 16px;overflow:visible}
  .ln{min-height:15px;margin:0 -2px 0 -16px;padding:0 2px 0 16px;break-inside:avoid}.ln::before{top:4px;left:3px;width:7px;height:7px}
  .ln.dd{text-decoration-color:#000;color:#555}
}

/* topics */
.prompt{background:var(--forest);color:var(--forest-ink);border-radius:var(--r);padding:28px;display:grid;gap:14px;min-height:220px;align-content:center;position:relative;overflow:hidden;isolation:isolate}
.prompt .blob{width:200px;aspect-ratio:1;right:-60px;top:-70px;background:#2E5440}
.prompt q{font:800 clamp(26px,4vw,42px)/1.12 var(--display);letter-spacing:-.025em;quotes:none}
.prompt .lbl{color:#B9C9AE}

/* speech drill */
.dr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.drmain,.drside{display:grid;gap:var(--gap);min-width:0}
@media (max-width:860px){.dr{grid-template-columns:1fr}}
.dr .prompt{min-height:0}
.digits.over{color:var(--over)}
.transcript{font-size:17px;line-height:1.6;max-height:300px;overflow:auto;overflow-wrap:anywhere}
.transcript mark{background:var(--butter);color:var(--ink);border-radius:5px;padding:0 3px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--paper);border-radius:14px;padding:12px;display:grid}
.stats b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink2)}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl span{background:var(--butter);border-radius:999px;padding:4px 10px;font-size:13px}
.hist{display:grid;gap:6px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--paper);border-radius:10px;padding:8px 10px}
#tap b{margin-left:4px;font-variant-numeric:tabular-nums}
/* ballot */
.bal{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
.bal .w{grid-column:1/-1}
@media (max-width:760px){.bal{grid-template-columns:1fr}}
.sidebox.sd0{box-shadow:inset 0 5px 0 var(--a)}.sidebox.sd1{box-shadow:inset 0 5px 0 var(--b)}
.deb{display:grid;gap:6px;background:var(--paper);border-radius:14px;padding:10px}
.deb textarea,.bal textarea{width:100%;resize:vertical}
.bal input{width:100%}.deb .row input{width:auto}
.btn.win[aria-pressed=true]{background:var(--n);color:var(--card)}
.btn.win[aria-pressed=false]{background:transparent;color:var(--ink)!important;box-shadow:inset 0 0 0 1.5px var(--line)}
/* cases */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--gap)}
.card{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:6px;align-content:start;min-width:0}
.card:hover{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.card b{font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.ctag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.cite{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.cbody{font-size:13px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.ced{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:860px){.ced{grid-template-columns:1fr}}
.ced input,.ced textarea{width:100%}.ced textarea{resize:vertical;min-height:260px}
.cardview{display:grid;gap:6px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.cardview .ptag{font-size:18px}
.cardview mark{background:#f6e27a;color:#141613;padding:0 2px}
.tshare{color:var(--a)}
.team{display:grid;gap:8px;background:var(--paper);border-radius:16px;padding:14px;margin-top:8px}
.tcode{font:800 22px/1 var(--display);letter-spacing:.14em;background:var(--card);border-radius:10px;padding:8px 12px}
.roster{display:flex;flex-wrap:wrap;gap:6px}.roster span{background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}.roster small{color:var(--ink2);font-weight:500}
.cbody2{color:var(--ink2)}.cbody2 u{color:var(--ink);font-size:15px}
.btn.danger{background:#fef3f2;color:#b42318}
code{background:var(--paper);padding:1px 6px;border-radius:6px;font-size:.9em}
/* judge view (always dark: it sits on the judge's desk) */
.judge{position:fixed;inset:0;z-index:96;display:grid;grid-template-rows:auto 1fr auto;background:#111310;color:#E9ECE4;cursor:pointer;user-select:none;--jside:#A8D59A;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px calc(env(safe-area-inset-bottom,0px) + 14px)}
.judge.sd0{--jside:#8FB0F5}.judge.sd1{--jside:#F09A8E}
.judge .jtop{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.judge .jcode{font:800 clamp(28px,6vw,56px)/1 var(--display);color:var(--jside)}
.judge .jname{font-size:clamp(15px,2.4vw,24px);color:#B8BDB3;flex:1;min-width:140px}
.judge .jx{font:600 14px var(--body);border:0;border-radius:999px;padding:10px 16px;background:#2A2E28;color:#E9ECE4;cursor:pointer}
.judge .jmid{display:grid;place-items:center;align-content:center;gap:6px;min-height:0}
.judge .jdig{font:800 min(38vw,42vh)/.9 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#E9ECE4}
.judge .jdig.warn{color:#E5A33A}.judge .jdig.over{color:#F0695F;animation:pulse 1s steps(2,start) infinite}
.judge .jsub{font-size:clamp(14px,2vw,20px);color:#B8BDB3;text-align:center}
.judge .jbot{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;align-items:stretch}
.judge .jprep{border:0;border-radius:18px;padding:12px 14px;display:grid;gap:2px;text-align:left;font:inherit;color:#E9ECE4;background:#1F2F4A;cursor:pointer}
.judge .jprep.sd1{background:#43261F}
.judge .jprep b{font:700 clamp(26px,5vw,40px)/1 var(--display);font-variant-numeric:tabular-nums}
.judge .jprep span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#B8BDB3}
.judge .jprep.on{outline:3px solid #E5A33A;outline-offset:-3px}
.judge .jnav{border:0;border-radius:18px;background:#2A2E28;color:#E9ECE4;font-size:22px;padding:0 16px;cursor:pointer}
.judge .jnav:disabled{opacity:.35}
@media (max-width:520px){.judge .jbot{grid-template-columns:1fr 1fr}.judge .jnav{display:none}}
@media (prefers-reduced-motion:reduce){.judge .jdig.over{animation:none}}
/* argument sprint */
.coin{width:120px;height:120px;border-radius:50%;margin:6px auto;display:grid;place-items:center;font:800 34px/1 var(--display);color:#141613;background:var(--butter);transform-style:preserve-3d;transition:transform .2s}
.coin.flip{animation:coinflip 1.3s cubic-bezier(.3,.6,.4,1) forwards}

.coin.sd0{background:var(--a-t);color:var(--a)}.coin.sd1{background:var(--b-t);color:var(--b)}

/* card cutter + extemp pad */
.cut{display:grid;gap:8px}

.pad .pt b{font:800 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.pad textarea{resize:vertical;min-height:56px}
.readtime{font-size:12px;color:var(--ink2)}
/* round timer: speech order strip, totals, overtime flash */
.strip{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.sch{font:800 12px/1 var(--display);border:0;border-radius:999px;padding:7px 9px;background:var(--paper);color:var(--ink2);cursor:pointer;font-variant-numeric:tabular-nums}
.sch.sd0{color:var(--a)}.sch.sd1{color:var(--b)}.sch.sd2{color:var(--n)}

.sch.cur.ot{background:var(--over);color:#fff;outline-color:var(--over)}

.clock.overt{box-shadow:inset 0 0 0 3px var(--over)}

.qnow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--n-t);border-radius:14px;padding:10px 12px}

.motions table{font-size:13px}.motions td{padding:6px 5px}.motions td:first-child{font-weight:600}
.motions .y{color:var(--n);font-weight:700}.motions .nn{color:var(--ink3)}
.motions .grp td{background:var(--paper);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;border-top:0}
/* my topics */
.mt{display:grid;gap:8px}.mt textarea{width:100%;resize:vertical;min-height:64px}

.spark .ref{stroke:var(--ink3);stroke-width:1;stroke-dasharray:3 3}

<script>
const $=id=>document.getElementById(id);
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('app');
const store={get(k,d){try{const v=localStorage.getItem('debate:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('debate:'+k,JSON.stringify(v))}catch(e){}}};
const fmtT=s=>{const neg=s<0;s=Math.abs(Math.round(s));return (neg?'+':'')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtTc=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* ── formats ─────────────────────────────────────────
   speech: [code, name, side (0 first side, 1 second side, 2 both), seconds] */
const FORMATS={
  ld:{name:'Lincoln-Douglas',short:'LD',sides:['Aff','Neg'],prep:240,note:'NSDA 6-3-7-3-4-6-3',speeches:[
    ['AC','Affirmative constructive',0,360],['CX','Cross-ex (Neg asks)',1,180],['NC','Negative constructive',1,420],['CX','Cross-ex (Aff asks)',0,180],
    ['1AR','First affirmative rebuttal',0,240],['NR','Negative rebuttal',1,360],['2AR','Second affirmative rebuttal',0,180]]},
  pf:{name:'Public Forum',short:'PF',sides:['Pro','Con'],prep:180,swap:true,note:'4-4-3-4-4-3-3-3-3-2-2',speeches:[
    ['A1','First speaker constructive',0,240],['B1','First speaker constructive',1,240],['CF','Crossfire (first speakers)',2,180],
    ['A2','Second speaker rebuttal',0,240],['B2','Second speaker rebuttal',1,240],['CF','Crossfire (second speakers)',2,180],
    ['AS','First speaker summary',0,180],['BS','First speaker summary',1,180],['GCF','Grand crossfire',2,180],
    ['AFF','Second speaker final focus',0,120],['BFF','Second speaker final focus',1,120]]},
  policy:{name:'Policy (CX)',short:'CX',sides:['Aff','Neg'],prep:480,note:'8-3 constructives, 5-minute rebuttals',speeches:[
    ['1AC','First affirmative constructive',0,480],['CX','Cross-ex (2N asks 1A)',1,180],['1NC','First negative constructive',1,480],['CX','Cross-ex (1A asks 1N)',0,180],
    ['2AC','Second affirmative constructive',0,480],['CX','Cross-ex (1N asks 2A)',1,180],['2NC','Second negative constructive',1,480],['CX','Cross-ex (2A asks 2N)',0,180],
    ['1NR','First negative rebuttal',1,300],['1AR','First affirmative rebuttal',0,300],['2NR','Second negative rebuttal',1,300],['2AR','Second affirmative rebuttal',0,300]]}
};
const EVENTS={
  extemp:{name:'Extemp',full:'Extemporaneous Speaking',prep:1800,speak:420,grace:30,note:'30 min prep, 7 min speech'},
  impromptu:{name:'Impromptu',full:'Impromptu',shared:420,grace:30,note:'7 minutes total, split between prep and speaking'},
  oo:{name:'Oratory',full:'Original Oratory',speak:600,grace:30,note:'10 minutes, memorized'},
  info:{name:'Info',full:'Informative Speaking',speak:600,grace:30,note:'10 minutes, visual aids allowed'},
  interp:{name:'Interp',full:'DI · HI · Duo · POI · Prose · Poetry',speak:600,grace:30,note:'10 minutes including intro'},
  story:{name:'Storytelling',full:'Storytelling',speak:300,grace:30,note:'5 minutes'},
  custom:{name:'Custom',full:'Custom speech timer',speak:300,grace:30,note:'Set your own time'}
};

/* ── shared ticking clock ─────────────────────────── */
let ticker=null;const tick=fn=>{clearInterval(ticker);ticker=setInterval(fn,200)};
let audioCtx=null;
function beep(n=1){if(!store.get('sound',true))return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);const t=audioCtx.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.25)}}catch(e){}}
function wakeLock(on){try{if(on&&navigator.wakeLock&&!window.__wl)navigator.wakeLock.request('screen').then(l=>{window.__wl=l;l.addEventListener('release',()=>window.__wl=null)}).catch(()=>{});if(!on&&window.__wl){window.__wl.release();window.__wl=null}}catch(e){}}

/* ── hub ──────────────────────────────────────────── */
function hub(){
  app.innerHTML=`
    <section class="phead"><span class="blob" style="background:var(--sky)"></span><h1>Speech &amp; Debate</h1><p>Round timers, speech timers, a flow sheet, practice drills and your own evidence library.</p></section>
    <div class="hub">
      <a class="b sky" href="#/round/ld"><span class="art" data-art="ld"></span><span class="fmt">LD</span><h2>Lincoln-Douglas</h2><div class="foot"><span class="muted">6-3-7-3-4-6-3 · 4 min prep</span><span class="arrow"></span></div></a>
      <a class="b peach" href="#/round/pf"><span class="art" data-art="pf"></span><span class="fmt">PF</span><h2>Public Forum</h2><div class="foot"><span class="muted">Crossfires · 3 min prep</span><span class="arrow"></span></div></a>
      <a class="b lilac" href="#/round/policy"><span class="art" data-art="policy"></span><span class="fmt">CX</span><h2>Policy</h2><div class="foot"><span class="muted">8-3 / 5 · 8 min prep</span><span class="arrow"></span></div></a>
      <a class="b forest w" href="#/congress"><span class="art" data-art="congress"></span><span class="fmt" style="color:#B9C9AE">CONGRESS</span><h2>Congress</h2><div class="foot"><span class="muted">Speech + questioning timer, precedence tracker, docket</span><span class="arrow"></span></div></a>
      <a class="b butter w" href="#/speech"><span class="art" data-art="speech"></span><span class="fmt">SPEECH</span><h2>Speech events</h2><div class="foot"><span class="muted">Extemp, Impromptu, Oratory, Info, Interp · grace + hand signals</span><span class="arrow"></span></div></a>
      <a class="b moss w" href="#/flow"><span class="art" data-art="flow"></span><span class="fmt">PRACTICE</span><h2>Flow sheet</h2><div class="foot"><span class="muted">Take notes column by column, saved on this device</span><span class="arrow"></span></div></a>
      <a class="b w" href="#/topics"><span class="art" data-art="topics"></span><span class="fmt">PRACTICE</span><h2>Practice topics</h2><div class="foot"><span class="muted">Resolutions, impromptu prompts, extemp questions</span><span class="arrow"></span></div></a>
      <a class="b peach" href="#/drill"><span class="art" data-art="drill"></span><span class="fmt">NEW · PRACTICE</span><h2>Speech drill</h2><div class="foot"><span class="muted">Counts your "um"s and "like"s live</span><span class="arrow"></span></div></a>
      <a class="b sky" href="#/cases"><span class="art" data-art="cases"></span><span class="fmt">NEW · PREP</span><h2>Cases &amp; evidence</h2><div class="foot"><span class="muted">Your private card library, on every device</span><span class="arrow"></span></div></a>
      <a class="b lilac" href="#/ballot"><span class="art" data-art="ballot"></span><span class="fmt">NEW · JUDGING</span><h2>Ballot helper</h2><div class="foot"><span class="muted">Points, RFD, copy to Tabroom</span><span class="arrow"></span></div></a>
    </div>`;
  app.querySelectorAll('.arrow:empty').forEach(a=>a.outerHTML=SITE.arrow);
}

/* ── round timer (LD / PF / Policy) ───────────────── */
function round(key){
  const F=FORMATS[key];if(!F)return hub();
  const saved=store.get('round:'+key,null);
  const S=saved||{idx:0,left:F.speeches.map(s=>s[3]),prep:[F.prep,F.prep],prepMin:F.prep/60,names:F.sides.slice()};
  if(!S.names)S.names=F.sides.slice();
  let run=null,last=0;  // run: 'speech' | 0 | 1 (prep side)
  const save=()=>store.set('round:'+key,S);
  const sideName=i=>i===2?'Both':E(S.names[i]);
  app.innerHTML=`
    <a class="back" href="#/">← Speech &amp; Debate</a>
    <div class="top"><div><h1>${F.name}</h1><p class="sub">${F.note}${key==='ld'?' · <a href="/ldtimer/" style="text-decoration:underline">Classic LD Timer</a>':''}</p></div>
      <div class="row"><button class="btn sm" id="judge">Judge view ⛶</button><button class="btn sm ghost" id="newround">New round</button></div></div>
    <div class="rt">
      <div class="clock" id="clock">
        <div class="now"><span class="code" id="code"></span><span class="name" id="name"></span><span class="pchip" id="pchip" hidden>Prep</span></div>
        <div class="digits" id="digits">0:00</div><div class="csub" id="csub"></div>
        <div class="ctl"><button class="btn sm ghost" id="prev" aria-label="Previous speech">←</button><button class="btn go" id="go">Start</button><button class="btn sm ghost" id="reset">Reset</button><button class="btn sm ghost" id="next" aria-label="Next speech">→</button></div>
        <div class="strip" id="strip" aria-label="Speech order"></div><div class="tot" id="tot"></div>
        <div class="preps"><button class="prep sd0" id="prep0"><span>${sideName(0)} prep</span><b>0:00</b></button><button class="prep sd1" id="prep1"><span>${sideName(1)} prep</span><b>0:00</b></button></div>
        <p class="small" style="text-align:center">Space: start/pause · ← →: speeches · A / B: prep · J: judge view</p>
      </div>
      <div class="panel" style="display:grid;gap:var(--gap)">
        <div class="box"><h2>Round</h2><div class="list" id="list"></div></div>
        <div class="box"><h2>Settings</h2>
          <div class="names"><input id="n0" value="${E(S.names[0])}" aria-label="First side name" maxlength="20">${F.swap?'<button id="swap" title="Swap who speaks first">⇄</button>':'<span class="small">vs</span>'}<input id="n1" value="${E(S.names[1])}" aria-label="Second side name" maxlength="20"></div>
          ${F.swap?'<p class="small">The left team speaks first. Use ⇄ after the coin flip.</p>':''}
          <label class="setrow">Prep per side (minutes)<input id="pm" type="number" min="0" max="20" step="0.5" value="${S.prepMin}"></label>
          <label class="setrow">Grace after time<select id="gr" aria-label="Grace period">${[0,5,10].map(g=>`<option value="${g}"${g===store.get('roundGrace',0)?' selected':''}>${g?g+' s':'None'}</option>`).join('')}</select></label>
          <label class="check"><input type="checkbox" id="snd" ${store.get('sound',true)?'checked':''}> Beep at 30 seconds and at time</label>
          <p class="small">With a grace period the clock turns orange for those seconds, then flashes red once the speaker is really over.</p>
        </div>
      </div>
    </div>`;
  const sp=()=>F.speeches[S.idx];
  const grace=()=>+store.get('roundGrace',0)||0;
  const total=F.speeches.reduce((a,s)=>a+s[3],0);
  let wasOver=false;
  function draw(){
    const s=sp(),side=s[2],g=grace();
    const pr=run===0||run===1;
    const t=pr?S.prep[run]:S.left[S.idx];
    const over=!pr&&t<=-g,inGrace=!pr&&t<=0&&!over;
    const ck=$('clock');ck.className='clock sd'+(pr?run:side)+(over?' overt':'')+(ck.classList.contains('flash')?' flash':'');
    $('code').textContent=pr?S.names[run]:s[0];
    $('name').textContent=pr?'Prep time':(side===2?s[1]:S.names[side]+' · '+s[1]);
    $('pchip').hidden=!pr;
    const d=$('digits');d.textContent=pr?fmtTc(t):(t<0?fmtT(t):fmtTc(t));
    d.className='digits'+(over?' over':inGrace?' grace':t<=30&&t>0?' warn':'');
    $('csub').textContent=over?'Over time':inGrace?'Grace period':run==='speech'?'Speaking':pr?'Prep running · speech clock paused':S.left[S.idx]<s[3]?'Paused':'Ready';
    $('go').textContent=run?'Pause':'Start';
    [0,1].forEach(i=>{const b=$('prep'+i);b.querySelector('b').textContent=fmtTc(S.prep[i]);b.classList.toggle('on',run===i);b.classList.toggle('out',S.prep[i]<=0)});
    $('list').innerHTML=F.speeches.map((x,i)=>`<button class="sp sd${x[2]} ${i===S.idx?'cur':''} ${S.left[i]<=0||i<S.idx&&S.left[i]<x[3]?'done':''}" data-i="${i}"><code>${x[0]}</code><span>${x[2]===2?E(x[1]):sideName(x[2])+' · '+E(x[1])}</span><small>${S.left[i]===x[3]?fmtTc(x[3]):fmtT(S.left[i])}</small></button>`).join('');
    $('strip').innerHTML=F.speeches.map((x,i)=>`<button class="sch sd${x[2]}${i===S.idx?' cur':''}${i===S.idx&&over?' ot':''}${i!==S.idx&&(S.left[i]<=0||i<S.idx&&S.left[i]<x[3])?' done':''}" data-i="${i}" title="${E(x[1])}">${E(x[0])}</button>`).join('');
    const el=F.speeches.reduce((a,x,i)=>a+Math.max(0,x[3]-S.left[i]),0),rem=S.left.reduce((a,l)=>a+Math.max(0,l),0);
    $('tot').textContent=`${fmtT(el)} elapsed · ${fmtT(rem)} left of ${fmtT(total)}`;
    $('prev').disabled=S.idx===0;$('next').disabled=S.idx===F.speeches.length-1;
    if(over&&!wasOver&&run==='speech'){ck.classList.add('flash');setTimeout(()=>ck.classList.remove('flash'),1300)}
    wasOver=over;
    drawJudge();
  }
  /* judge view: one dark full screen with the clock, the speech and both prep clocks */
  let JV=null,jvPushed=false,jvPop=false;  // jvPop: our own history.back() is still in flight (its popstate must not close a freshly reopened view)
  function drawJudge(){
    if(!JV)return;const s=sp(),side=s[2],pr=run===0||run===1;
    JV.className='judge sd'+(pr?run:side);
    JV.querySelector('.jcode').textContent=pr?S.names[run]:s[0];
    JV.querySelector('.jname').textContent=pr?'Prep time':(side===2?s[1]:S.names[side]+' · '+s[1]);
    const t=pr?S.prep[run]:S.left[S.idx],d=JV.querySelector('.jdig'),g=grace();
    d.textContent=pr?fmtTc(t):(t<0?fmtT(t):fmtTc(t));
    d.className='jdig'+(t<=-g||pr&&t<=0?' over':t<=0||t<=30&&t>0?' warn':'');
    JV.querySelector('.jsub').textContent=!pr&&t<=0&&t>-g?'Grace period · tap to pause':run==='speech'?'Speaking · tap to pause':pr?'Prep running · tap a prep clock to stop':(S.left[S.idx]<s[3]?'Paused · tap to resume':'Tap to start');
    [0,1].forEach(i=>{const b=JV.querySelector('#jp'+i);b.querySelector('b').textContent=fmtTc(S.prep[i]);b.querySelector('span').textContent=S.names[i]+' prep';b.classList.toggle('on',run===i)});
    JV.querySelector('#jprev').disabled=S.idx===0;JV.querySelector('#jnext').disabled=S.idx===F.speeches.length-1;
  }
  function openJudge(){
    if(JV)return;JV=document.createElement('div');JV.className='judge';JV.setAttribute('role','dialog');JV.setAttribute('aria-label','Judge view');
    JV.innerHTML=`<div class="jtop"><span class="jcode"></span><span class="jname"></span><button class="jx" id="jexit">Exit</button></div>
      <div class="jmid"><div class="jdig">0:00</div><div class="jsub"></div></div>
      <div class="jbot"><button class="jnav" id="jprev" aria-label="Previous speech">←</button><button class="jprep sd0" id="jp0"><span></span><b></b></button><button class="jprep sd1" id="jp1"><span></span><b></b></button><button class="jnav" id="jnext" aria-label="Next speech">→</button></div>`;
    document.body.append(JV);
    JV.onclick=e=>{const b=e.target.closest('button');if(!b){$('go').click();return}
      if(b.id==='jexit')closeJudge();else if(b.id==='jprev')$('prev').click();else if(b.id==='jnext')$('next').click();else if(b.id==='jp0')$('prep0').click();else if(b.id==='jp1')$('prep1').click()};
    try{if(JV.requestFullscreen)JV.requestFullscreen().catch(()=>{})}catch(e){}
    try{history.pushState({judge:1},'',location.href);jvPushed=true}catch(e){}
    wakeLock(true);drawJudge();
  }
  function closeJudge(){
    if(!JV)return;JV.remove();JV=null;
    try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}
    if(jvPushed){jvPushed=false;try{jvPop=true;history.back()}catch(e){jvPop=false}}
    if(!run)wakeLock(false);
  }
  const onPop=()=>{if(jvPop){jvPop=false;return}if(JV){jvPushed=false;closeJudge()}};
  const onFS=()=>{if(JV&&!document.fullscreenElement)closeJudge()};
  addEventListener('popstate',onPop);document.addEventListener('fullscreenchange',onFS);
  function loop(){
    const now=performance.now(),dt=(now-last)/1000;last=now;
    if(run==='speech'){const b=S.left[S.idx],g=grace();S.left[S.idx]-=dt;if(b>30&&S.left[S.idx]<=30)beep(1);if(b>0&&S.left[S.idx]<=0)beep(g?2:3);if(g&&b>-g&&S.left[S.idx]<=-g)beep(3)}
    else if(run===0||run===1){const b=S.prep[run];S.prep[run]=Math.max(0,S.prep[run]-dt);if(b>0&&S.prep[run]<=0){beep(2);stop()}}
    save();draw();
  }
  function start(what){run=what;last=performance.now();tick(loop);wakeLock(true);draw()}
  function stop(){run=null;clearInterval(ticker);wakeLock(false);save();draw()}
  $('go').onclick=()=>run?stop():start('speech');
  $('reset').onclick=()=>{stop();S.left[S.idx]=sp()[3];save();draw()};
  $('prev').onclick=()=>{stop();S.idx=Math.max(0,S.idx-1);save();draw()};
  $('next').onclick=()=>{stop();S.idx=Math.min(F.speeches.length-1,S.idx+1);save();draw()};
  [0,1].forEach(i=>$('prep'+i).onclick=()=>{if(run===i)return stop();if(S.prep[i]<=0)return;stop();start(i)});
  $('list').onclick=$('strip').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;stop();S.idx=+b.dataset.i;save();draw()};
  $('gr').onchange=()=>{store.set('roundGrace',+$('gr').value||0);draw()};
  $('newround').onclick=e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again to reset all clocks';setTimeout(()=>{delete e.target.dataset.armed;e.target.textContent='New round'},3000);return}
    stop();S.idx=0;S.left=F.speeches.map(s=>s[3]);S.prep=[S.prepMin*60,S.prepMin*60];save();teardown();cleanup=round(key)};
  $('judge').onclick=openJudge;
  $('pm').onchange=()=>{const m=Math.max(0,Math.min(20,+$('pm').value||0));const d=m*60-S.prepMin*60;S.prepMin=m;S.prep=S.prep.map(p=>Math.max(0,p+d));save();draw()};
  ['n0','n1'].forEach((id,i)=>$(id).oninput=()=>{S.names[i]=$(id).value.trim()||F.sides[i];save();draw();$('prep'+i).querySelector('span').textContent=S.names[i]+' prep'});
  if($('swap'))$('swap').onclick=()=>{S.names.reverse();$('n0').value=S.names[0];$('n1').value=S.names[1];[0,1].forEach(i=>$('prep'+i).querySelector('span').textContent=S.names[i]+' prep');save();draw()};
  $('snd').onchange=()=>store.set('sound',$('snd').checked);
  keys=e=>{if(e.target.matches('input,textarea,select'))return;
    if(e.code==='Space'){e.preventDefault();$('go').click()}else if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();
    else if(/^[aA]$/.test(e.key))$('prep0').click();else if(/^[bB]$/.test(e.key))$('prep1').click();
    else if(/^[jJ]$/.test(e.key)){JV?closeJudge():openJudge()}else if(e.key==='Escape'&&JV)closeJudge()};
  function teardown(){if(JV){JV.remove();JV=null;jvPushed=false}jvPop=false;removeEventListener('popstate',onPop);document.removeEventListener('fullscreenchange',onFS)}
  draw();
  return teardown;
}

/* ── speech events ────────────────────────────────── */
function speech(key){
  if(!key||!EVENTS[key]){
    app.innerHTML=`<a class="back" href="#/">← Speech &amp; Debate</a><div class="top"><div><h1>Speech events</h1><p class="sub">Pick an event. Every timer has a 30-second grace period and full-screen hand signals.</p></div></div>
      <div class="hub">${Object.entries(EVENTS).map(([k,v],i)=>`<a class="b ${['butter','sky','peach','lilac','moss','','butter'][i]}" href="#/speech/${k}"><span class="art" data-art="speech"></span><span class="fmt">${E(v.name.toUpperCase())}</span><h2>${E(v.full)}</h2><div class="foot"><span class="muted">${E(v.note)}</span><span class="arrow"></span></div></a>`).join('')}</div>`;
    app.querySelectorAll('.arrow:empty').forEach(a=>a.outerHTML=SITE.arrow);return;
  }
  const V=EVENTS[key];
  const cfg=store.get('ev:'+key,{speak:V.speak||V.shared,prep:V.prep||0,grace:V.grace});
  let phase=V.prep?'prep':V.shared?'prep':'speak';   // prep | speak
  let left=V.shared?cfg.speak:phase==='prep'?cfg.prep:cfg.speak, run=false, last=0, used=0;
  app.innerHTML=`
    <a class="back" href="#/speech">← Speech events</a>
    <div class="top"><div><h1>${E(V.name)}</h1><p class="sub">${E(V.full)} · ${E(V.note)}</p></div></div>
    <div class="rt">
      <div class="clock sd2" id="clock">
        <div class="now"><span class="code" id="code"></span><span class="name" id="name"></span></div>
        <div class="digits" id="digits"></div><div class="csub" id="csub"></div>
        <div class="ctl"><button class="btn go" id="go">Start</button>${V.prep||V.shared?'<button class="btn sm ghost" id="phase">Start speech now</button>':''}<button class="btn sm ghost" id="reset">Reset</button><button class="btn sm ghost" id="sig">Hand signals ⛶</button></div>
        <p class="small" style="text-align:center">Space: start/pause · F: hand signals</p>
      </div>
      <div style="display:grid;gap:var(--gap);min-width:0">
      ${key==='extemp'?`<div class="box pad" id="pad"><div class="row" style="justify-content:space-between"><h2>Prep pad</h2><button class="btn sm ghost" id="padclear">Clear</button></div>
        <p class="small" style="margin:0">Your outline for this question. Saved on this device.</p>
        <div class="row"><input id="xq" placeholder="The question" maxlength="200" style="flex:1"><button class="btn sm ghost" id="xrand" title="Random practice question">Random</button></div>
        <input id="xa" placeholder="Your answer in one sentence" maxlength="200">
        ${[1,2,3].map(i=>`<div class="pt"><b>Point ${i}</b><textarea id="xp${i}" rows="2" placeholder="What's the point?" maxlength="600"></textarea><input id="xs${i}" placeholder="Source (publication, date)" maxlength="120"></div>`).join('')}
        <div class="small" id="xcount"></div></div>`:''}
      <div class="box"><h2>Settings</h2>
        ${V.prep?`<label class="setrow">Prep (minutes)<input id="cp" type="number" min="0" max="60" value="${cfg.prep/60}"></label>`:''}
        <label class="setrow">${V.shared?'Total time':'Speech'} (minutes)<input id="cs" type="number" min="1" max="30" step="0.5" value="${cfg.speak/60}"></label>
        <label class="setrow">Grace period (seconds)<input id="cg" type="number" min="0" max="120" step="5" value="${cfg.grace}"></label>
        <label class="check"><input type="checkbox" id="snd" ${store.get('sound',true)?'checked':''}> Beep at each minute signal and at time</label>
        <p class="small">Hand signals show whole minutes left, then “30”, then GRACE and STOP. Tap the full-screen card to close it.</p>
      </div>
      </div>
    </div>`;
  if(key==='extemp'){
    const IDS=['xq','xa','xp1','xs1','xp2','xs2','xp3','xs3'];
    const P=Object.assign({},store.get('extemp',{}));
    IDS.forEach(id=>{$(id).value=P[id]||''});
    const count=()=>{const n=[1,2,3].filter(i=>($('xs'+i).value||'').trim()).length,pts=[1,2,3].filter(i=>($('xp'+i).value||'').trim()).length;$('xcount').textContent=`${pts} of 3 points · ${n} source${n===1?'':'s'} cited${n<3?' · judges want a source for every point':''}`};
    IDS.forEach(id=>$(id).oninput=()=>{P[id]=$(id).value;store.set('extemp',P);count()});
    $('xrand').onclick=()=>{const L=TOPICS.extemp;$('xq').value=L[Math.floor(Math.random()*L.length)];$('xq').dispatchEvent(new Event('input'))};
    $('padclear').onclick=e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again to clear';setTimeout(()=>{delete e.target.dataset.armed;e.target.textContent='Clear'},3000);return}
      IDS.forEach(id=>{$(id).value='';delete P[id]});store.set('extemp',{});delete e.target.dataset.armed;e.target.textContent='Clear';count()};
    count();
  }
  const total=()=>V.shared?cfg.speak:phase==='prep'?cfg.prep:cfg.speak;
  function signalText(){
    if(left>0){if(left<=30)return '30';return String(Math.ceil(left/60))}
    return -left<=cfg.grace?'GRACE':'STOP';
  }
  function draw(){
    const d=$('digits');
    $('code').textContent=phase==='prep'?'Prep':'Speech';
    $('name').textContent=V.shared?(phase==='prep'?'Clock keeps running into your speech':'Speaking · '+fmtTc(used)+' used on prep'):'';
    d.textContent=left>=0?fmtTc(left):fmtT(left);
    d.className='digits'+(left<0&&-left<=cfg.grace&&phase==='speak'?' grace':left<0?' over':left<=60?' warn':'');
    $('csub').textContent=left<0&&phase==='speak'?(-left<=cfg.grace?'Grace period':'Over time'):run?(phase==='prep'?'Prepping':'Speaking'):'Ready';
    $('go').textContent=run?'Pause':'Start';
    if($('phase'))$('phase').hidden=phase!=='prep';
    const sg=document.querySelector('.signal');if(sg){const t=signalText();sg.querySelector('b').textContent=t;sg.className='signal'+(t==='GRACE'?' grace':t==='STOP'?' over':'')}
  }
  function loop(){
    const now=performance.now(),dt=(now-last)/1000;last=now;const b=left;left-=dt;if(phase==='prep'&&V.shared)used+=dt;
    if(phase==='speak'){if(Math.ceil(b/60)!==Math.ceil(left/60)&&left>0)beep(1);if(b>30&&left<=30)beep(1);if(b>0&&left<=0)beep(2);if(b>-cfg.grace&&left<=-cfg.grace)beep(3)}
    if(phase==='prep'&&left<=0){if(V.shared){phase='speak';beep(2)}else{beep(2);phase='speak';left=cfg.speak;stop()}}
    draw();
  }
  function start(){run=true;last=performance.now();tick(loop);wakeLock(true);draw()}
  function stop(){run=false;clearInterval(ticker);wakeLock(false);draw()}
  function reset(){stop();phase=V.prep||V.shared?'prep':'speak';left=total();used=0;draw()}
  $('go').onclick=()=>run?stop():start();
  $('reset').onclick=reset;
  if($('phase'))$('phase').onclick=()=>{if(V.shared){phase='speak'}else{phase='speak';left=cfg.speak}if(!run)start();draw()};
  const openSig=()=>{if(document.querySelector('.signal'))return;const s=document.createElement('div');s.className='signal';s.innerHTML='<b></b><small>Tap to close</small>';s.onclick=()=>{s.remove();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};document.body.append(s);try{s.requestFullscreen&&s.requestFullscreen().catch(()=>{})}catch(e){}draw()};
  $('sig').onclick=openSig;
  const upd=()=>{if($('cp'))cfg.prep=Math.max(0,+$('cp').value||0)*60;cfg.speak=Math.max(30,(+$('cs').value||1)*60);cfg.grace=Math.max(0,+$('cg').value||0);store.set('ev:'+key,cfg);if(!run)reset()};
  ['cp','cs','cg'].forEach(id=>$(id)&&($(id).onchange=upd));
  $('snd').onchange=()=>store.set('sound',$('snd').checked);
  keys=e=>{if(e.target.matches('input,textarea,select'))return;if(e.code==='Space'){e.preventDefault();$('go').click()}else if(/^[fF]$/.test(e.key))openSig()};
  reset();
}

/* ── congress ─────────────────────────────────────── */
/* NSDA Congressional Debate table of most frequently used parliamentary motions, in order of precedence.
   [motion, second?, debatable?, amendable?, vote, may interrupt a speaker?] */
const MOTIONS=[
  ['Privileged motions'],
  ['Fix the time to which to adjourn',1,0,1,'Majority',0],['Adjourn',1,0,0,'Majority',0],['Recess',1,0,1,'Majority',0],
  ['Rise to a question of privilege (personal privilege)',0,0,0,'Chair decides',1],['Call for the orders of the day',0,0,0,'None (a demand)',1],
  ['Incidental motions'],
  ['Appeal the decision of the chair',1,1,0,'Majority (tie upholds the chair)',1],['Rise to a point of order',0,0,0,'Chair decides',1],['Parliamentary inquiry',0,0,0,'Chair answers',1],
  ['Suspend the rules',1,0,0,'2/3',0],['Object to the consideration of a question',0,0,0,'2/3 against',1],['Division of the house (counted vote)',0,0,0,'None (chair must comply)',1],
  ['Withdraw a motion',0,0,0,'Majority if anyone objects',0],['Divide the question',1,0,1,'Majority',0],
  ['Subsidiary motions'],
  ['Lay on the table',1,0,0,'Majority',0],['Previous question (end debate, vote now)',1,0,0,'2/3',0],['Limit or extend debate',1,0,1,'2/3',0],
  ['Postpone to a certain time',1,1,1,'Majority',0],['Refer to a committee',1,1,1,'Majority',0],['Amend',1,1,1,'Majority · 1/3 to consider',0],['Postpone indefinitely',1,1,0,'Majority',0],
  ['Main motions'],
  ['Main motion (the bill or resolution)',1,1,1,'Majority',0],['Take from the table',1,0,0,'Majority',0],['Reconsider',1,1,0,'Majority',1],['Rescind',1,1,1,'2/3, or majority with notice',0]];
function congress(){
  const C=store.get('congress',{people:[],bills:[],cur:0,log:[],order:0});if(!C.queue)C.queue=[];
  let mode=null,left=0,run=false,last=0,qLeft=0,phase='speech';
  let qRun=false,qt=0,qName=null,ticking=false;   // 30-second clock for the questioner at the mic
  const QSEC=30;
  const save=()=>store.set('congress',C);
  app.innerHTML=`
    <a class="back" href="#/">← Speech &amp; Debate</a>
    <div class="top"><div><h1>Congress</h1><p class="sub">Speech and questioning timer, precedence and recency, the docket, and the motions table.</p></div></div>
    <div class="cg">
      <div style="display:grid;gap:var(--gap)">
        <div class="clock sd2" id="clock">
          <div class="now"><span class="code" id="code">Ready</span><span class="name" id="name">Pick a speech type</span></div>
          <div class="digits" id="digits">3:00</div><div class="csub" id="csub"></div>
          <div class="ctl"><button class="btn sm ghost" id="auth">Authorship / sponsorship<br><small>3:00 + 2:00 Q</small></button><button class="btn sm ghost" id="reg">Speech<br><small>3:00 + 1:00 Q</small></button></div>
          <div class="ctl"><button class="btn go" id="go" disabled>Start</button><button class="btn sm ghost" id="toq" hidden>Start questioning</button><button class="btn sm ghost" id="reset">Reset</button></div>
        </div>
        <div class="box"><div class="row" style="justify-content:space-between;align-items:baseline"><h2>Questioning queue</h2><span class="small">${QSEC} s per questioner</span></div>
          <p class="small" style="margin:0">Tap Q next to a name to queue them. Recognize whoever is next and their ${QSEC}-second clock starts.</p>
          <div id="qnow"></div><div class="queue" id="queue"></div></div>
        <div class="box"><div class="row" style="justify-content:space-between"><h2>Docket</h2></div>
          <div class="row"><input id="bill" placeholder="Add a bill or resolution" maxlength="120" style="flex:1"><button class="btn sm" id="addbill">Add</button></div>
          <div class="docket" id="docket"></div>
          <div><b style="font-size:13px">Speeches on this bill</b><div class="log" id="log"></div></div>
        </div>
      </div>
      <div style="display:grid;gap:var(--gap)">
      <div class="box"><div class="row" style="justify-content:space-between"><h2>Precedence</h2><button class="btn sm ghost" id="clear">Reset session</button></div>
        <p class="small">Add everyone in the chamber. The highlighted row has priority: fewest speeches first, then whoever spoke longest ago. Tap Aff or Neg when someone gives a speech, Q to put them in the questioning queue. The Q column counts how many times they were recognized.</p>
        <div class="row"><textarea id="ppl" rows="2" placeholder="Names, one per line" style="flex:1;min-height:0"></textarea><button class="btn sm" id="addppl">Add</button></div>
        <div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Sp.</th><th>Q</th><th>Last</th><th></th></tr></thead><tbody id="ptable"></tbody></table></div>
      </div>
      <details class="box motions" id="motions"${store.get('congressMotions',false)?' open':''}><summary>Motions cheat-sheet</summary>
        <p class="small" style="margin:0">The NSDA Congress table, highest precedence first. “Interrupt” means the motion may interrupt a speaker.</p>
        <div style="overflow-x:auto"><table><thead><tr><th>Motion</th><th>2nd</th><th>Debat.</th><th>Amend.</th><th>Vote</th><th>Interrupt</th></tr></thead><tbody>
          ${MOTIONS.map(m=>m.length===1?`<tr class="grp"><td colspan="6">${E(m[0])}</td></tr>`:`<tr><td>${E(m[0])}</td>${[m[1],m[2],m[3]].map(v=>`<td class="n">${v?'<span class="y">Yes</span>':'<span class="nn">No</span>'}</td>`).join('')}<td>${E(m[4])}</td><td class="n">${m[5]?'<span class="y">Yes</span>':'<span class="nn">No</span>'}</td></tr>`).join('')}
        </tbody></table></div>
        <p class="small" style="margin:0">Previous question needs two-thirds. Amendments need a second and one-third of the chamber to be considered, then a majority to pass. A point of personal privilege and a point of order never need a second.</p>
      </details>
      </div>
    </div>`;
  $('motions').ontoggle=()=>store.set('congressMotions',$('motions').open);
  function drawClock(){
    const d=$('digits');
    $('code').textContent=mode?(phase==='speech'?'Speech':'Questioning'):'Ready';
    $('name').textContent=mode?(mode==='auth'?'Authorship / sponsorship':'Speech'):'Pick a speech type';
    d.textContent=left>=0?fmtTc(left):fmtT(left);
    d.className='digits'+(left<0?' over':left<=30&&mode?' warn':'');
    $('csub').textContent=left<0?'Over time':run?'Running':mode?'Paused':'';
    $('go').disabled=!mode;$('go').textContent=run?'Pause':'Start';
    $('toq').hidden=!(mode&&phase==='speech');
  }
  function drawQueue(){
    $('qnow').innerHTML=qName?`<div class="qnow"><div><span class="qn">${E(qName)}</span><div class="small">${qRun?(qt<0?'Over their '+QSEC+' seconds':'Asking'):'Paused'}</div></div><div class="row" style="align-items:center"><b class="${qt<0?'over':qt<=5?'warn':''}">${qt>=0?fmtTc(qt):fmtT(qt)}</b><button class="mini" id="qpause">${qRun?'Pause':'Resume'}</button><button class="mini" id="qdone">Done</button></div></div>`:'';
    $('queue').innerHTML=C.queue.map((n,i)=>`<div class="qi"><small>${i+1}.</small><span>${E(n)}</span>${i===0?'<button class="mini af" data-rec="0">Recognize ▶</button>':''}<button class="mini" data-unq="${i}" aria-label="Remove from queue">✕</button></div>`).join('')||'<p class="small" style="margin:0">Nobody in the queue.</p>';
  }
  function sync(){if(run||qRun){if(!ticking){last=performance.now();tick(loop);ticking=true}wakeLock(true)}else{clearInterval(ticker);ticking=false;wakeLock(false)}}
  function loop(){const now=performance.now(),dt=(now-last)/1000;last=now;
    if(run){const b=left;left-=dt;if(b>30&&left<=30)beep(1);if(b>0&&left<=0)beep(2);drawClock()}
    if(qRun){const b=qt;qt-=dt;if(b>5&&qt<=5)beep(1);if(b>0&&qt<=0)beep(2);drawQueue()}}
  const start=()=>{run=true;sync();drawClock()};
  const stop=()=>{run=false;sync();drawClock()};
  const setMode=m=>{stop();mode=m;phase='speech';left=180;qLeft=m==='auth'?120:60;drawClock()};
  $('auth').onclick=()=>setMode('auth');$('reg').onclick=()=>setMode('reg');
  $('go').onclick=()=>run?stop():start();
  $('toq').onclick=()=>{phase='questioning';left=qLeft;start()};
  $('reset').onclick=()=>{stop();if(mode){phase='speech';left=180}drawClock()};
  function recognize(i){
    const n=C.queue.splice(i,1)[0];if(!n)return;
    const p=C.people.find(x=>x.name===n);if(p)p.q++;
    qName=n;qt=QSEC;qRun=true;save();sync();drawQueue();drawPeople();
  }
  $('queue').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.rec!==undefined)recognize(+b.dataset.rec);
    if(b.dataset.unq!==undefined){C.queue.splice(+b.dataset.unq,1);save();drawQueue();drawPeople()}};
  $('qnow').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.id==='qpause'){qRun=!qRun;sync();drawQueue()}
    if(b.id==='qdone'){qRun=false;qName=null;sync();drawQueue()}};
  function drawPeople(){
    const ranked=C.people.map((p,i)=>({...p,i})).sort((a,b)=>a.sp-b.sp||(a.last||0)-(b.last||0)||a.i-b.i);
    const nextI=ranked.length?ranked[0].i:-1;
    $('ptable').innerHTML=C.people.map((p,i)=>{const qd=C.queue.includes(p.name);return `<tr class="${i===nextI?'next':''}"><td>${E(p.name)}</td><td class="n">${p.sp}</td><td class="n">${p.q}</td><td class="n">${p.last?'#'+p.last:'–'}</td>
      <td style="white-space:nowrap"><button class="mini af" data-sp="${i}" data-side="Aff">Aff</button> <button class="mini ng" data-sp="${i}" data-side="Neg">Neg</button> <button class="mini${qd?' on':''}" data-q="${i}" aria-pressed="${qd}" title="${qd?'Remove from the questioning queue':'Queue to ask a question'}">Q</button> <button class="mini" data-rm="${i}" aria-label="Remove">✕</button></td></tr>`}).join('')||'<tr><td colspan="5" class="small">No one added yet.</td></tr>';
  }
  function drawDocket(){
    $('docket').innerHTML=C.bills.map((b,i)=>`<div class="bill ${i===C.cur?'cur':''}"><span>${i+1}. ${E(b)}</span>${i===C.cur?'<small>On the floor</small>':`<button class="mini" data-cur="${i}">Bring up</button>`}<button class="mini" data-rmb="${i}" aria-label="Remove">✕</button></div>`).join('')||'<p class="small">No bills yet.</p>';
    const L=C.log.filter(l=>l.bill===C.cur);
    const nextSide=L.length?(L[L.length-1].side==='Aff'?'Neg':'Aff'):'Aff (authorship)';
    $('log').innerHTML=(L.map((l,i)=>`<span>${i+1}. ${E(l.name)} · ${l.side}</span>`).join('')||'<span>No speeches yet.</span>')+`<span style="color:var(--ink)"><b>Next:</b> ${nextSide}</span>`;
  }
  $('addppl').onclick=()=>{$('ppl').value.split(/\n|,/).map(s=>s.trim()).filter(Boolean).forEach(n=>C.people.push({name:n.slice(0,40),sp:0,q:0,last:0}));$('ppl').value='';save();drawPeople()};
  $('addbill').onclick=()=>{const v=$('bill').value.trim();if(!v)return;C.bills.push(v.slice(0,120));$('bill').value='';save();drawDocket()};
  $('bill').onkeydown=e=>{if(e.key==='Enter')$('addbill').click()};
  $('ptable').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.sp!==undefined){const p=C.people[+b.dataset.sp];p.sp++;p.last=++C.order;C.log.push({bill:C.cur,name:p.name,side:b.dataset.side});}
    if(b.dataset.q!==undefined){const n=C.people[+b.dataset.q].name,j=C.queue.indexOf(n);if(j>=0)C.queue.splice(j,1);else C.queue.push(n)}
    if(b.dataset.rm!==undefined){const n=C.people[+b.dataset.rm].name;C.people.splice(+b.dataset.rm,1);if(!C.people.some(x=>x.name===n))C.queue=C.queue.filter(x=>x!==n)}
    save();drawPeople();drawDocket();drawQueue()};
  $('docket').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cur!==undefined)C.cur=+b.dataset.cur;if(b.dataset.rmb!==undefined){const i=+b.dataset.rmb;C.bills.splice(i,1);C.log=C.log.filter(l=>l.bill!==i).map(l=>({...l,bill:l.bill>i?l.bill-1:l.bill}));if(C.cur>i)C.cur--;if(C.cur>=C.bills.length)C.cur=Math.max(0,C.bills.length-1)}save();drawDocket()};
  $('clear').onclick=e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again to clear everything';setTimeout(()=>{delete e.target.dataset.armed;e.target.textContent='Reset session'},3000);return}
    Object.assign(C,{people:[],bills:[],cur:0,log:[],order:0,queue:[]});save();congress()};
  keys=e=>{if(e.target.matches('input,textarea,select'))return;if(e.code==='Space'&&mode){e.preventDefault();$('go').click()}};
  drawClock();drawPeople();drawDocket();drawQueue();
}

/* ── flow sheet ───────────────────────────────────── */
const agoStr=ts=>{if(!ts)return '';const d=Date.now()-ts;if(d<60e3)return 'just now';if(d<3600e3)return Math.round(d/60e3)+' min ago';if(d<86400e3)return Math.round(d/3600e3)+' h ago';if(d<172800e3)return 'yesterday';return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
function flow(){
  const sheets=store.get('flows',[]);
  let curId=store.get('flowCur',null);
  if(!sheets.find(s=>s.id===curId))curId=null;
  const make=fmt=>{const F=FORMATS[fmt];const s={id:Date.now().toString(36),fmt,name:F.short+' round · '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),cols:{},meta:{},cx:false,at:Date.now()};sheets.unshift(s);curId=s.id;persist();return s};
  const persist=()=>{store.set('flows',sheets.slice(0,30));store.set('flowCur',curId)};
  const touch=()=>{S.at=Date.now();persist()};
  let S=sheets.find(s=>s.id===curId)||make('ld');
  if(!S.meta)S.meta={};
  /* columns: every speech except crossfire/CX, plus the CX columns when the toggle is on. Keys: the speech code, or code#index for cross-ex. */
  const colsOf=sh=>{const F=FORMATS[sh.fmt];return F.speeches.map((x,i)=>{const cx=x[2]===2||x[0]==='CX';return{code:x[0],name:x[1],side:x[2],i,cx,key:cx?x[0]+'#'+i:x[0]}}).filter(c=>!c.cx||sh.cx)};
  const lines=k=>(S.cols[k]||'').split('\n');
  const metaOf=k=>{const L=lines(k).length,m=S.meta[k]||(S.meta[k]=[]);while(m.length<L)m.push({});m.length=L;return m};
  const TAGS=['','a','b','i'],TCLS={a:'ta',b:'tb',i:'ti'};
  const lnClass=m=>'ln'+(m&&TCLS[m.t]?' '+TCLS[m.t]:'')+(m&&m.d?' dd':'');
  const preview=sh=>{for(const c of colsOf(sh)){const l=(sh.cols[c.key]||'').split('\n').map(x=>x.trim()).find(Boolean);if(l)return c.code+': '+l}return 'Empty'};
  function draw(){
    const F=FORMATS[S.fmt],cols=colsOf(S);
    app.innerHTML=`
      <a class="back" href="#/">← Speech &amp; Debate</a>
      <div class="top"><div><h1>Flow</h1><p class="sub">Saved on this device as you type.</p></div></div>
      <div class="flowbar">
        <input id="fname" value="${E(S.name)}" maxlength="60" aria-label="Flow name" style="flex:1;min-width:160px">
        <div class="seg">${Object.entries(FORMATS).map(([k,v])=>`<button data-new="${k}">+ ${v.short}</button>`).join('')}</div>
        <label class="check"><input type="checkbox" id="cxt" ${S.cx?'checked':''}> Cross-ex columns</label>
        <button class="btn sm ghost" id="copytxt">Copy as text</button><button class="btn sm ghost" id="print">Print / PDF</button><button class="btn sm ghost" id="dl">Download</button><button class="btn sm ghost" id="del">Delete</button>
      </div>
      <details class="flist" id="flist"><summary><span>Saved flows · ${sheets.length}</span></summary><div class="fls">${sheets.map(sh=>`<button class="fl1${sh.id===S.id?' cur':''}" data-open="${sh.id}"><b>${E(sh.name)}</b><small>${FORMATS[sh.fmt].short} · ${sh.at?'edited '+agoStr(sh.at):'not edited'}</small><span class="prev">${E(preview(sh))}</span></button>`).join('')}</div></details>
      <div class="printhead">${E(S.name)}<small>${E(F.name)} · ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</small></div>
      <div class="flow">${cols.map(c=>{const m=metaOf(c.key),L=lines(c.key);const nxt=nextCol(cols,c);return `<div class="col sd${c.side}${c.cx?' cx':''}" data-col="${E(c.key)}"><h3><span>${E(c.code)}</span><small class="small">${c.cx?E(c.name):E(F.sides[c.side])}</small></h3>
        <div class="ctools"><button data-ext="${E(c.key)}" ${nxt?`title="Copy the selected text (or the whole column) into ${E(nxt.code)}"`:'disabled title="Last speech on this side"'}>Extend →${nxt?' '+E(nxt.code):''}</button><button data-drop="${E(c.key)}" title="Strike through the line your cursor is on">Drop</button></div>
        <div class="cell"><div class="mirror" aria-hidden="true">${L.map((l,i)=>`<div class="${lnClass(m[i])}">${E(l)}</div>`).join('')}</div><textarea data-c="${E(c.key)}" aria-label="${E(c.code)} notes" placeholder="${E(c.name)}">${E(S.cols[c.key]||'')}</textarea></div></div>`}).join('')}</div>
      <p class="flowhint">Click the dot at a line's left edge to tag it: <i style="background:var(--a)"></i>${E(F.sides[0])} · <i style="background:var(--b)"></i>${E(F.sides[1])} · <i style="background:var(--warn)"></i>important. Drop strikes through the line your cursor is on. Extend copies lines forward with a → so you can see what carried through.</p>`;
    app.querySelectorAll('.cell').forEach(cell=>{
      const ta=cell.querySelector('textarea'),mir=cell.querySelector('.mirror'),key=ta.dataset.c;let prev=ta.value;
      const size=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px'};
      const render=()=>{const m=metaOf(key),L=lines(key);mir.innerHTML=L.map((l,i)=>`<div class="${lnClass(m[i])}">${E(l)}</div>`).join('');size()};
      ta.oninput=()=>{const v=ta.value,ol=prev.split('\n').length,nl=v.split('\n').length,m=metaOf(key);
        const caret=v.slice(0,ta.selectionStart).split('\n').length-1;
        if(nl>ol)m.splice(caret-(nl-ol)+1,0,...Array.from({length:nl-ol},()=>({})));
        else if(nl<ol)m.splice(caret+1,ol-nl);
        S.cols[key]=v;prev=v;touch();render()};
      mir.onclick=e=>{const ln=e.target.closest('.ln');if(!ln)return;const i=[...mir.children].indexOf(ln),m=metaOf(key);m[i].t=TAGS[(TAGS.indexOf(m[i].t||'')+1)%TAGS.length];if(!m[i].t)delete m[i].t;touch();ln.className=lnClass(m[i])};
      cell.onclick=e=>{if(e.target===cell)ta.focus()};
      cell._render=render;size();
    });
    $('fname').oninput=()=>{S.name=$('fname').value||'Untitled';touch();const b=app.querySelector(`[data-open="${S.id}"] b`);if(b)b.textContent=S.name};
    $('flist').onclick=e=>{const b=e.target.closest('[data-open]');if(!b)return;S=sheets.find(s=>s.id===b.dataset.open);if(!S.meta)S.meta={};curId=S.id;persist();draw()};
    app.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{S=make(b.dataset.new);draw()});
    $('cxt').onchange=()=>{S.cx=$('cxt').checked;persist();draw()};
    app.querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>extend(cols,b.dataset.ext));
    app.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>drop(b.dataset.drop));
    $('copytxt').onclick=async()=>{const t=asText(cols);let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){try{const x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.append(x);x.select();ok=document.execCommand('copy');x.remove()}catch(e2){}}
      $('copytxt').textContent=ok?'Copied ✓':'Couldn\'t copy';setTimeout(()=>{const c=$('copytxt');if(c)c.textContent='Copy as text'},1800)};
    $('print').onclick=()=>{try{window.print()}catch(e){}};
    $('dl').onclick=()=>{const txt=S.name+'\n\n'+cols.map(c=>`== ${c.code} (${c.cx?c.name:F.sides[c.side]}) ==\n${markLines(c.key).join('\n')}`).join('\n\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download=S.name.replace(/[^\w\- ]+/g,'')+'.txt';a.click()};
    $('del').onclick=e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again';setTimeout(()=>{delete e.target.dataset.armed;e.target.textContent='Delete'},3000);return}
      sheets.splice(sheets.indexOf(S),1);S=sheets[0]||make('ld');if(!S.meta)S.meta={};curId=S.id;persist();draw()};
  }
  const nextCol=(cols,c)=>c.cx?null:cols.find(x=>!x.cx&&x.side===c.side&&x.i>c.i)||null;
  const cellOf=key=>app.querySelector(`.col[data-col="${CSS.escape(key)}"]`);
  const markLines=key=>{const m=metaOf(key);return lines(key).map((l,i)=>{const x=m[i]||{};return (x.d?'✗ ':'')+(x.t==='a'?'[A] ':x.t==='b'?'[N] ':x.t==='i'?'[!] ':'')+l})};
  function asText(cols){const F=FORMATS[S.fmt];const L=cols.map(c=>markLines(c.key).map(l=>l.replace(/\t/g,'  ')));const n=Math.max(0,...L.map(x=>x.length));
    const rows=[cols.map(c=>c.code+' ('+(c.cx?'CX':F.sides[c.side])+')').join('\t')];for(let i=0;i<n;i++)rows.push(L.map(x=>x[i]||'').join('\t'));return S.name+'\n'+rows.join('\n')}
  function extend(cols,key){
    const c=cols.find(x=>x.key===key),nxt=nextCol(cols,c);if(!nxt)return;
    const ta=cellOf(key).querySelector('textarea'),m=metaOf(key),v=ta.value;
    const sel=ta.selectionStart!==ta.selectionEnd;
    const a=sel?ta.selectionStart:0,b=sel?ta.selectionEnd:v.length;
    const first=v.slice(0,a).split('\n').length-1;
    const picked=v.slice(a,b).split('\n').map((l,i)=>({l:l.trim(),m:m[first+i]||{}})).filter(x=>x.l&&!x.m.d);
    if(!picked.length)return;
    const tk=nxt.key,tm=metaOf(tk),cur=(S.cols[tk]||'').replace(/\s+$/,'');
    const add=picked.map(x=>'→ '+x.l.replace(/^(→ )+/,''));
    const base=cur?cur.split('\n'):[];S.cols[tk]=base.concat(add).join('\n');
    tm.length=base.length;picked.forEach(x=>tm.push(x.m.t?{t:x.m.t}:{}));
    touch();
    const tcol=cellOf(tk),tta=tcol.querySelector('textarea');tta.value=S.cols[tk];tcol.querySelector('.cell')._render();
    tcol.classList.remove('flash');void tcol.offsetWidth;tcol.classList.add('flash');tcol.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'});
  }
  function drop(key){
    const ta=cellOf(key).querySelector('textarea'),m=metaOf(key),v=ta.value;
    const a=v.slice(0,ta.selectionStart).split('\n').length-1,b=v.slice(0,ta.selectionEnd).split('\n').length-1;
    const on=!m[a].d;for(let i=a;i<=b;i++){if(on)m[i].d=true;else delete m[i].d}
    touch();cellOf(key).querySelector('.cell')._render();
  }
  const onResize=()=>app.querySelectorAll('.cell').forEach(c=>c._render&&c._render());
  addEventListener('resize',onResize);
  keys=null;draw();
  return ()=>removeEventListener('resize',onResize);
}
