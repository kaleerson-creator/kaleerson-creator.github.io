<style>
:root{--a:#2451C9;--a-t:#DCE8FB;--b:#B8322F;--b-t:#FBE2DA;--n:#1E3A2C;--n-t:#DCEBD0;--warn:#B86E00;--over:#D12C2C}

main.pg{flex:1;padding-block:0 64px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:24px 0 14px}
.top h1{font-size:clamp(40px,7vw,76px)}
.top .sub{color:var(--ink2);margin-top:8px}
.back{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--ink2);padding:16px 0 0}
.back:hover{color:var(--ink)}
.box{background:var(--card);border-radius:24px;padding:20px;display:grid;gap:12px;min-width:0}
.box h2{font-size:24px;letter-spacing:-.03em}
.muted{color:var(--ink2)}
.small{font-size:13px;color:var(--ink2)}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;gap:4px;background:var(--card);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--ink2);padding:8px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}

/* hub */
.hub{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--gap)}
.hub .b{grid-column:span 2;min-height:170px}
.hub .b.w{grid-column:span 3}
@media (max-width:900px){.hub{grid-template-columns:repeat(2,1fr)}.hub .b,.hub .b.w{grid-column:span 1}}
@media (max-width:520px){.hub .b,.hub .b.w{grid-column:span 2}}
.hub .b .blob{width:140px;aspect-ratio:1;right:-40px;bottom:-50px;background:#ffffff66}
.hub .b h2{font-size:clamp(26px,3vw,34px)}
.hub .fmt{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.06em}

/* round timer */
.rt{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:860px){.rt{grid-template-columns:1fr}}
.clock{background:var(--card);border-radius:28px;padding:22px;display:grid;gap:12px;position:relative;overflow:hidden;isolation:isolate}
.clock::before{content:"";position:absolute;z-index:-1;width:300px;aspect-ratio:1;right:-90px;top:-120px;background:var(--side-t,var(--paper));border-radius:58% 42% 51% 49% / 46% 55% 45% 54%;animation:morph 14s ease-in-out infinite}
.clock.sd0{--side:var(--a);--side-t:var(--a-t)}.clock.sd1{--side:var(--b);--side-t:var(--b-t)}.clock.sd2{--side:var(--n);--side-t:var(--n-t)}
.now{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.now .code{font:800 30px/1 var(--display);color:var(--side)}
.now .name{color:var(--ink2);font-weight:500}
.pchip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--warn);color:#fff;align-self:center}

.digits.warn{color:var(--warn)}
.digits.over{color:var(--over);animation:pulse 1s steps(2,start) infinite}
.digits.grace{color:var(--warn)}

.csub{text-align:center;color:var(--ink2);font-size:13px;min-height:1.2em}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.ctl .btn{min-width:110px;justify-content:center}
#prev,#next{min-width:64px;font-size:20px}
.btn.go{background:var(--side,var(--ink));font-size:17px;padding:15px 26px;min-width:150px}
.preps{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prep{border:0;border-radius:20px;padding:12px 14px;display:grid;gap:2px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.prep.sd0{background:var(--a-t)}.prep.sd1{background:var(--b-t)}
.prep b{font:700 28px/1 var(--display);font-variant-numeric:tabular-nums}
.prep span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.prep.on{outline:3px solid var(--warn);outline-offset:-3px}
.prep.out b{color:var(--over)}
.list{display:grid;gap:4px}
.sp{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-radius:14px;border:0;background:none;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.sp:hover{background:var(--paper)}
.sp.cur{background:var(--paper);box-shadow:inset 3px 0 0 var(--sc)}
.sp.done{color:var(--ink3)}
.sp code{font:800 14px/1 var(--display);color:var(--sc)}
.sp.sd0{--sc:var(--a)}.sp.sd1{--sc:var(--b)}.sp.sd2{--sc:var(--n)}
.sp small{font-variant-numeric:tabular-nums;color:var(--ink2)}
.names{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.names input{width:100%}
.names button{font:inherit;border:0;background:var(--paper);border-radius:999px;width:38px;height:38px;cursor:pointer}
.setrow{display:grid;grid-template-columns:1fr 90px;gap:10px;align-items:center;font-size:14px}
.setrow input{width:100%;text-align:right}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:auto}

/* speech events */
.signal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:var(--ink);color:var(--on-ink);cursor:pointer}
.signal b{font:800 min(70vw,70vh)/1 var(--display);font-variant-numeric:tabular-nums}
.signal.grace{background:var(--warn)}.signal.over{background:var(--over)}
.signal small{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);font-size:14px;opacity:.7}

/* congress */
.cg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:860px){.cg{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600;padding:6px}
td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:middle}
td.n{font-variant-numeric:tabular-nums;text-align:center}
tr.next td{background:#fbf3cf}
.mini{font:inherit;font-size:12px;font-weight:600;border:0;border-radius:999px;padding:6px 10px;cursor:pointer;background:var(--paper)}
.mini.af{background:var(--a-t)}.mini.ng{background:var(--b-t)}
.docket{display:grid;gap:6px}
.bill{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--paper);font-size:14px}
.bill.cur{background:var(--n-t);font-weight:600}
.bill span{flex:1;min-width:0;overflow-wrap:anywhere}
.log{font-size:13px;color:var(--ink2);display:grid;gap:3px;max-height:220px;overflow:auto}

/* flow */
.flowbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:var(--gap)}
.flow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:8px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--card);border-radius:18px;padding:10px;display:grid;grid-template-rows:auto 1fr;gap:6px;min-height:62vh}
.col h3{font:800 15px/1.1 var(--display);letter-spacing:-.01em;display:flex;justify-content:space-between;gap:6px}
.col.sd0 h3{color:var(--a)}.col.sd1 h3{color:var(--b)}
.col textarea{border:0;background:var(--paper);border-radius:12px;resize:none;font-size:14px;line-height:1.45;padding:10px;height:100%;min-height:52vh}

/* topics */
.prompt{background:var(--forest);color:var(--forest-ink);border-radius:var(--r);padding:28px;display:grid;gap:14px;min-height:220px;align-content:center;position:relative;overflow:hidden;isolation:isolate}
.prompt .blob{width:200px;aspect-ratio:1;right:-60px;top:-70px;background:#2E5440}
.prompt q{font:800 clamp(26px,4vw,42px)/1.12 var(--display);letter-spacing:-.025em;quotes:none}
.prompt .lbl{color:#B9C9AE}

/* speech drill */
.dr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:var(--gap);align-items:start}
.drmain,.drside{display:grid;gap:var(--gap);min-width:0}
@media (max-width:860px){.dr{grid-template-columns:1fr}}
.dr .prompt{min-height:0}
.digits.over{color:var(--over)}
.transcript{font-size:17px;line-height:1.6;max-height:300px;overflow:auto;overflow-wrap:anywhere}
.transcript mark{background:var(--butter);color:var(--ink);border-radius:5px;padding:0 3px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:var(--paper);border-radius:14px;padding:12px;display:grid}
.stats b{font-family:var(--display);font-size:32px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink2)}
.fl{display:flex;gap:6px;flex-wrap:wrap}
.fl span{background:var(--butter);border-radius:999px;padding:4px 10px;font-size:13px}
.hist{display:grid;gap:6px;font-size:13px}
.hist div{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--paper);border-radius:10px;padding:8px 10px}
#tap b{margin-left:4px;font-variant-numeric:tabular-nums}
/* ballot */
.bal{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}
.bal .w{grid-column:1/-1}
@media (max-width:760px){.bal{grid-template-columns:1fr}}
.sidebox.sd0{box-shadow:inset 0 5px 0 var(--a)}.sidebox.sd1{box-shadow:inset 0 5px 0 var(--b)}
.deb{display:grid;gap:6px;background:var(--paper);border-radius:14px;padding:10px}
.deb textarea,.bal textarea{width:100%;resize:vertical}
.bal input{width:100%}.deb .row input{width:auto}
.btn.win[aria-pressed=true]{background:var(--n);color:var(--card)}
.btn.win[aria-pressed=false]{background:transparent;color:var(--ink)!important;box-shadow:inset 0 0 0 1.5px var(--line)}
/* cases */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--gap)}
.card{background:var(--card);border-radius:20px;padding:16px;display:grid;gap:6px;align-content:start;min-width:0}
.card:hover{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.card b{font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.ctag{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.cite{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.cbody{font-size:13px;color:var(--ink2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.ced{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:start}
@media (max-width:860px){.ced{grid-template-columns:1fr}}
.ced input,.ced textarea{width:100%}.ced textarea{resize:vertical;min-height:260px}
.cardview{display:grid;gap:6px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.cardview .ptag{font-size:18px}
.cardview mark{background:#f6e27a;color:#141613;padding:0 2px}
.tshare{color:var(--a)}
.team{display:grid;gap:8px;background:var(--paper);border-radius:16px;padding:14px;margin-top:8px}
.tcode{font:800 22px/1 var(--display);letter-spacing:.14em;background:var(--card);border-radius:10px;padding:8px 12px}
.roster{display:flex;flex-wrap:wrap;gap:6px}.roster span{background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}.roster small{color:var(--ink2);font-weight:500}
.cbody2{color:var(--ink2)}.cbody2 u{color:var(--ink);font-size:15px}
.btn.danger{background:#fef3f2;color:#b42318}
code{background:var(--paper);padding:1px 6px;border-radius:6px;font-size:.9em}
</style>

<script>
const $=id=>document.getElementById(id);
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=$('app');
const store={get(k,d){try{const v=localStorage.getItem('debate:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('debate:'+k,JSON.stringify(v))}catch(e){}}};
const fmtT=s=>{const neg=s<0;s=Math.abs(Math.round(s));return (neg?'+':'')+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtTc=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

/* ── formats ─────────────────────────────────────────
   speech: [code, name, side (0 first side, 1 second side, 2 both), seconds] */
const FORMATS={
  ld:{name:'Lincoln-Douglas',short:'LD',sides:['Aff','Neg'],prep:240,note:'NSDA 6-3-7-3-4-6-3',speeches:[
    ['AC','Affirmative constructive',0,360],['CX','Cross-ex (Neg asks)',1,180],['NC','Negative constructive',1,420],['CX','Cross-ex (Aff asks)',0,180],
    ['1AR','First affirmative rebuttal',0,240],['NR','Negative rebuttal',1,360],['2AR','Second affirmative rebuttal',0,180]]},
  pf:{name:'Public Forum',short:'PF',sides:['Pro','Con'],prep:180,swap:true,note:'4-4-3-4-4-3-3-3-3-2-2',speeches:[
    ['A1','First speaker constructive',0,240],['B1','First speaker constructive',1,240],['CF','Crossfire (first speakers)',2,180],
    ['A2','Second speaker rebuttal',0,240],['B2','Second speaker rebuttal',1,240],['CF','Crossfire (second speakers)',2,180],
    ['AS','First speaker summary',0,180],['BS','First speaker summary',1,180],['GCF','Grand crossfire',2,180],
    ['AFF','Second speaker final focus',0,120],['BFF','Second speaker final focus',1,120]]},
  policy:{name:'Policy (CX)',short:'CX',sides:['Aff','Neg'],prep:480,note:'8-3 constructives, 5-minute rebuttals',speeches:[
    ['1AC','First affirmative constructive',0,480],['CX','Cross-ex (2N asks 1A)',1,180],['1NC','First negative constructive',1,480],['CX','Cross-ex (1A asks 1N)',0,180],
    ['2AC','Second affirmative constructive',0,480],['CX','Cross-ex (1N asks 2A)',1,180],['2NC','Second negative constructive',1,480],['CX','Cross-ex (2A asks 2N)',0,180],
    ['1NR','First negative rebuttal',1,300],['1AR','First affirmative rebuttal',0,300],['2NR','Second negative rebuttal',1,300],['2AR','Second affirmative rebuttal',0,300]]}
};
const EVENTS={
  extemp:{name:'Extemp',full:'Extemporaneous Speaking',prep:1800,speak:420,grace:30,note:'30 min prep, 7 min speech'},
  impromptu:{name:'Impromptu',full:'Impromptu',shared:420,grace:30,note:'7 minutes total, split between prep and speaking'},
  oo:{name:'Oratory',full:'Original Oratory',speak:600,grace:30,note:'10 minutes, memorized'},
  info:{name:'Info',full:'Informative Speaking',speak:600,grace:30,note:'10 minutes, visual aids allowed'},
  interp:{name:'Interp',full:'DI · HI · Duo · POI · Prose · Poetry',speak:600,grace:30,note:'10 minutes including intro'},
  story:{name:'Storytelling',full:'Storytelling',speak:300,grace:30,note:'5 minutes'},
  custom:{name:'Custom',full:'Custom speech timer',speak:300,grace:30,note:'Set your own time'}
};

/* ── shared ticking clock ─────────────────────────── */
let ticker=null;const tick=fn=>{clearInterval(ticker);ticker=setInterval(fn,200)};
let audioCtx=null;
function beep(n=1){if(!store.get('sound',true))return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();for(let i=0;i<n;i++){const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);const t=audioCtx.currentTime+i*.28;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.25)}}catch(e){}}
function wakeLock(on){try{if(on&&navigator.wakeLock&&!window.__wl)navigator.wakeLock.request('screen').then(l=>{window.__wl=l;l.addEventListener('release',()=>window.__wl=null)}).catch(()=>{});if(!on&&window.__wl){window.__wl.release();window.__wl=null}}catch(e){}}

      <a class="b peach" href="#/round/pf"><span class="art" data-art="pf"></span><span class="fmt">PF</span><h2>Public Forum</h2><div class="foot"><span class="muted">Crossfires · 3 min prep</span><span class="arrow"></span></div></a>
      <a class="b lilac" href="#/round/policy"><span class="art" data-art="policy"></span><span class="fmt">CX</span><h2>Policy</h2><div class="foot"><span class="muted">8-3 / 5 · 8 min prep</span><span class="arrow"></span></div></a>
      <a class="b forest w" href="#/congress"><span class="art" data-art="congress"></span><span class="fmt" style="color:#B9C9AE">CONGRESS</span><h2>Congress</h2><div class="foot"><span class="muted">Speech + questioning timer, precedence tracker, docket</span><span class="arrow"></span></div></a>
      <a class="b butter w" href="#/speech"><span class="art" data-art="speech"></span><span class="fmt">SPEECH</span><h2>Speech events</h2><div class="foot"><span class="muted">Extemp, Impromptu, Oratory, Info, Interp · grace + hand signals</span><span class="arrow"></span></div></a>
      <a class="b moss w" href="#/flow"><span class="art" data-art="flow"></span><span class="fmt">PRACTICE</span><h2>Flow sheet</h2><div class="foot"><span class="muted">Take notes column by column, saved on this device</span><span class="arrow"></span></div></a>
      <a class="b w" href="#/topics"><span class="art" data-art="topics"></span><span class="fmt">PRACTICE</span><h2>Practice topics</h2><div class="foot"><span class="muted">Resolutions, impromptu prompts, extemp questions</span><span class="arrow"></span></div></a>
      <a class="b peach" href="#/drill"><span class="art" data-art="drill"></span><span class="fmt">NEW · PRACTICE</span><h2>Speech drill</h2><div class="foot"><span class="muted">Counts your "um"s and "like"s live</span><span class="arrow"></span></div></a>
      <a class="b sky" href="#/cases"><span class="art" data-art="cases"></span><span class="fmt">NEW · PREP</span><h2>Cases &amp; evidence</h2><div class="foot"><span class="muted">Your private card library, on every device</span><span class="arrow"></span></div></a>
      <a class="b lilac" href="#/ballot"><span class="art" data-art="ballot"></span><span class="fmt">NEW · JUDGING</span><h2>Ballot helper</h2><div class="foot"><span class="muted">Points, RFD, copy to Tabroom</span><span class="arrow"></span></div></a>
    </div>`;
  app.querySelectorAll('.arrow:empty').forEach(a=>a.outerHTML=SITE.arrow);

/* ── round timer (LD / PF / Policy) ───────────────── */
function round(key){
  const F=FORMATS[key];if(!F)return hub();
  const saved=store.get('round:'+key,null);
  const S=saved||{idx:0,left:F.speeches.map(s=>s[3]),prep:[F.prep,F.prep],prepMin:F.prep/60,names:F.sides.slice()};
  if(!S.names)S.names=F.sides.slice();
  let run=null,last=0;  // run: 'speech' | 0 | 1 (prep side)
  const save=()=>store.set('round:'+key,S);
  const sideName=i=>i===2?'Both':E(S.names[i]);
  app.innerHTML=`
    <a class="back" href="#/">← Speech &amp; Debate</a>
    <div class="top"><div><h1>${F.name}</h1><p class="sub">${F.note}${key==='ld'?' · <a href="/ldtimer/" style="text-decoration:underline">Classic LD Timer</a>':''}</p></div>
      <div class="row"><button class="btn sm ghost" id="newround">New round</button></div></div>
    <div class="rt">
      <div class="clock" id="clock">
        <div class="now"><span class="code" id="code"></span><span class="name" id="name"></span><span class="pchip" id="pchip" hidden>Prep</span></div>
        <div class="digits" id="digits">0:00</div><div class="csub" id="csub"></div>
        <div class="ctl"><button class="btn sm ghost" id="prev" aria-label="Previous speech">←</button><button class="btn go" id="go">Start</button><button class="btn sm ghost" id="reset">Reset</button><button class="btn sm ghost" id="next" aria-label="Next speech">→</button></div>
        <div class="preps"><button class="prep sd0" id="prep0"><span>${sideName(0)} prep</span><b>0:00</b></button><button class="prep sd1" id="prep1"><span>${sideName(1)} prep</span><b>0:00</b></button></div>
        <p class="small" style="text-align:center">Space: start/pause · ← →: speeches · A / B: prep</p>
      </div>
      <div class="panel" style="display:grid;gap:var(--gap)">
        <div class="box"><h2>Round</h2><div class="list" id="list"></div></div>
        <div class="box"><h2>Settings</h2>
          <div class="names"><input id="n0" value="${E(S.names[0])}" aria-label="First side name" maxlength="20">${F.swap?'<button id="swap" title="Swap who speaks first">⇄</button>':'<span class="small">vs</span>'}<input id="n1" value="${E(S.names[1])}" aria-label="Second side name" maxlength="20"></div>
          ${F.swap?'<p class="small">The left team speaks first. Use ⇄ after the coin flip.</p>':''}
          <label class="setrow">Prep per side (minutes)<input id="pm" type="number" min="0" max="20" step="0.5" value="${S.prepMin}"></label>
          <label class="check"><input type="checkbox" id="snd" ${store.get('sound',true)?'checked':''}> Beep at 30 seconds and at time</label>
        </div>
      </div>
    </div>`;
  const sp=()=>F.speeches[S.idx];
  function draw(){
    const s=sp(),side=s[2];
    $('clock').className='clock sd'+(run===0||run===1?run:side);
    $('code').textContent=run===0||run===1?S.names[run]:s[0];
    $('name').textContent=run===0||run===1?'Prep time':(side===2?s[1]:S.names[side]+' · '+s[1]);
    $('pchip').hidden=!(run===0||run===1);
    const t=run===0||run===1?S.prep[run]:S.left[S.idx];
    const d=$('digits');d.textContent=run===0||run===1?fmtTc(t):(t<0?fmtT(t):fmtTc(t));
    d.className='digits'+(t<=0&&run==='speech'?' over':t<=0&&!run?' over':t<=30&&t>0?' warn':'');
    $('csub').textContent=run==='speech'?'Speaking':run===0||run===1?'Prep running · speech clock paused':S.left[S.idx]<s[3]?'Paused':'Ready';
    $('go').textContent=run?'Pause':'Start';
    [0,1].forEach(i=>{const b=$('prep'+i);b.querySelector('b').textContent=fmtTc(S.prep[i]);b.classList.toggle('on',run===i);b.classList.toggle('out',S.prep[i]<=0)});
    $('list').innerHTML=F.speeches.map((x,i)=>`<button class="sp sd${x[2]} ${i===S.idx?'cur':''} ${S.left[i]<=0||i<S.idx&&S.left[i]<x[3]?'done':''}" data-i="${i}"><code>${x[0]}</code><span>${x[2]===2?E(x[1]):sideName(x[2])+' · '+E(x[1])}</span><small>${S.left[i]===x[3]?fmtTc(x[3]):fmtT(S.left[i])}</small></button>`).join('');
    $('prev').disabled=S.idx===0;$('next').disabled=S.idx===F.speeches.length-1;
  }
  function loop(){
    const now=performance.now(),dt=(now-last)/1000;last=now;
    if(run==='speech'){const b=S.left[S.idx];S.left[S.idx]-=dt;if(b>30&&S.left[S.idx]<=30)beep(1);if(b>0&&S.left[S.idx]<=0)beep(3)}
    else if(run===0||run===1){const b=S.prep[run];S.prep[run]=Math.max(0,S.prep[run]-dt);if(b>0&&S.prep[run]<=0){beep(2);stop()}}
    save();draw();
  }
  function start(what){run=what;last=performance.now();tick(loop);wakeLock(true);draw()}
  function stop(){run=null;clearInterval(ticker);wakeLock(false);save();draw()}
  $('go').onclick=()=>run?stop():start('speech');
  $('reset').onclick=()=>{stop();S.left[S.idx]=sp()[3];save();draw()};
  $('prev').onclick=()=>{stop();S.idx=Math.max(0,S.idx-1);save();draw()};
  $('next').onclick=()=>{stop();S.idx=Math.min(F.speeches.length-1,S.idx+1);save();draw()};
  [0,1].forEach(i=>$('prep'+i).onclick=()=>{if(run===i)return stop();if(S.prep[i]<=0)return;stop();start(i)});
  $('list').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;stop();S.idx=+b.dataset.i;save();draw()};
  $('newround').onclick=e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again to reset all clocks';setTimeout(()=>{delete e.target.dataset.armed;e.target.textContent='New round'},3000);return}
    stop();S.idx=0;S.left=F.speeches.map(s=>s[3]);S.prep=[S.prepMin*60,S.prepMin*60];save();round(key)};
  $('pm').onchange=()=>{const m=Math.max(0,Math.min(20,+$('pm').value||0));const d=m*60-S.prepMin*60;S.prepMin=m;S.prep=S.prep.map(p=>Math.max(0,p+d));save();draw()};
  ['n0','n1'].forEach((id,i)=>$(id).oninput=()=>{S.names[i]=$(id).value.trim()||F.sides[i];save();draw();$('prep'+i).querySelector('span').textContent=S.names[i]+' prep'});
  if($('swap'))$('swap').onclick=()=>{S.names.reverse();$('n0').value=S.names[0];$('n1').value=S.names[1];[0,1].forEach(i=>$('prep'+i).querySelector('span').textContent=S.names[i]+' prep');save();draw()};
  $('snd').onchange=()=>store.set('sound',$('snd').checked);
  keys=e=>{if(e.target.matches('input,textarea,select'))return;
    if(e.code==='Space'){e.preventDefault();$('go').click()}else if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();
    else if(/^[aA]$/.test(e.key))$('prep0').click();else if(/^[bB]$/.test(e.key))$('prep1').click()};
  draw();
}

/* ── speech events ────────────────────────────────── */
function speech(key){
  if(!key||!EVENTS[key]){
    app.innerHTML=`<a class="back" href="#/">← Speech &amp; Debate</a><div class="top"><div><h1>Speech events</h1><p class="sub">Pick an event. Every timer has a 30-second grace period and full-screen hand signals.</p></div></div>
      <div class="hub">${Object.entries(EVENTS).map(([k,v],i)=>`<a class="b ${['butter','sky','peach','lilac','moss','','butter'][i]}" href="#/speech/${k}"><span class="art" data-art="speech"></span><span class="fmt">${E(v.name.toUpperCase())}</span><h2>${E(v.full)}</h2><div class="foot"><span class="muted">${E(v.note)}</span><span class="arrow"></span></div></a>`).join('')}</div>`;
    app.querySelectorAll('.arrow:empty').forEach(a=>a.outerHTML=SITE.arrow);return;
  }
  const V=EVENTS[key];
  const cfg=store.get('ev:'+key,{speak:V.speak||V.shared,prep:V.prep||0,grace:V.grace});
  let phase=V.prep?'prep':V.shared?'prep':'speak';   // prep | speak
  let left=V.shared?cfg.speak:phase==='prep'?cfg.prep:cfg.speak, run=false, last=0, used=0;
  app.innerHTML=`
    <a class="back" href="#/speech">← Speech events</a>
    <div class="top"><div><h1>${E(V.name)}</h1><p class="sub">${E(V.full)} · ${E(V.note)}</p></div></div>
    <div class="rt">
      <div class="clock sd2" id="clock">
        <div class="now"><span class="code" id="code"></span><span class="name" id="name"></span></div>
        <div class="digits" id="digits"></div><div class="csub" id="csub"></div>
        <div class="ctl"><button class="btn go" id="go">Start</button>${V.prep||V.shared?'<button class="btn sm ghost" id="phase">Start speech now</button>':''}<button class="btn sm ghost" id="reset">Reset</button><button class="btn sm ghost" id="sig">Hand signals ⛶</button></div>
        <p class="small" style="text-align:center">Space: start/pause · F: hand signals</p>
      </div>
      <div class="box"><h2>Settings</h2>
        ${V.prep?`<label class="setrow">Prep (minutes)<input id="cp" type="number" min="0" max="60" value="${cfg.prep/60}"></label>`:''}
        <label class="setrow">${V.shared?'Total time':'Speech'} (minutes)<input id="cs" type="number" min="1" max="30" step="0.5" value="${cfg.speak/60}"></label>
        <label class="setrow">Grace period (seconds)<input id="cg" type="number" min="0" max="120" step="5" value="${cfg.grace}"></label>
        <label class="check"><input type="checkbox" id="snd" ${store.get('sound',true)?'checked':''}> Beep at each minute signal and at time</label>
        <p class="small">Hand signals show whole minutes left, then “30”, then GRACE and STOP. Tap the full-screen card to close it.</p>
      </div>
    </div>`;
  const total=()=>V.shared?cfg.speak:phase==='prep'?cfg.prep:cfg.speak;
  function signalText(){
    if(left>0){if(left<=30)return '30';return String(Math.ceil(left/60))}
    return -left<=cfg.grace?'GRACE':'STOP';
  }
  function draw(){
    const d=$('digits');
    $('code').textContent=phase==='prep'?'Prep':'Speech';
    $('name').textContent=V.shared?(phase==='prep'?'Clock keeps running into your speech':'Speaking · '+fmtTc(used)+' used on prep'):'';
    d.textContent=left>=0?fmtTc(left):fmtT(left);
    d.className='digits'+(left<0&&-left<=cfg.grace&&phase==='speak'?' grace':left<0?' over':left<=60?' warn':'');
    $('csub').textContent=left<0&&phase==='speak'?(-left<=cfg.grace?'Grace period':'Over time'):run?(phase==='prep'?'Prepping':'Speaking'):'Ready';
    $('go').textContent=run?'Pause':'Start';
    if($('phase'))$('phase').hidden=phase!=='prep';
    const sg=document.querySelector('.signal');if(sg){const t=signalText();sg.querySelector('b').textContent=t;sg.className='signal'+(t==='GRACE'?' grace':t==='STOP'?' over':'')}
  }
  function loop(){
    const now=performance.now(),dt=(now-last)/1000;last=now;const b=left;left-=dt;if(phase==='prep'&&V.shared)used+=dt;
    if(phase==='speak'){if(Math.ceil(b/60)!==Math.ceil(left/60)&&left>0)beep(1);if(b>30&&left<=30)beep(1);if(b>0&&left<=0)beep(2);if(b>-cfg.grace&&left<=-cfg.grace)beep(3)}
    if(phase==='prep'&&left<=0){if(V.shared){phase='speak';beep(2)}else{beep(2);phase='speak';left=cfg.speak;stop()}}
    draw();
  }
  function start(){run=true;last=performance.now();tick(loop);wakeLock(true);draw()}
  function stop(){run=false;clearInterval(ticker);wakeLock(false);draw()}
  function reset(){stop();phase=V.prep||V.shared?'prep':'speak';left=total();used=0;draw()}
  $('go').onclick=()=>run?stop():start();
  $('reset').onclick=reset;
  if($('phase'))$('phase').onclick=()=>{if(V.shared){phase='speak'}else{phase='speak';left=cfg.speak}if(!run)start();draw()};
  const openSig=()=>{if(document.querySelector('.signal'))return;const s=document.createElement('div');s.className='signal';s.innerHTML='<b></b><small>Tap to close</small>';s.onclick=()=>{s.remove();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};document.body.append(s);try{s.requestFullscreen&&s.requestFullscreen().catch(()=>{})}catch(e){}draw()};
  $('sig').onclick=openSig;
  const upd=()=>{if($('cp'))cfg.prep=Math.max(0,+$('cp').value||0)*60;cfg.speak=Math.max(30,(+$('cs').value||1)*60);cfg.grace=Math.max(0,+$('cg').value||0);store.set('ev:'+key,cfg);if(!run)reset()};
  ['cp','cs','cg'].forEach(id=>$(id)&&($(id).onchange=upd));
  $('snd').onchange=()=>store.set('sound',$('snd').checked);
  keys=e=>{if(e.target.matches('input,textarea,select'))return;if(e.code==='Space'){e.preventDefault();$('go').click()}else if(/^[fF]$/.test(e.key))openSig()};
  reset();
}

/* ── congress ─────────────────────────────────────── */
function congress(){
  const C=store.get('congress',{people:[],bills:[],cur:0,log:[],order:0});
  let mode=null,left=0,run=false,last=0,qLeft=0,phase='speech';
  const save=()=>store.set('congress',C);
  app.innerHTML=`
    <a class="back" href="#/">← Speech &amp; Debate</a>
    <div class="top"><div><h1>Congress</h1><p class="sub">Speech and questioning timer, precedence and recency, and the docket.</p></div></div>
    <div class="cg">
      <div style="display:grid;gap:var(--gap)">
        <div class="clock sd2" id="clock">
          <div class="now"><span class="code" id="code">Ready</span><span class="name" id="name">Pick a speech type</span></div>
          <div class="digits" id="digits">3:00</div><div class="csub" id="csub"></div>
          <div class="ctl"><button class="btn sm ghost" id="auth">Authorship / sponsorship<br><small>3:00 + 2:00 Q</small></button><button class="btn sm ghost" id="reg">Speech<br><small>3:00 + 1:00 Q</small></button></div>
          <div class="ctl"><button class="btn go" id="go" disabled>Start</button><button class="btn sm ghost" id="toq" hidden>Start questioning</button><button class="btn sm ghost" id="reset">Reset</button></div>
        </div>
        <div class="box"><div class="row" style="justify-content:space-between"><h2>Docket</h2></div>
          <div class="row"><input id="bill" placeholder="Add a bill or resolution" maxlength="120" style="flex:1"><button class="btn sm" id="addbill">Add</button></div>
          <div class="docket" id="docket"></div>
          <div><b style="font-size:13px">Speeches on this bill</b><div class="log" id="log"></div></div>
        </div>
      </div>
      <div class="box"><div class="row" style="justify-content:space-between"><h2>Precedence</h2><button class="btn sm ghost" id="clear">Reset session</button></div>
        <p class="small">Add everyone in the chamber. The highlighted row has priority: fewest speeches first, then whoever spoke longest ago. Tap Aff or Neg when someone gives a speech, Q when they ask a question.</p>
        <div class="row"><textarea id="ppl" rows="2" placeholder="Names, one per line" style="flex:1;min-height:0"></textarea><button class="btn sm" id="addppl">Add</button></div>
        <div style="overflow-x:auto"><table><thead><tr><th>Name</th><th>Sp.</th><th>Q</th><th>Last</th><th></th></tr></thead><tbody id="ptable"></tbody></table></div>
      </div>
    </div>`;
  function drawClock(){
    const d=$('digits');
    $('code').textContent=mode?(phase==='speech'?'Speech':'Questioning'):'Ready';
    $('name').textContent=mode?(mode==='auth'?'Authorship / sponsorship':'Speech'):'Pick a speech type';
    d.textContent=left>=0?fmtTc(left):fmtT(left);
    d.className='digits'+(left<0?' over':left<=30&&mode?' warn':'');
    $('csub').textContent=left<0?'Over time':run?'Running':mode?'Paused':'';
    $('go').disabled=!mode;$('go').textContent=run?'Pause':'Start';
    $('toq').hidden=!(mode&&phase==='speech');
  }
  function loop(){const now=performance.now(),dt=(now-last)/1000;last=now;const b=left;left-=dt;if(b>30&&left<=30)beep(1);if(b>0&&left<=0)beep(2);drawClock()}
  const start=()=>{run=true;last=performance.now();tick(loop);wakeLock(true);drawClock()};
  const stop=()=>{run=false;clearInterval(ticker);wakeLock(false);drawClock()};
  const setMode=m=>{stop();mode=m;phase='speech';left=180;qLeft=m==='auth'?120:60;drawClock()};
  $('auth').onclick=()=>setMode('auth');$('reg').onclick=()=>setMode('reg');
  $('go').onclick=()=>run?stop():start();
  $('toq').onclick=()=>{phase='questioning';left=qLeft;start()};
  $('reset').onclick=()=>{stop();if(mode){phase='speech';left=180}drawClock()};
  function drawPeople(){
    const ranked=C.people.map((p,i)=>({...p,i})).sort((a,b)=>a.sp-b.sp||(a.last||0)-(b.last||0)||a.i-b.i);
    const nextI=ranked.length?ranked[0].i:-1;
    $('ptable').innerHTML=C.people.map((p,i)=>`<tr class="${i===nextI?'next':''}"><td>${E(p.name)}</td><td class="n">${p.sp}</td><td class="n">${p.q}</td><td class="n">${p.last?'#'+p.last:'–'}</td>
      <td style="white-space:nowrap"><button class="mini af" data-sp="${i}" data-side="Aff">Aff</button> <button class="mini ng" data-sp="${i}" data-side="Neg">Neg</button> <button class="mini" data-q="${i}">Q</button> <button class="mini" data-rm="${i}" aria-label="Remove">✕</button></td></tr>`).join('')||'<tr><td colspan="5" class="small">No one added yet.</td></tr>';
  }
  function drawDocket(){
    $('docket').innerHTML=C.bills.map((b,i)=>`<div class="bill ${i===C.cur?'cur':''}"><span>${i+1}. ${E(b)}</span>${i===C.cur?'<small>On the floor</small>':`<button class="mini" data-cur="${i}">Bring up</button>`}<button class="mini" data-rmb="${i}" aria-label="Remove">✕</button></div>`).join('')||'<p class="small">No bills yet.</p>';
    const L=C.log.filter(l=>l.bill===C.cur);
    const nextSide=L.length?(L[L.length-1].side==='Aff'?'Neg':'Aff'):'Aff (authorship)';
    $('log').innerHTML=(L.map((l,i)=>`<span>${i+1}. ${E(l.name)} · ${l.side}</span>`).join('')||'<span>No speeches yet.</span>')+`<span style="color:var(--ink)"><b>Next:</b> ${nextSide}</span>`;
  }
  $('addppl').onclick=()=>{$('ppl').value.split(/\n|,/).map(s=>s.trim()).filter(Boolean).forEach(n=>C.people.push({name:n.slice(0,40),sp:0,q:0,last:0}));$('ppl').value='';save();drawPeople()};
  $('addbill').onclick=()=>{const v=$('bill').value.trim();if(!v)return;C.bills.push(v.slice(0,120));$('bill').value='';save();drawDocket()};
  $('bill').onkeydown=e=>{if(e.key==='Enter')$('addbill').click()};
  $('ptable').onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.sp!==undefined){const p=C.people[+b.dataset.sp];p.sp++;p.last=++C.order;C.log.push({bill:C.cur,name:p.name,side:b.dataset.side});}
    if(b.dataset.q!==undefined)C.people[+b.dataset.q].q++;
    if(b.dataset.rm!==undefined)C.people.splice(+b.dataset.rm,1);
    save();drawPeople();drawDocket()};
  $('docket').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cur!==undefined)C.cur=+b.dataset.cur;if(b.dataset.rmb!==undefined){const i=+b.dataset.rmb;C.bills.splice(i,1);C.log=C.log.filter(l=>l.bill!==i).map(l=>({...l,bill:l.bill>i?l.bill-1:l.bill}));if(C.cur>=C.bills.length)C.cur=Math.max(0,C.bills.length-1)}save();drawDocket()};
  $('clear').onclick=e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again to clear everything';setTimeout(()=>{delete e.target.dataset.armed;e.target.textContent='Reset session'},3000);return}
    Object.assign(C,{people:[],bills:[],cur:0,log:[],order:0});save();congress()};
  keys=e=>{if(e.target.matches('input,textarea,select'))return;if(e.code==='Space'&&mode){e.preventDefault();$('go').click()}};
  drawClock();drawPeople();drawDocket();
}

/* ── flow sheet ───────────────────────────────────── */
function flow(){
  const sheets=store.get('flows',[]);
  let curId=store.get('flowCur',null);
  if(!sheets.find(s=>s.id===curId))curId=null;
  const make=fmt=>{const F=FORMATS[fmt];const s={id:Date.now().toString(36),fmt,name:F.short+' round · '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'}),cols:{}};sheets.unshift(s);curId=s.id;persist();return s};
  const persist=()=>{store.set('flows',sheets.slice(0,30));store.set('flowCur',curId)};
  let S=sheets.find(s=>s.id===curId)||make('ld');
  function draw(){
    const F=FORMATS[S.fmt];
    const cols=F.speeches.filter(x=>x[2]!==2&&!/^CX$/.test(x[0]));
    app.innerHTML=`
      <a class="back" href="#/">← Speech &amp; Debate</a>
      <div class="top"><div><h1>Flow</h1><p class="sub">Saved on this device as you type.</p></div></div>
      <div class="flowbar">
        <select id="pick" aria-label="Saved flows">${sheets.map(s=>`<option value="${s.id}"${s.id===S.id?' selected':''}>${E(s.name)}</option>`).join('')}</select>
        <input id="fname" value="${E(S.name)}" maxlength="60" aria-label="Flow name" style="flex:1;min-width:160px">
        <div class="seg">${Object.entries(FORMATS).map(([k,v])=>`<button data-new="${k}">+ ${v.short}</button>`).join('')}</div>
        <button class="btn sm ghost" id="dl">Download</button><button class="btn sm ghost" id="del">Delete</button>
      </div>
      <div class="flow">${cols.map(c=>`<div class="col sd${c[2]}"><h3><span>${E(c[0])}</span><small class="small">${E(F.sides[c[2]])}</small></h3><textarea data-c="${E(c[0])}" placeholder="${E(c[1])}">${E(S.cols[c[0]]||'')}</textarea></div>`).join('')}</div>`;
    app.querySelectorAll('[data-c]').forEach(t=>t.oninput=()=>{S.cols[t.dataset.c]=t.value;persist()});
    $('fname').oninput=()=>{S.name=$('fname').value||'Untitled';persist();const o=$('pick').selectedOptions[0];if(o)o.textContent=S.name};
    $('pick').onchange=()=>{S=sheets.find(s=>s.id===$('pick').value);curId=S.id;persist();draw()};
    app.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>{S=make(b.dataset.new);draw()});

/* ── speech drill: record, live transcript, filler words ── */
const FILLERS=['um','uh','er','erm','like','you know','basically','actually','literally','i mean','kind of','sort of','so yeah','right'];
const FILLER_RE=new RegExp('\\b('+FILLERS.map(f=>f.replace(/ /g,'\\s+')).join('|')+'|u+m+|u+h+)\\b','gi');
function drill(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  let rec=null,media=null,stream=null,chunks=[],sr=null,running=false,t0=0,elapsed=0,finalText='',interim='',taps=0,audioURL=null;
  const pickPrompt=()=>kind==='free'?'Talk about anything: your weekend, a movie, why your favorite food is the best.':TOPICS[kind][Math.floor(Math.random()*TOPICS[kind].length)];

  app.innerHTML=`
    <a class="back" href="#/">← Speech &amp; Debate</a>

    <div class="dr">
      <div class="drmain">
        <div class="prompt"><span class="blob"></span><span class="lbl">Your prompt</span><q id="q"></q>
          <div class="row"><button class="btn sm" style="background:var(--forest-ink);color:var(--forest)" id="newq">New prompt</button></div></div>
        <div class="clock sd2">
          <div class="now"><span class="code" id="state">Ready</span><span class="name" id="tgt"></span></div>
          <div class="digits" id="digits">0:00</div>
          <div class="ctl"><button class="btn go" id="go">Start talking</button><button class="btn sm ghost" id="tap" title="Tap when you hear a filler (or press F)">+1 filler <b id="taps">0</b></button></div>
          <div class="small" id="note"></div>
        </div>
        <div class="box"><h2>What you said</h2><div class="transcript" id="tx"><span class="muted">Your words show up here while you talk.</span></div><audio id="play" controls hidden></audio></div>
      </div>
      <div class="drside">
        <div class="box"><h2>Live</h2>
          <div class="stats"><div><b id="wpm">0</b><span>words / min</span></div><div><b id="fc">0</b><span>fillers</span></div><div><b id="fpm">0</b><span>fillers / min</span></div><div><b id="wc">0</b><span>words</span></div></div>
          <div class="fl" id="fl"></div>
          <p class="small">A good pace is about 130–170 words a minute. Aim for under 2 fillers a minute.</p></div>
        <div class="box"><h2>Settings</h2>
          <label class="setrow">Target time<select id="target">${[60,90,120,180,300,420].map(s=>`<option value="${s}"${s===target?' selected':''}>${fmtT(s)}</option>`).join('')}</select></label>
          <label class="check"><input type="checkbox" id="snd" ${store.get('sound',true)?'checked':''}> Beep at the target time</label></div>
        <div class="box"><h2>Your last drills</h2><div class="hist" id="hist"></div></div>
      </div>
    </div>`;
  const showPrompt=()=>{$('q').textContent=prompt};showPrompt();
  $('newq').onclick=()=>{prompt=pickPrompt();showPrompt()};
  $('kinds').onclick=e=>{const b=e.target.closest('[data-k]');if(!b||running)return;kind=b.dataset.k;store.set('drillKind',kind);
    $('kinds').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));prompt=pickPrompt();showPrompt()};
  $('target').onchange=e=>{target=+e.target.value;store.set('drillTarget',target);draw()};
  $('snd').onchange=e=>store.set('sound',e.target.checked);
  $('note').textContent=SR?'Uses your microphone. The recording stays on this device.':'Live word counting works in Chrome, Edge and Safari. You can still record yourself and tap +1 for each filler.';

  const counts=()=>{const all=(finalText+' '+interim).toLowerCase();const m=all.match(FILLER_RE)||[];const by={};
    m.forEach(w=>{w=w.replace(/\s+/g,' ').replace(/^u+m+$/,'um').replace(/^u+h+$/,'uh');by[w]=(by[w]||0)+1});
    const words=(all.match(/[a-z0-9']+/g)||[]).length;return{n:m.length+taps,by,words}};
  function draw(){
    $('digits').textContent=fmtTc(elapsed);$('tgt').textContent='Target '+fmtT(target)+(elapsed>target?' · over':'');
    $('digits').classList.toggle('over',elapsed>target);

    $('wpm').textContent=elapsed>5?Math.round(c.words/min):0;$('fc').textContent=c.n;$('fpm').textContent=elapsed>5?(c.n/min).toFixed(1):0;$('wc').textContent=c.words;$('taps').textContent=taps;
    $('fl').innerHTML=Object.entries(c.by).sort((a,b)=>b[1]-a[1]).map(([w,n])=>`<span>${E(w)} <b>${n}</b></span>`).join('')+(taps?`<span>tapped <b>${taps}</b></span>`:'');
    if(finalText||interim)$('tx').innerHTML=E(finalText).replace(FILLER_RE,'<mark>$&</mark>')+(interim?` <span class="muted">${E(interim)}</span>`:'');
  }
  function drawHist(){const h=store.get('drills',[]);
    $('hist').innerHTML=h.length?h.map(d=>`<div><span>${new Date(d.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${E(kinds[d.kind]||'')}</span><span>${fmtT(d.secs)} · ${d.wpm} wpm · ${d.fpm} fillers/min</span></div>`).join(''):'<span class="small">Nothing yet.</span>'}
  drawHist();
  async function start(){
    finalText='';interim='';taps=0;elapsed=0;chunks=[];$('play').hidden=true;if(audioURL)URL.revokeObjectURL(audioURL);
    $('tx').innerHTML='<span class="muted">Listening…</span>';
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});
      if(window.MediaRecorder){media=new MediaRecorder(stream);media.ondataavailable=e=>e.data.size&&chunks.push(e.data);
        media.onstop=()=>{if(!chunks.length)return;audioURL=URL.createObjectURL(new Blob(chunks,{type:media.mimeType||'audio/webm'}));$('play').src=audioURL;$('play').hidden=false};media.start()}}
    catch(e){$('note').textContent='No microphone access, so nothing is recorded. The timer and +1 button still work.'}
    if(SR){sr=new SR();sr.lang='en-US';sr.continuous=true;sr.interimResults=true;
      sr.onresult=e=>{interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=(finalText?' ':'')+t.trim();else interim+=t}draw()};
      sr.onend=()=>{if(running)try{sr.start()}catch(e){}};sr.onerror=e=>{if(e.error==='not-allowed'){$('note').textContent='Microphone blocked, so words can\'t be counted. Tap +1 instead.'}};
      try{sr.start()}catch(e){}}
    running=true;t0=performance.now();wakeLock(true);$('go').textContent='Stop';$('state').textContent='Talking';
    let beeped=false;tick(()=>{elapsed=(performance.now()-t0)/1000;if(!beeped&&elapsed>=target){beeped=true;beep(2)}draw()});
  }
  function stop(){
    running=false;clearInterval(ticker);wakeLock(false);
    try{sr&&sr.stop()}catch(e){}try{media&&media.state!=='inactive'&&media.stop()}catch(e){}stream&&stream.getTracks().forEach(t=>t.stop());
    $('go').textContent='Go again';$('state').textContent='Done';interim='';draw();
    if(elapsed>=10){const c=counts(),min=elapsed/60,h=store.get('drills',[]);
      h.unshift({at:Date.now(),kind,secs:Math.round(elapsed),wpm:Math.round(c.words/min),fpm:+(c.n/min).toFixed(1)});store.set('drills',h.slice(0,12));drawHist()}
  }
  $('go').onclick=()=>running?stop():start();
  $('tap').onclick=()=>{taps++;draw()};
  keys=e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='f'||e.key==='F'){taps++;draw()}};
  draw();
  return ()=>{if(running)stop()};
}

/* ── judge ballot helper ─────────────────────────── */
function ballot(){
  const B=store.get('ballot',null)||{fmt:'ld',round:'',a:'',b:'',deb:[{n:'',p:'',c:''},{n:'',p:'',c:''},{n:'',p:'',c:''},{n:'',p:'',c:''}],win:null,rfd:''};
  const save=()=>store.set('ballot',B);
  const per=()=>B.fmt==='ld'?1:2;
  const F=()=>FORMATS[B.fmt];
  function render(){
    const sides=F().sides;
    const debRow=(i,side)=>`<div class="deb"><div class="row"><input data-d="${i}" data-f="n" placeholder="${sides[side]} speaker ${per()>1?(i%2)+1:''}" value="${E(B.deb[i].n)}" maxlength="40" style="flex:1">
      <input data-d="${i}" data-f="p" type="number" inputmode="decimal" min="20" max="30" step="0.1" placeholder="Points" value="${E(B.deb[i].p)}" style="width:96px" aria-label="Speaker points"></div>
      <textarea data-d="${i}" data-f="c" rows="2" placeholder="Comments for this speaker">${E(B.deb[i].c)}</textarea></div>`;
    const idx=side=>per()===1?[side*2]:[side*2,side*2+1];
    app.innerHTML=`
      <a class="back" href="#/">← Speech &amp; Debate</a>
      <div class="top"><div><h1>Ballot helper</h1><p class="sub">For judges and practice rounds. Fill it in, then copy it into Tabroom or a text. Saved on this device.</p></div>
        <div class="row"><button class="btn sm" id="copy">Copy ballot</button><button class="btn sm ghost" id="clear">New ballot</button></div></div>
      <div class="seg" style="margin-bottom:var(--gap)" id="fmts">${Object.entries(FORMATS).map(([k,f])=>`<button data-k="${k}" aria-pressed="${k===B.fmt}">${f.name}</button>`).join('')}</div>
      <div class="bal">
        ${[0,1].map(s=>`<div class="box sidebox sd${s}"><div class="row" style="justify-content:space-between"><h2>${sides[s]}</h2><button class="btn sm win" data-win="${s}" aria-pressed="${B.win===s}">${B.win===s?'✓ Winner':'Pick as winner'}</button></div>
          <input data-side="${s?'b':'a'}" placeholder="${sides[s]} team or code (e.g. PV AB)" value="${E(B[s?'b':'a'])}" maxlength="60">
          ${idx(s).map(i=>debRow(i,s)).join('')}</div>`).join('')}
        <div class="box w"><h2>Reason for decision</h2>
          <input id="round" placeholder="Round (e.g. Round 3, Flight A)" value="${E(B.round)}" maxlength="60">
          <textarea id="rfd" rows="6" placeholder="Why did this side win? Name the arguments that decided it and how you weighed them.">${E(B.rfd)}</textarea>
          <div id="warn"></div></div>
      </div>`;
    wire();check();
  }
  function check(){
    const pts=B.deb.slice(0,per()*2).map(d=>parseFloat(d.p));const msgs=[];
    if(pts.some(p=>!isNaN(p)&&(p<20||p>30)))msgs.push('Speaker points are usually between 25 and 30.');
    if(B.win!==null&&pts.every(p=>!isNaN(p))){const sum=s=>pts.slice(s*per(),(s+1)*per()).reduce((a,b)=>a+b,0);
      if(sum(B.win)<sum(1-B.win))msgs.push('This is a low-point win (the winner has fewer points). That\'s allowed, but many tournaments ask you to explain it in the RFD.')}
    if(B.win===null)msgs.push('Pick a winner.');
    $('warn').innerHTML=msgs.map(m=>`<div class="small">• ${E(m)}</div>`).join('');
  }
  function text(){
    const sides=F().sides,L=[];
    L.push(`${F().name} ballot${B.round?' · '+B.round:''}`);
    L.push(`${sides[0]}: ${B.a||'—'}   vs   ${sides[1]}: ${B.b||'—'}`);
    L.push(`Decision: ${B.win===null?'(not picked)':sides[B.win]+(B[B.win?'b':'a']?' ('+B[B.win?'b':'a']+')':'')}`,'');
    for(let s=0;s<2;s++)for(let k=0;k<per();k++){const d=B.deb[s*2+k];L.push(`${sides[s]}${per()>1?' '+(k+1):''}: ${d.n||'—'}${d.p?' · '+d.p+' points':''}`);if(d.c.trim())L.push('  '+d.c.trim().replace(/\n/g,'\n  '))}
    L.push('','Reason for decision:',B.rfd.trim()||'—');return L.join('\n');
  }
  function wire(){
    app.querySelectorAll('[data-d]').forEach(el=>el.oninput=()=>{B.deb[+el.dataset.d][el.dataset.f]=el.value;save();check()});
    app.querySelectorAll('[data-side]').forEach(el=>el.oninput=()=>{B[el.dataset.side]=el.value;save()});
    $('rfd').oninput=e=>{B.rfd=e.target.value;save()};$('round').oninput=e=>{B.round=e.target.value;save()};
    app.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{B.win=+b.dataset.win;save();render()});
    $('fmts').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;B.fmt=b.dataset.k;save();render()};
    $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text());$('copy').textContent='Copied ✓'}catch(e){prompt('Copy this:',text())}setTimeout(()=>{const c=$('copy');if(c)c.textContent='Copy ballot'},1800)};
    $('clear').onclick=e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again to clear';return}
      store.set('ballot',null);ballot()};
  }
  render();
}

      <div class="cards" id="cards"></div>`;
    const draw=()=>{const t=q.toLowerCase();
      const L=items.filter(x=>(whose==='all'||(whose==='mine'?x.user_id===me:'t'+x.team_id===whose))&&(kind==='all'||x.kind===kind)&&(side==='all'||x.side===side||x.side==='both')&&(!t||(x.title+' '+x.cite+' '+x.body+' '+x.topic).toLowerCase().includes(t)));
      $('cards').innerHTML=L.map(x=>`<a class="card" href="#/cases/${x.id}"><span class="ctag">${x.kind==='case'?'Case':'Card'} · ${SIDES[x.side]}${x.topic?' · '+E(x.topic):''}${x.team_id?` · <span class="tshare">${x.user_id===me?'Shared':'From'} ${E(teamName(x.team_id))}</span>`:''}</span><b>${E(x.title)}</b>${x.cite?`<span class="cite">${E(x.cite)}</span>`:''}<span class="cbody">${E(x.body.slice(0,180))}${x.body.length>180?'…':''}</span></a>`).join('')
        ||`<div class="box"><p class="muted">${items.length?'Nothing matches.':'Nothing saved yet. Press <b>New card or case</b> to add your first one.'}</p></div>`};
    $('q').oninput=e=>{q=e.target.value;draw()};
    $('kind').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;kind=b.dataset.k;$('kind').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
    $('side').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;side=b.dataset.k;$('side').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
    if($('whose'))$('whose').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;whose=b.dataset.k;$('whose').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
    $('dl').onclick=()=>{const txt=items.map(x=>`${x.kind==='case'?'CASE':'CARD'} · ${SIDES[x.side]}${x.topic?' · '+x.topic:''}\n${x.title}\n${x.cite?x.cite+'\n':''}\n${x.body}`).join('\n\n----------------------------------------\n\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='debate-library.txt';a.click()};
    draw();
  }
  function editor(x){
    if(x&&x.user_id!==me)return viewOnly(x);
    const isNew=!x;x=x||{kind:'card',title:'',cite:'',body:'',topic:store.get('lastTopic',''),side:'both',team_id:store.get('lastTeam',null)};
    if(x.team_id&&!TEAMS.some(t=>t.id===x.team_id))x.team_id=null;
    app.innerHTML=`<a class="back" href="#/cases">← All cards &amp; cases</a>
      <div class="top"><div><h1>${isNew?'New':'Edit'} ${x.kind==='case'?'case':'card'}</h1><p class="sub">Put <code>**double stars**</code> around the words you read out loud and <code>==equals==</code> around anything to highlight.</p></div></div>
      <div class="ced">
        <div class="box">
          <div class="row"><div class="seg" id="ek">${[['card','Evidence card'],['case','Case']].map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===x.kind}">${v}</button>`).join('')}</div>
            <select id="eside" aria-label="Side">${Object.entries(SIDES).map(([k,v])=>`<option value="${k}"${k===x.side?' selected':''}>${v}</option>`).join('')}</select>
            ${TEAMS.length?`<select id="eteam" aria-label="Who can see it"><option value="">Only me</option>${TEAMS.map(t=>`<option value="${t.id}"${t.id===x.team_id?' selected':''}>Share with ${E(t.name)}</option>`).join('')}</select>`:''}</div>
          <input id="etitle" maxlength="200" placeholder="Tag (the claim this proves) or case name" value="${E(x.title)}">
          <input id="ecite" maxlength="600" placeholder="Cite: author, year, credentials, source, link" value="${E(x.cite)}">
          <input id="etopic" maxlength="80" placeholder="Topic (e.g. Nov–Dec LD)" value="${E(x.topic)}">
          <textarea id="ebody" rows="14" maxlength="40000" placeholder="Paste the card text or write your case">${E(x.body)}</textarea>
          <div class="row"><button class="btn" id="esave">Save</button>${isNew?'':'<button class="btn sm ghost" id="ecopy">Copy</button><button class="btn sm danger" id="edel">Delete</button>'}</div><div id="emsg"></div>
        </div>
        <div class="box"><h2>Preview</h2><div class="cardview" id="eprev"></div></div>
      </div>`;
    let kindNow=x.kind;
    const prev=()=>{$('eprev').innerHTML=`<b class="ptag">${E($('etitle').value||'Tag')}</b>${$('ecite').value?`<div class="cite">${E($('ecite').value)}</div>`:''}<div class="cbody2">${cardHTML($('ebody').value)}</div>`};
    ['etitle','ecite','ebody'].forEach(i=>$(i).oninput=prev);prev();
    $('ek').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;kindNow=b.dataset.k;$('ek').querySelectorAll('button').forEach(z=>z.setAttribute('aria-pressed',z===b))};
    $('esave').onclick=async()=>{const row={kind:kindNow,team_id:$('eteam')&&+$('eteam').value||null,side:$('eside').value,title:$('etitle').value.trim(),cite:$('ecite').value.trim(),topic:$('etopic').value.trim(),body:$('ebody').value};
      if(!row.title){$('emsg').innerHTML='<div class="small" style="color:var(--over)">Add a tag or name first.</div>';return}
      $('esave').disabled=true;store.set('lastTopic',row.topic);store.set('lastTeam',row.team_id);
      const r=isNew?await SB.from('debate_cards').insert(row).select().single():await SB.from('debate_cards').update(row).eq('id',x.id).select().single();
      $('esave').disabled=false;
      if(r.error){$('emsg').innerHTML=`<div class="small" style="color:var(--over)">${E(r.error.message)}</div>`;return}
      if(isNew)items.unshift(r.data);else Object.assign(x,r.data);location.hash='#/cases'};
    if(!isNew){
      $('ecopy').onclick=async()=>{const t=`${x.title}\n${x.cite}\n\n${x.body.replace(/\*\*|==/g,'')}`;try{await navigator.clipboard.writeText(t);$('ecopy').textContent='Copied ✓'}catch(e){}};
      $('edel').onclick=async e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again to delete';return}
        const r=await SB.from('debate_cards').delete().eq('id',x.id);if(r.error){$('emsg').innerHTML=`<div class="small">${E(r.error.message)}</div>`;return}
        items=items.filter(z=>z!==x);location.hash='#/cases'};
    }
  }
  function viewOnly(x){
    app.innerHTML=`<a class="back" href="#/cases">← All cards &amp; cases</a>
      <div class="top"><div><h1>${x.kind==='case'?'Case':'Card'}</h1><p class="sub">Shared with ${E(teamName(x.team_id))} · ${SIDES[x.side]}${x.topic?' · '+E(x.topic):''}</p></div>
        <div class="row"><button class="btn sm" id="vcopy">Copy text</button><button class="btn sm ghost" id="vsave">Save my own copy</button></div></div>
      <div class="box" style="max-width:820px"><div class="cardview"><b class="ptag">${E(x.title)}</b>${x.cite?`<div class="cite">${E(x.cite)}</div>`:''}<div class="cbody2">${cardHTML(x.body)}</div></div><div id="vmsg"></div></div>`;
    $('vcopy').onclick=async()=>{try{await navigator.clipboard.writeText(`${x.title}\n${x.cite}\n\n${x.body.replace(/\*\*|==/g,'')}`);$('vcopy').textContent='Copied ✓'}catch(e){}};
    $('vsave').onclick=async()=>{$('vsave').disabled=true;const r=await SB.from('debate_cards').insert({kind:x.kind,side:x.side,title:x.title,cite:x.cite,topic:x.topic,body:x.body}).select().single();
      if(r.error){$('vsave').disabled=false;$('vmsg').innerHTML=`<div class="small">${E(r.error.message)}</div>`;return}location.hash='#/cases/'+r.data.id};
  }
  async function teams(){
    app.innerHTML=`<a class="back" href="#/cases">← All cards &amp; cases</a>
      <div class="top"><div><h1>Team</h1><p class="sub">Share cards with your debate team. Everyone on a team can read the cards shared to it; only the person who wrote a card can change it.</p></div></div>
      <div class="ced">
        <div class="box"><h2>Your teams</h2><div id="tlist">${TEAMS.length?'':'<p class="muted">You\'re not on a team yet.</p>'}</div></div>
        <div style="display:grid;gap:var(--gap)">
          <div class="box"><h2>Join a team</h2><p class="small">Ask your captain or coach for the 6-character code.</p><div class="row"><input id="jcode" maxlength="8" placeholder="ABC123" autocapitalize="characters" style="flex:1;min-width:0;text-transform:uppercase;font-weight:700;letter-spacing:.1em"><button class="btn sm" id="jgo">Join</button></div><div id="jmsg"></div></div>
          <div class="box"><h2>Make a team</h2><p class="small">You'll get a code to share with teammates.</p><div class="row"><input id="tname" maxlength="60" placeholder="e.g. PV Debate" style="flex:1;min-width:0"><button class="btn sm" id="tgo">Create</button></div><div id="tmsg"></div></div>
        </div>
      </div>`;
    const err=(id,e)=>{$(id).innerHTML=`<div class="small" style="color:var(--over);margin-top:6px">${E(e.message.replace(/^.*?: /,''))}</div>`};
    const drawT=async()=>{for(const t of TEAMS){const r=await SB.rpc('team_roster',{t:t.id});t.roster=r.data||[]}
      $('tlist').innerHTML=TEAMS.map(t=>`<div class="team"><div class="row" style="justify-content:space-between"><b>${E(t.name)}</b><span class="small">${t.members} member${t.members===1?'':'s'}${t.role==='owner'?' · you run it':''}</span></div>
        ${t.code?`<div class="row"><span class="small">Join code</span><span class="tcode">${E(t.code)}</span><button class="btn sm ghost" data-newcode="${t.id}">New code</button></div>`:''}
        <div class="roster">${t.roster.map(m=>`<span>${E(m.name||'Member')}${m.username?` <small>@${E(m.username)}</small>`:''}${m.role==='owner'?' <small>· captain</small>':''}</span>`).join('')}</div>
        <div><button class="btn sm danger" data-leave="${t.id}">${t.role==='owner'?'Delete team':'Leave team'}</button></div></div>`).join('')||'<p class="muted">You\'re not on a team yet.</p>';
      $('tlist').querySelectorAll('[data-newcode]').forEach(b=>b.onclick=async()=>{const r=await SB.rpc('new_team_code',{t:+b.dataset.newcode});if(!r.error){TEAMS.find(t=>t.id===+b.dataset.newcode).code=r.data;drawT()}});
      $('tlist').querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed=1;b.textContent=b.textContent.startsWith('Delete')?'Click again: shared cards go back to private':'Click again to leave';return}
        const r=await SB.rpc('leave_team',{t:+b.dataset.leave});if(r.error)return alert(r.error.message);cases('team')})};
    drawT();
    $('jgo').onclick=async()=>{const r=await SB.rpc('join_team',{c:$('jcode').value});if(r.error)return err('jmsg',r.error);location.hash='#/cases';};
    $('tgo').onclick=async()=>{const n=$('tname').value.trim();if(n.length<2)return;const r=await SB.rpc('create_team',{n});if(r.error)return err('tmsg',r.error);cases('team')};
  }
  list();
}

/* ── router ───────────────────────────────────────── */
let keys=null,cleanup=null;
document.addEventListener('keydown',e=>{if(keys)keys(e)});
function route(){
  if(cleanup){cleanup();cleanup=null}
  clearInterval(ticker);wakeLock(false);keys=null;document.querySelector('.signal')?.remove();
  const p=location.hash.replace(/^#\/?/,'').split('/');window.scrollTo(0,0);
  if(p[0]==='round')return round(p[1]);
  if(p[0]==='speech')return speech(p[1]);
  if(p[0]==='congress')return congress();
  if(p[0]==='flow')return flow();
  if(p[0]==='topics')return topics(p[1]);
  if(p[0]==='drill')return cleanup=drill();
  if(p[0]==='ballot')return ballot();
  if(p[0]==='cases')return cases(p[1]);
  return hub();
}
addEventListener('hashchange',route);route();
</script>
</body>
