const myTopics=()=>{const m=store.get('mytopics',[]);return Array.isArray(m)?m.filter(x=>x&&typeof x.t==='string'&&x.t.trim()):[]};
function topics(kind){
  const names={ld:'LD resolution',pf:'PF resolution',policy:'Policy resolution',impromptu:'Impromptu prompt',extemp:'Extemp question',mine:'My topic'};
  kind=names[kind]?kind:'ld';
  let last=-1,cur={t:'',f:null},mf=FORMATS[kind]?kind:'ld';
  /* the pool for a format = the practice list plus any of my own topics saved for that format; the My topics tab is only mine */
  const pool=()=>{const mine=myTopics();if(kind==='mine')return mine.map(m=>({t:m.t,f:FORMATS[m.f]?m.f:'ld'}));return TOPICS[kind].map(t=>({t,f:FORMATS[kind]?kind:null})).concat(mine.filter(m=>m.f===kind).map(m=>({t:m.t,f:m.f})))};
  const pick=()=>{const L=pool();if(!L.length)return null;let i;do{i=Math.floor(Math.random()*L.length)}while(L.length>1&&i===last);last=i;return L[i]};
  const ghost='class="btn ghost" style="color:var(--forest-ink);box-shadow:inset 0 0 0 1.5px #ffffff55"';
  app.innerHTML=`
    <a class="back" href="#/">← Speech &amp; Debate</a>
    <div class="top"><div><h1>Practice topics</h1><p class="sub">Practice prompts for drills, plus your own list for this season's real resolutions.</p></div></div>
    <div class="seg" style="margin-bottom:var(--gap)">${Object.entries(names).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===kind}">${k==='mine'?'My topics':v.replace(/ (resolution|prompt|question)$/,'')}</button>`).join('')}</div>
    <div class="prompt"><span class="blob"></span><span class="lbl">${names[kind]}</span><q id="q"></q>
      <div class="row" id="acts"></div></div>
    <div id="sprintbox"></div>
    <div class="box mt" id="mybox" style="margin-top:var(--gap)"><div class="row" style="justify-content:space-between;align-items:baseline"><h2>My topics</h2><span class="small" id="mtn"></span></div>
      <p class="small" style="margin:0">Paste this season's real resolutions, one per line. They show up in the picker for that format, under My topics, and in Sprint. Saved on this device.</p>
      <textarea id="mt" rows="3" placeholder="Resolved: …" maxlength="3000"></textarea>
      <div class="row" style="align-items:center"><div class="seg" id="mtf">${['ld','pf','policy'].map(k=>`<button data-f="${k}" aria-pressed="${k===mf}">${FORMATS[k].short}</button>`).join('')}</div><button class="btn sm" id="mtadd">Add</button></div>
      <div class="mtl" id="mtl"></div></div>`;
  const show=()=>{cur=pick()||{t:'',f:null};$('q').textContent=cur.t||(kind==='mine'?'Nothing saved yet. Paste your resolutions below and they show up here.':'');drawActs()};
  function drawActs(){
    const f=cur.f,word=kind==='mine'?'topic':names[kind].split(' ').pop();
    $('acts').innerHTML=`<button class="btn" style="background:var(--forest-ink);color:var(--forest)" id="again">New ${word}</button>
      ${kind==='impromptu'?`<a ${ghost} href="#/speech/impromptu">Start Impromptu timer</a>`:kind==='extemp'?`<a ${ghost} href="#/speech/extemp">Start Extemp timer</a>`:f?`<a ${ghost} href="#/round/${f}">Open ${f==='policy'?'Policy':FORMATS[f].short} timer</a>`:''}
      ${f&&cur.t?`<button ${ghost} id="sprint">Sprint ⚡</button>`:''}`;
    $('again').onclick=show;
    if($('sprint'))$('sprint').onclick=()=>sprint(cur.t,cur.f,Math.random()<.5?0:1);
  }
  show();
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{location.hash='#/topics/'+b.dataset.k});
  keys=null;
  /* my topics */
  function drawMine(){const m=myTopics();$('mtn').textContent=m.length?m.length+' saved':'';
    $('mtl').innerHTML=m.map((x,i)=>`<div class="mti"><code>${E((FORMATS[x.f]||FORMATS.ld).short)}</code><span>${E(x.t)}</span><button class="mini" data-rmt="${i}" aria-label="Remove">✕</button></div>`).join('')}
  drawMine();
  $('mtf').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;mf=b.dataset.f;$('mtf').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('mtadd').onclick=()=>{const m=myTopics();$('mt').value.split('\n').map(t=>t.trim().slice(0,300)).filter(Boolean).forEach(t=>{if(!m.some(x=>x.t===t&&x.f===mf))m.push({t,f:mf})});
    store.set('mytopics',m.slice(0,60));$('mt').value='';drawMine();if(kind==='mine'||kind===mf)show()};
  $('mtl').onclick=e=>{const b=e.target.closest('[data-rmt]');if(!b)return;const m=myTopics();m.splice(+b.dataset.rmt,1);store.set('mytopics',m);drawMine();if(kind==='mine'&&!m.length)show()};
  /* argument sprint: coin flip for a side, then 60 seconds to write three arguments */
  function sprint(res,fkey,side){
    const F=FORMATS[fkey]||FORMATS.ld,sides=F.sides;let left=60,done=false;clearInterval(ticker);
    const box=$('sprintbox');
    box.innerHTML=`<div class="box sprint" style="margin-top:var(--gap)"><h2>Argument sprint</h2><p class="muted" style="margin:0">${E(res)}</p>
      <div class="coin" id="coin">?</div><div class="sideword" id="sideword">Flipping…</div><div id="sbody"></div></div>`;
    box.scrollIntoView({behavior:'smooth',block:'start'});
    const coin=$('coin');
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    requestAnimationFrame(()=>coin.classList.add('flip'));
    setTimeout(()=>{
      coin.classList.remove('flip');coin.classList.add('sd'+side);coin.textContent=sides[side];
      $('sideword').className='sideword sd'+side;$('sideword').textContent=`You're ${sides[side]}. Go.`;
      $('sbody').innerHTML=`<div class="sdig" id="sdig">1:00</div>
        ${[1,2,3].map(i=>`<textarea id="arg${i}" rows="2" placeholder="Argument ${i} for the ${sides[side]}" maxlength="400"></textarea>`).join('')}
        <div class="row"><button class="btn sm" id="sdone">Done early</button></div>`;
      $('arg1').focus();
      $('sdone').onclick=()=>finish();
      let last=performance.now();
      tick(()=>{const now=performance.now();left-=(now-last)/1000;last=now;const d=$('sdig');if(!d)return;d.textContent=fmtTc(left);d.classList.toggle('warn',left<=10);if(left<=0)finish()});
    },reduced?50:1400);
    function finish(){
      if(done)return;done=true;clearInterval(ticker);beep(2);
      const args=[1,2,3].map(i=>($('arg'+i)?$('arg'+i).value.trim():'')).filter(Boolean);
      const txt=`${res}\n${sides[side]} arguments (60-second sprint)\n`+args.map((a,i)=>`${i+1}. ${a}`).join('\n');
      $('sbody').innerHTML=`<div class="sdig">Time</div>
        ${args.length?`<ol>${args.map(a=>`<li>${E(a)}</li>`).join('')}</ol>`:'<p class="muted">Nothing written this time. Run it again.</p>'}
        <div class="row"><button class="btn sm" id="ssave">Save to cases</button><button class="btn sm ghost" id="scopy">Copy</button><button class="btn sm ghost" id="sflip">Run the other side</button><button class="btn sm ghost" id="snew">New resolution</button></div><div class="small" id="smsg"></div>`;
      $('scopy').onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('scopy').textContent='Copied ✓'}catch(e){$('smsg').textContent='Couldn\'t copy. Select the text above instead.'}};
      $('ssave').onclick=()=>{store.set('caseDraft',{kind:'case',side:side?'neg':'aff',title:`${sides[side]} sprint · ${res.replace(/^Resolved:\s*/i,'').slice(0,160)}`,body:args.map((a,i)=>`**${i+1}.** ${a}`).join('\n\n')+`\n\n==Written in a 60-second sprint on ${new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})}==`});
        location.hash='#/cases/new'};
      $('sflip').onclick=()=>sprint(res,fkey,1-side);
      $('snew').onclick=()=>{show();if(cur.f&&cur.t)sprint(cur.t,cur.f,Math.random()<.5?0:1)};
    }
  }
}

/* ── speech drill: record, live transcript, filler words ── */
const FILLERS=['um','uh','er','erm','like','you know','basically','actually','literally','i mean','kind of','sort of','so yeah','right'];
const FILLER_RE=new RegExp('\\b('+FILLERS.map(f=>f.replace(/ /g,'\\s+')).join('|')+'|u+m+|u+h+)\\b','gi');
function drill(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const kinds={round:'Impromptu round',impromptu:'Impromptu',extemp:'Extemp',ld:'LD',pf:'PF',free:'Free talk'};
  let kind=store.get('drillKind','impromptu'),target=store.get('drillTarget',120);if(!kinds[kind])kind='impromptu';
  let rec=null,media=null,stream=null,chunks=[],sr=null,running=false,t0=0,elapsed=0,finalText='',interim='',taps=0,audioURL=null;
  let phase='idle',prepLeft=0,prepUsed=0;   // idle | prep | talk  (prep only in the Impromptu round)
  const PREP=120,ROUND=300;
  const tgtSecs=()=>kind==='round'?ROUND:target;
  const pickPrompt=()=>{const k=kind==='round'?'impromptu':kind;return k==='free'?'Talk about anything: your weekend, a movie, why your favorite food is the best.':TOPICS[k][Math.floor(Math.random()*TOPICS[k].length)]};
  let prompt=pickPrompt();
  app.innerHTML=`
    <a class="back" href="#/">← Speech &amp; Debate</a>
    <div class="top"><div><h1>Speech drill</h1><p class="sub">Talk, and see your pace and filler words ("um", "like", "you know") as you go. Impromptu round runs the real flow: 2:00 of prep, then 5:00 speaking.</p></div></div>
    <div class="seg" style="margin-bottom:var(--gap)" id="kinds">${Object.entries(kinds).map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===kind}">${v}</button>`).join('')}</div>
    <div class="dr">
      <div class="drmain">
        <div class="prompt"><span class="blob"></span><span class="lbl">Your prompt</span><q id="q"></q>
          <div class="row"><button class="btn sm" style="background:var(--forest-ink);color:var(--forest)" id="newq">New prompt</button></div></div>
        <div class="clock sd2">
          <div class="now"><span class="code" id="state">Ready</span><span class="name" id="tgt"></span></div>
          <div class="digits" id="digits">0:00</div>
          <div class="ctl"><button class="btn go" id="go">Start talking</button><button class="btn sm ghost" id="cancel" hidden>Cancel</button><button class="btn sm ghost" id="tap" title="Tap when you hear a filler (or press F)">+1 filler <b id="taps">0</b></button></div>
          <div class="small" id="note"></div>
        </div>
        <div class="box"><h2>What you said</h2><div class="transcript" id="tx"><span class="muted">Your words show up here while you talk.</span></div><audio id="play" controls hidden></audio></div>
      </div>
      <div class="drside">
        <div class="box"><h2>Live</h2>
          <div class="stats"><div><b id="wpm">0</b><span>words / min</span></div><div><b id="fc">0</b><span>fillers</span></div><div><b id="fpm">0</b><span>fillers / min</span></div><div><b id="wc">0</b><span>words</span></div></div>
          <div class="fl" id="fl"></div>
          <p class="small">A good pace is about 130–170 words a minute. Aim for under 2 fillers a minute.</p></div>
        <div class="box"><h2>Settings</h2>
          <label class="setrow">Target time<select id="target">${[60,90,120,180,300,420].map(s=>`<option value="${s}"${s===target?' selected':''}>${fmtT(s)}</option>`).join('')}</select></label>
          <label class="check"><input type="checkbox" id="snd" ${store.get('sound',true)?'checked':''}> Beep at the target time</label></div>
        <div class="box"><h2>Your stats</h2><div id="dstats"></div></div>
        <div class="box"><h2>Your last drills</h2><div class="hist" id="hist"></div></div>
      </div>
    </div>`;
  const showPrompt=()=>{$('q').textContent=prompt};showPrompt();
  $('newq').onclick=()=>{prompt=pickPrompt();showPrompt()};
  $('kinds').onclick=e=>{const b=e.target.closest('[data-k]');if(!b||running)return;kind=b.dataset.k;store.set('drillKind',kind);
    $('kinds').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));prompt=pickPrompt();showPrompt();$('go').textContent=kind==='round'?'Start prep':'Start talking';$('target').disabled=kind==='round';draw()};
  $('go').textContent=kind==='round'?'Start prep':'Start talking';$('target').disabled=kind==='round';
  $('target').onchange=e=>{target=+e.target.value;store.set('drillTarget',target);draw()};
  $('snd').onchange=e=>store.set('sound',e.target.checked);
  $('note').textContent=SR?'Uses your microphone. The recording stays on this device.':'Live word counting works in Chrome, Edge and Safari. You can still record yourself and tap +1 for each filler.';

  const counts=()=>{const all=(finalText+' '+interim).toLowerCase();const m=all.match(FILLER_RE)||[];const by={};
    m.forEach(w=>{w=w.replace(/\s+/g,' ').replace(/^u+m+$/,'um').replace(/^u+h+$/,'uh');by[w]=(by[w]||0)+1});
    const words=(all.match(/[a-z0-9']+/g)||[]).length;return{n:m.length+taps,by,words}};
  function draw(){
    const T=tgtSecs();
    if(phase==='prep'){$('digits').textContent=fmtTc(prepLeft);$('tgt').textContent='Prep · then 5:00 to speak';$('digits').className='digits'+(prepLeft<=10?' warn':'');return}
    $('digits').textContent=fmtTc(elapsed);$('tgt').textContent=(kind==='round'?'Speak for ':'Target ')+fmtT(T)+(elapsed>T?' · over':'');
    $('digits').className='digits'+(elapsed>T?' over':'');
    const c=counts(),min=Math.max(elapsed,1)/60;
    $('wpm').textContent=elapsed>5?Math.round(c.words/min):0;$('fc').textContent=c.n;$('fpm').textContent=elapsed>5?(c.n/min).toFixed(1):0;$('wc').textContent=c.words;$('taps').textContent=taps;
    $('fl').innerHTML=Object.entries(c.by).sort((a,b)=>b[1]-a[1]).map(([w,n])=>`<span>${E(w)} <b>${n}</b></span>`).join('')+(taps?`<span>tapped <b>${taps}</b></span>`:'');
    if(finalText||interim)$('tx').innerHTML=E(finalText).replace(FILLER_RE,'<mark>$&</mark>')+(interim?` <span class="muted">${E(interim)}</span>`:'');
  }
  /* stats from the stored results: sessions, average fillers/min, best WPM and a 14-day line of fillers/min by day */
  function drawStats(){
    const h=store.get('drills',[]).filter(d=>d&&d.at),box=$('dstats');
    if(!h.length){box.innerHTML='<p class="small" style="margin:0">Finish a drill of 10 seconds or more and your numbers show up here.</p>';return}
    const n=h.length,avg=(h.reduce((a,d)=>a+(+d.fpm||0),0)/n).toFixed(1),best=Math.max(...h.map(d=>+d.wpm||0));
    const day=ts=>{const d=new Date(ts);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
    const today=day(Date.now()),days=Array.from({length:14},(_,i)=>today-(13-i)*86400e3);
    const by=days.map(t=>{const L=h.filter(d=>day(d.at)===t);return L.length?{t,n:L.length,v:L.reduce((a,d)=>a+(+d.fpm||0),0)/L.length}:{t,n:0}});
    const recent=by.reduce((a,d)=>a+d.n,0);
    const W=Math.max(200,box.clientWidth||280),H=64,px=10,pr=50,top=10,bot=14;   // pr leaves room for the "2 / min" label past the right edge of the plot
    const max=Math.max(3,...by.filter(d=>d.n).map(d=>d.v));
    const x=i=>px+i*(W-px-pr)/13,y=v=>top+(H-top-bot)*(1-v/max);
    const pts=by.map((d,i)=>d.n?[x(i),y(d.v),d]:null);
    let path='',prevPt=null;pts.forEach(p=>{if(!p){prevPt=null;return}path+=(prevPt?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);prevPt=p});
    const fmtD=t=>new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    box.innerHTML=`<div class="stats"><div><b>${n}</b><span>session${n===1?'':'s'}</span></div><div><b>${avg}</b><span>avg fillers / min</span></div><div><b>${best}</b><span>best wpm</span></div><div><b>${recent}</b><span>in the last 14 days</span></div></div>
      <svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fillers per minute over the last 14 days"><line class="base" x1="${px}" x2="${W-pr}" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}"/><line class="ref" x1="${px}" x2="${W-pr}" y1="${y(2).toFixed(1)}" y2="${y(2).toFixed(1)}"/><text x="${W-pr+6}" y="${(y(2)+3.5).toFixed(1)}">2 / min</text>
      ${path?`<path class="lnk" d="${path}"/>`:''}${pts.filter(Boolean).map(p=>`<circle class="pt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"><title>${fmtD(p[2].t)} · ${p[2].v.toFixed(1)} fillers/min · ${p[2].n} session${p[2].n===1?'':'s'}</title></circle>`).join('')}
      <text x="${px}" y="${H-2}">${fmtD(days[0])}</text><text x="${W-pr}" y="${H-2}" text-anchor="end">today</text></svg>
      <p class="small" style="margin:0">Fillers per minute by day, last 14 days. Lower is better; under 2 is the goal.</p>`;
  }
  function drawHist(){const h=store.get('drills',[]);drawStats();
    $('hist').innerHTML=h.length?h.slice(0,12).map(d=>`<div><span>${new Date(d.at).toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${E(kinds[d.kind]||'')}</span><span>${fmtT(d.secs)}${d.prep!=null?' · '+fmtT(d.prep)+' prep':''} · ${d.wpm} wpm · ${d.fpm} fillers/min</span></div>`).join(''):'<span class="small">Nothing yet.</span>'}
  drawHist();
  /* Impromptu round: 2:00 prep countdown (beeps at 1:00 and 0:10), then straight into the 5:00 talk */
  function startPrep(){
    phase='prep';prepLeft=PREP;prepUsed=0;running=true;$('go').textContent='Start talking now';$('cancel').hidden=false;$('state').textContent='Prep';
    $('tx').innerHTML='<span class="muted">Think it through. Your words show up here once you start talking.</span>';
    let last=performance.now();wakeLock(true);
    tick(()=>{const now=performance.now(),b=prepLeft;prepLeft-=(now-last)/1000;last=now;
      if(b>60&&prepLeft<=60)beep(1);if(b>10&&prepLeft<=10)beep(1);
      if(prepLeft<=0){beep(2);prepUsed=PREP;talk();return}draw()});
    draw();
  }
  function cancelPrep(){phase='idle';running=false;clearInterval(ticker);wakeLock(false);$('go').textContent='Start prep';$('cancel').hidden=true;$('state').textContent='Ready';draw()}
  async function start(){if(kind==='round'&&phase==='idle')return startPrep();if(phase==='prep'){prepUsed=Math.max(0,PREP-prepLeft)}return talk()}
  async function talk(){
    clearInterval(ticker);phase='talk';$('cancel').hidden=true;
    finalText='';interim='';taps=0;elapsed=0;chunks=[];$('play').hidden=true;if(audioURL)URL.revokeObjectURL(audioURL);
    $('tx').innerHTML='<span class="muted">Listening…</span>';
    try{stream=await navigator.mediaDevices.getUserMedia({audio:true});
      if(window.MediaRecorder){media=new MediaRecorder(stream);media.ondataavailable=e=>e.data.size&&chunks.push(e.data);
        media.onstop=()=>{if(!chunks.length)return;audioURL=URL.createObjectURL(new Blob(chunks,{type:media.mimeType||'audio/webm'}));$('play').src=audioURL;$('play').hidden=false};media.start()}}
    catch(e){$('note').textContent='No microphone access, so nothing is recorded. The timer and +1 button still work.'}
    if(SR){sr=new SR();sr.lang='en-US';sr.continuous=true;sr.interimResults=true;
      sr.onresult=e=>{interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=(finalText?' ':'')+t.trim();else interim+=t}draw()};
      sr.onend=()=>{if(running)try{sr.start()}catch(e){}};sr.onerror=e=>{if(e.error==='not-allowed'){$('note').textContent='Microphone blocked, so words can\'t be counted. Tap +1 instead.'}};
      try{sr.start()}catch(e){}}
    running=true;t0=performance.now();wakeLock(true);$('go').textContent='Stop';$('state').textContent='Talking';
    let beeped=false,T=tgtSecs();tick(()=>{elapsed=(performance.now()-t0)/1000;if(!beeped&&elapsed>=T){beeped=true;beep(2)}draw()});
    draw();
  }
  function stop(){
    if(phase==='prep')return cancelPrep();
    running=false;phase='idle';clearInterval(ticker);wakeLock(false);
    try{sr&&sr.stop()}catch(e){}try{media&&media.state!=='inactive'&&media.stop()}catch(e){}stream&&stream.getTracks().forEach(t=>t.stop());
    $('go').textContent='Go again';$('state').textContent='Done';interim='';draw();
    if(elapsed>=10){const c=counts(),min=elapsed/60,h=store.get('drills',[]);
      const row={at:Date.now(),kind,secs:Math.round(elapsed),wpm:Math.round(c.words/min),fpm:+(c.n/min).toFixed(1)};if(kind==='round')row.prep=Math.round(prepUsed);
      h.unshift(row);store.set('drills',h.slice(0,60));drawHist()}
  }
  $('go').onclick=()=>running&&phase!=='prep'?stop():start();
  $('cancel').onclick=cancelPrep;
  $('tap').onclick=()=>{taps++;draw()};
  keys=e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='f'||e.key==='F'){taps++;draw()}};
  draw();
  return ()=>{if(running)stop()};
}

/* ── judge ballot helper ─────────────────────────── */
function ballot(){
  const B=store.get('ballot',null)||{fmt:'ld',round:'',a:'',b:'',deb:[{n:'',p:'',c:''},{n:'',p:'',c:''},{n:'',p:'',c:''},{n:'',p:'',c:''}],win:null,rfd:''};
  const save=()=>store.set('ballot',B);
  const per=()=>B.fmt==='ld'?1:2;
  const F=()=>FORMATS[B.fmt];
  /* speaker-point rubric: NSDA-style 25–30 scale in half points */
  const RUBRIC={25:'below average: major drops, hard to follow',25.5:'below average, but organized',26:'average: followed the round, some drops',26.5:'average, with real clash',27:'solid: clear and signposted, a few drops',27.5:'solid, good extensions',28:'good: organized, some weighing',28.5:'good and persuasive',29:'excellent: clear weighing, sharp cross-ex',29.5:'excellent, close to flawless',30:'the best speech I have seen this season'};
  const rubLine=(i,p)=>`Points · ${F().sides[i>>1]}${per()>1?' '+(i%2+1):''}${B.deb[i].n?' ('+B.deb[i].n+')':''}: ${p} — ${RUBRIC[p]}`;
  function render(){
    const sides=F().sides;
    const debRow=(i,side)=>`<div class="deb"><div class="row"><input data-d="${i}" data-f="n" placeholder="${sides[side]} speaker ${per()>1?(i%2)+1:''}" value="${E(B.deb[i].n)}" maxlength="40" style="flex:1">
      <input data-d="${i}" data-f="p" type="number" inputmode="decimal" min="20" max="30" step="0.1" placeholder="Points" value="${E(B.deb[i].p)}" style="width:96px" aria-label="Speaker points"></div>
      <div class="rub" data-rub="${i}">${Object.keys(RUBRIC).map(p=>`<button type="button" data-p="${p}" aria-pressed="${String(B.deb[i].p)===p}" title="${E(RUBRIC[p])}">${p}</button>`).join('')}</div><div class="rubnote" id="rubnote${i}">${RUBRIC[B.deb[i].p]?E(RUBRIC[B.deb[i].p]):'Tap a score to fill in the points and add a line to the RFD.'}</div>
      <textarea data-d="${i}" data-f="c" rows="2" placeholder="Comments for this speaker">${E(B.deb[i].c)}</textarea></div>`;
    const idx=side=>per()===1?[side*2]:[side*2,side*2+1];
    app.innerHTML=`
      <a class="back" href="#/">← Speech &amp; Debate</a>
      <div class="top"><div><h1>Ballot helper</h1><p class="sub">For judges and practice rounds. Fill it in, then copy it into Tabroom or a text. Saved on this device.</p></div>
        <div class="row"><button class="btn sm" id="copy">Copy ballot</button><button class="btn sm ghost" id="clear">New ballot</button></div></div>
      <div class="seg" style="margin-bottom:var(--gap)" id="fmts">${Object.entries(FORMATS).map(([k,f])=>`<button data-k="${k}" aria-pressed="${k===B.fmt}">${f.name}</button>`).join('')}</div>
      <div class="bal">
        ${[0,1].map(s=>`<div class="box sidebox sd${s}"><div class="row" style="justify-content:space-between"><h2>${sides[s]}</h2><button class="btn sm win" data-win="${s}" aria-pressed="${B.win===s}">${B.win===s?'✓ Winner':'Pick as winner'}</button></div>
          <input data-side="${s?'b':'a'}" placeholder="${sides[s]} team or code (e.g. PV AB)" value="${E(B[s?'b':'a'])}" maxlength="60">
          ${idx(s).map(i=>debRow(i,s)).join('')}</div>`).join('')}
        <div class="box w"><h2>Reason for decision</h2>
          <input id="round" placeholder="Round (e.g. Round 3, Flight A)" value="${E(B.round)}" maxlength="60">
          <textarea id="rfd" rows="6" placeholder="Why did this side win? Name the arguments that decided it and how you weighed them.">${E(B.rfd)}</textarea>
          <div id="warn"></div></div>
      </div>`;
    wire();check();
  }
  function check(){
    const pts=B.deb.slice(0,per()*2).map(d=>parseFloat(d.p));const msgs=[];
    if(pts.some(p=>!isNaN(p)&&(p<20||p>30)))msgs.push('Speaker points are usually between 25 and 30.');
    if(B.win!==null&&pts.every(p=>!isNaN(p))){const sum=s=>pts.slice(s*per(),(s+1)*per()).reduce((a,b)=>a+b,0);
      if(sum(B.win)<sum(1-B.win))msgs.push('This is a low-point win (the winner has fewer points). That\'s allowed, but many tournaments ask you to explain it in the RFD.')}
    if(B.win===null)msgs.push('Pick a winner.');
    $('warn').innerHTML=msgs.map(m=>`<div class="small">• ${E(m)}</div>`).join('');
  }
  function text(){
    const sides=F().sides,L=[];
    L.push(`${F().name} ballot${B.round?' · '+B.round:''}`);
    L.push(`${sides[0]}: ${B.a||'—'}   vs   ${sides[1]}: ${B.b||'—'}`);
    L.push(`Decision: ${B.win===null?'(not picked)':sides[B.win]+(B[B.win?'b':'a']?' ('+B[B.win?'b':'a']+')':'')}`,'');
    for(let s=0;s<2;s++)for(let k=0;k<per();k++){const d=B.deb[s*2+k];L.push(`${sides[s]}${per()>1?' '+(k+1):''}: ${d.n||'—'}${d.p?' · '+d.p+' points':''}`);if(d.c.trim())L.push('  '+d.c.trim().replace(/\n/g,'\n  '))}
    L.push('','Reason for decision:',B.rfd.trim()||'—');return L.join('\n');
  }
  function wire(){
    app.querySelectorAll('[data-d]').forEach(el=>el.oninput=()=>{B.deb[+el.dataset.d][el.dataset.f]=el.value;save();check();
      if(el.dataset.f==='p'){const r=app.querySelector(`[data-rub="${el.dataset.d}"]`);r.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===el.value))}});
    app.querySelectorAll('[data-rub]').forEach(r=>r.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const i=+r.dataset.rub,p=b.dataset.p;
      B.deb[i].p=p;app.querySelector(`[data-d="${i}"][data-f="p"]`).value=p;r.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('rubnote'+i).textContent=RUBRIC[p];
      const tag='Points · '+F().sides[i>>1]+(per()>1?' '+(i%2+1):'');const lines=B.rfd.split('\n').filter(l=>!l.startsWith(tag+':')&&!l.startsWith(tag+' ('));
      B.rfd=(lines.join('\n').replace(/\n+$/,'')+'\n'+rubLine(i,p)).replace(/^\n/,'');$('rfd').value=B.rfd;save();check()});
    app.querySelectorAll('[data-side]').forEach(el=>el.oninput=()=>{B[el.dataset.side]=el.value;save()});
    $('rfd').oninput=e=>{B.rfd=e.target.value;save()};$('round').oninput=e=>{B.round=e.target.value;save()};
    app.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>{B.win=+b.dataset.win;save();render()});
    $('fmts').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;B.fmt=b.dataset.k;save();render()};
    $('copy').onclick=async()=>{try{await navigator.clipboard.writeText(text());$('copy').textContent='Copied ✓'}catch(e){prompt('Copy this:',text())}setTimeout(()=>{const c=$('copy');if(c)c.textContent='Copy ballot'},1800)};
    $('clear').onclick=e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again to clear';return}
      store.set('ballot',null);ballot()};
  }
  render();
}

/* ── case + evidence library (private, needs an account) ── */
function loadSB(){
  if(window.SB!==undefined)return Promise.resolve(window.SB);
  const add=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.append(s)});
  return add('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js').then(()=>add('/config.js?v=20261001')).then(()=>add('/lib/sb.js?v=20261001')).then(()=>window.SB).catch(()=>null);
}
// **read this** = underlined/bold (what you read aloud), ==this== = highlighted
const cardHTML=s=>E(s).replace(/==([^=\n]+)==/g,'<mark>$1</mark>').replace(/\*\*([^*\n]+)\*\*/g,'<u><b>$1</b></u>').replace(/\n/g,'<br>');
async function cases(id){
  app.innerHTML=`<a class="back" href="#/">← Speech &amp; Debate</a><div class="top"><div><h1>Cases &amp; evidence</h1><p class="sub">Loading…</p></div></div>`;
  const SB=await loadSB();
  const sess=SB?(await SB.auth.getSession()).data.session:null;
  if(!sess){app.querySelector('.sub').innerHTML=`Your own library of cases and evidence cards, saved to your account so it's on every device. Only you can see it.`;
    app.insertAdjacentHTML('beforeend',`<div class="box" style="max-width:520px"><h2>Sign in to use it</h2><p class="muted">It's free. Your cards are private to you.</p><div class="row"><a class="btn" href="/join/?next=${encodeURIComponent('/debate/#/cases')}">Sign in or join</a></div></div>`);return}
  const {data,error}=await SB.from('debate_cards').select('*').order('updated_at',{ascending:false}).limit(1000);
  if(error){app.querySelector('.sub').textContent='Couldn\'t load your library. Try again in a minute.';return}
  const tr=await SB.rpc('my_teams');const TEAMS=tr.data||[];const me=sess.user.id;
  const teamName=t=>(TEAMS.find(x=>x.id===t)||{}).name||'Team';
  let items=data||[],q='',kind='all',side='all',whose='all';
  const SIDES={both:'Both',aff:'Aff / Pro',neg:'Neg / Con'};
  if(id==='team')return teams();
  if(id==='new'||(id&&items.some(x=>String(x.id)===id)))return editor(id==='new'?null:items.find(x=>String(x.id)===id));
  function list(){
    app.innerHTML=`<a class="back" href="#/">← Speech &amp; Debate</a>
      <div class="top"><div><h1>Cases &amp; evidence</h1><p class="sub">${TEAMS.length?`Your cards plus the ones your team shares. ${items.length} in all.`:`Only you can see these unless you share them with a team. ${items.length} saved.`}</p></div>
        <div class="row"><a class="btn sm" href="#/cases/new">New card or case</a><a class="btn sm ghost" href="#/cases/team">${TEAMS.length?'Team':'Make or join a team'}</a><button class="btn sm ghost" id="dl"${items.length?'':' disabled'}>Download all</button></div></div>
      <div class="flowbar"><input id="q" placeholder="Search tags, cites, text, topics" value="${E(q)}" style="flex:1;min-width:200px">
        <div class="seg" id="kind">${[['all','All'],['card','Cards'],['case','Cases']].map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===kind}">${v}</button>`).join('')}</div>
        <div class="seg" id="side">${[['all','Any side'],['aff','Aff'],['neg','Neg']].map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===side}">${v}</button>`).join('')}</div>
        ${TEAMS.length?`<div class="seg" id="whose">${[['all','Everyone'],['mine','Mine'],...TEAMS.map(t=>['t'+t.id,t.name])].map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===whose}">${E(v)}</button>`).join('')}</div>`:''}</div>
      <div class="cards" id="cards"></div>`;
    const draw=()=>{const t=q.toLowerCase();
      const L=items.filter(x=>(whose==='all'||(whose==='mine'?x.user_id===me:'t'+x.team_id===whose))&&(kind==='all'||x.kind===kind)&&(side==='all'||x.side===side||x.side==='both')&&(!t||(x.title+' '+x.cite+' '+x.body+' '+x.topic).toLowerCase().includes(t)));
      $('cards').innerHTML=L.map(x=>`<a class="card" href="#/cases/${x.id}"><span class="ctag">${x.kind==='case'?'Case':'Card'} · ${SIDES[x.side]}${x.topic?' · '+E(x.topic):''}${x.team_id?` · <span class="tshare">${x.user_id===me?'Shared':'From'} ${E(teamName(x.team_id))}</span>`:''}</span><b>${E(x.title)}</b>${x.cite?`<span class="cite">${E(x.cite)}</span>`:''}<span class="cbody">${E(x.body.slice(0,180))}${x.body.length>180?'…':''}</span></a>`).join('')
        ||`<div class="box"><p class="muted">${items.length?'Nothing matches.':'Nothing saved yet. Press <b>New card or case</b> to add your first one.'}</p></div>`};
    $('q').oninput=e=>{q=e.target.value;draw()};
    $('kind').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;kind=b.dataset.k;$('kind').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
    $('side').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;side=b.dataset.k;$('side').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
    if($('whose'))$('whose').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;whose=b.dataset.k;$('whose').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()};
    $('dl').onclick=()=>{const txt=items.map(x=>`${x.kind==='case'?'CASE':'CARD'} · ${SIDES[x.side]}${x.topic?' · '+x.topic:''}\n${x.title}\n${x.cite?x.cite+'\n':''}\n${x.body}`).join('\n\n----------------------------------------\n\n');
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/plain'}));a.download='debate-library.txt';a.click()};
    draw();
  }
  function editor(x){
    if(x&&x.user_id!==me)return viewOnly(x);
    const isNew=!x;x=x||{kind:'card',title:'',cite:'',body:'',topic:store.get('lastTopic',''),side:'both',team_id:store.get('lastTeam',null)};
    const draft=isNew?store.get('caseDraft',null):null;if(draft){Object.assign(x,{kind:draft.kind||'case',side:draft.side||'both',title:draft.title||'',body:draft.body||''});store.set('caseDraft',null)}
    if(x.team_id&&!TEAMS.some(t=>t.id===x.team_id))x.team_id=null;
    app.innerHTML=`<a class="back" href="#/cases">← All cards &amp; cases</a>
      <div class="top"><div><h1>${isNew?'New':'Edit'} ${x.kind==='case'?'case':'card'}</h1><p class="sub">Put <code>**double stars**</code> around the words you read out loud and <code>==equals==</code> around anything to highlight.</p></div></div>
      <div class="ced">
        <div class="box">
          <div class="row"><div class="seg" id="ek">${[['card','Evidence card'],['case','Case']].map(([k,v])=>`<button data-k="${k}" aria-pressed="${k===x.kind}">${v}</button>`).join('')}</div>
            <select id="eside" aria-label="Side">${Object.entries(SIDES).map(([k,v])=>`<option value="${k}"${k===x.side?' selected':''}>${v}</option>`).join('')}</select>
            ${TEAMS.length?`<select id="eteam" aria-label="Who can see it"><option value="">Only me</option>${TEAMS.map(t=>`<option value="${t.id}"${t.id===x.team_id?' selected':''}>Share with ${E(t.name)}</option>`).join('')}</select>`:''}</div>
          <input id="etitle" maxlength="200" placeholder="Tag (the claim this proves) or case name" value="${E(x.title)}">
          <input id="ecite" maxlength="600" placeholder="Cite: author, year, credentials, source, link" value="${E(x.cite)}">
          <input id="etopic" maxlength="80" placeholder="Topic (e.g. Nov–Dec LD)" value="${E(x.topic)}">
          <details class="cut"><summary>Cut a card · build the cite for me</summary>
            <div class="two"><input id="cauthor" maxlength="80" placeholder="Author (e.g. Maria Lopez)"><input id="ccred" maxlength="160" placeholder="Credentials (e.g. professor of law, UNLV)"></div>
            <input id="ctitle" maxlength="200" placeholder="Article title">
            <div class="two"><input id="csource" maxlength="80" placeholder="Source (e.g. The Atlantic)"><input id="cdate" maxlength="40" placeholder="Date (e.g. March 4, 2025)"></div>
            <input id="curl" maxlength="400" placeholder="https://…" inputmode="url">
            <div class="row"><button class="btn sm" id="ccut" type="button">Insert cite</button><span class="small" id="cmsg">Fills the cite line and puts the tag + cite at the top of the card.</span></div>
          </details>
          <textarea id="ebody" rows="14" maxlength="40000" placeholder="Paste the card text or write your case">${E(x.body)}</textarea>
          <div class="row"><button class="btn" id="esave">Save</button>${isNew?'':'<button class="btn sm ghost" id="ecopy">Copy</button><button class="btn sm danger" id="edel">Delete</button>'}</div><div id="emsg"></div>
        </div>
        <div class="box"><h2>Preview</h2><div class="cardview" id="eprev"></div><div class="readtime" id="eread"></div></div>
      </div>`;
    let kindNow=x.kind;
    const prev=()=>{$('eprev').innerHTML=`<b class="ptag">${E($('etitle').value||'Tag')}</b>${$('ecite').value?`<div class="cite">${E($('ecite').value)}</div>`:''}<div class="cbody2">${cardHTML($('ebody').value)}</div>`;
      const read=($('ebody').value.match(/\*\*([^*\n]+)\*\*/g)||[]).join(' ').split(/\s+/).filter(Boolean).length;$('eread').textContent=read?`About ${Math.max(1,Math.round(read/150*60))} seconds to read the **bold** text at 150 words a minute (${read} words).`:''};
    ['etitle','ecite','ebody'].forEach(i=>$(i).oninput=prev);prev();
    /* card cutter: standard debate cite = Lastname 'YY + full cite, dropped into the cite field and the top of the card */
    $('ccut').onclick=()=>{const v=id=>$(id).value.trim();const author=v('cauthor'),cred=v('ccred'),title=v('ctitle'),src=v('csource'),date=v('cdate'),url=v('curl');
      if(!author&&!title&&!src){$('cmsg').textContent='Add at least an author, a title or a source.';return}
      const yr=(date.match(/\b(19|20)\d{2}\b/)||[])[0];const last=author?author.split(/\s+/).pop().replace(/,$/,''):(src||'No author');
      const short=`${last}${yr?' ’'+yr.slice(2):''}`;
      const full=[author,cred,title?`"${title}"`:'',src,date,url,'accessed '+new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})].filter(Boolean).join(', ');
      const cite=`${short} — ${full}`;$('ecite').value=cite.slice(0,600);
      const tag=v('etitle')||'Tag';const head=`**${tag}**\n==${short}== ${full}\n\n`;
      const body=$('ebody').value;if(!body.includes(`==${short}==`))$('ebody').value=head+body.replace(/^\n+/,'');
      $('cmsg').textContent='Inserted. Now mark the words you read with **stars** and highlights with ==equals==.';prev()};
    $('ek').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;kindNow=b.dataset.k;$('ek').querySelectorAll('button').forEach(z=>z.setAttribute('aria-pressed',z===b))};
    $('esave').onclick=async()=>{const row={kind:kindNow,team_id:$('eteam')&&+$('eteam').value||null,side:$('eside').value,title:$('etitle').value.trim(),cite:$('ecite').value.trim(),topic:$('etopic').value.trim(),body:$('ebody').value};
      if(!row.title){$('emsg').innerHTML='<div class="small" style="color:var(--over)">Add a tag or name first.</div>';return}
      $('esave').disabled=true;store.set('lastTopic',row.topic);store.set('lastTeam',row.team_id);
      const r=isNew?await SB.from('debate_cards').insert(row).select().single():await SB.from('debate_cards').update(row).eq('id',x.id).select().single();
      $('esave').disabled=false;
      if(r.error){$('emsg').innerHTML=`<div class="small" style="color:var(--over)">${E(r.error.message)}</div>`;return}
      if(isNew)items.unshift(r.data);else Object.assign(x,r.data);location.hash='#/cases'};
    if(!isNew){
      $('ecopy').onclick=async()=>{const t=`${x.title}\n${x.cite}\n\n${x.body.replace(/\*\*|==/g,'')}`;try{await navigator.clipboard.writeText(t);$('ecopy').textContent='Copied ✓'}catch(e){}};
      $('edel').onclick=async e=>{if(!e.target.dataset.armed){e.target.dataset.armed=1;e.target.textContent='Click again to delete';return}
        const r=await SB.from('debate_cards').delete().eq('id',x.id);if(r.error){$('emsg').innerHTML=`<div class="small">${E(r.error.message)}</div>`;return}
        items=items.filter(z=>z!==x);location.hash='#/cases'};
    }
  }
  function viewOnly(x){
    app.innerHTML=`<a class="back" href="#/cases">← All cards &amp; cases</a>
      <div class="top"><div><h1>${x.kind==='case'?'Case':'Card'}</h1><p class="sub">Shared with ${E(teamName(x.team_id))} · ${SIDES[x.side]}${x.topic?' · '+E(x.topic):''}</p></div>
        <div class="row"><button class="btn sm" id="vcopy">Copy text</button><button class="btn sm ghost" id="vsave">Save my own copy</button></div></div>
      <div class="box" style="max-width:820px"><div class="cardview"><b class="ptag">${E(x.title)}</b>${x.cite?`<div class="cite">${E(x.cite)}</div>`:''}<div class="cbody2">${cardHTML(x.body)}</div></div><div id="vmsg"></div></div>`;
    $('vcopy').onclick=async()=>{try{await navigator.clipboard.writeText(`${x.title}\n${x.cite}\n\n${x.body.replace(/\*\*|==/g,'')}`);$('vcopy').textContent='Copied ✓'}catch(e){}};
    $('vsave').onclick=async()=>{$('vsave').disabled=true;const r=await SB.from('debate_cards').insert({kind:x.kind,side:x.side,title:x.title,cite:x.cite,topic:x.topic,body:x.body}).select().single();
      if(r.error){$('vsave').disabled=false;$('vmsg').innerHTML=`<div class="small">${E(r.error.message)}</div>`;return}location.hash='#/cases/'+r.data.id};
  }
  async function teams(){
    app.innerHTML=`<a class="back" href="#/cases">← All cards &amp; cases</a>
      <div class="top"><div><h1>Team</h1><p class="sub">Share cards with your debate team. Everyone on a team can read the cards shared to it; only the person who wrote a card can change it.</p></div></div>
      <div class="ced">
        <div class="box"><h2>Your teams</h2><div id="tlist">${TEAMS.length?'':'<p class="muted">You\'re not on a team yet.</p>'}</div></div>
        <div style="display:grid;gap:var(--gap)">
          <div class="box"><h2>Join a team</h2><p class="small">Ask your captain or coach for the 6-character code.</p><div class="row"><input id="jcode" maxlength="8" placeholder="ABC123" autocapitalize="characters" style="flex:1;min-width:0;text-transform:uppercase;font-weight:700;letter-spacing:.1em"><button class="btn sm" id="jgo">Join</button></div><div id="jmsg"></div></div>
          <div class="box"><h2>Make a team</h2><p class="small">You'll get a code to share with teammates.</p><div class="row"><input id="tname" maxlength="60" placeholder="e.g. PV Debate" style="flex:1;min-width:0"><button class="btn sm" id="tgo">Create</button></div><div id="tmsg"></div></div>
        </div>
      </div>`;
    const err=(id,e)=>{$(id).innerHTML=`<div class="small" style="color:var(--over);margin-top:6px">${E(e.message.replace(/^.*?: /,''))}</div>`};
    const drawT=async()=>{for(const t of TEAMS){const r=await SB.rpc('team_roster',{t:t.id});t.roster=r.data||[]}
      $('tlist').innerHTML=TEAMS.map(t=>`<div class="team"><div class="row" style="justify-content:space-between"><b>${E(t.name)}</b><span class="small">${t.members} member${t.members===1?'':'s'}${t.role==='owner'?' · you run it':''}</span></div>
        ${t.code?`<div class="row"><span class="small">Join code</span><span class="tcode">${E(t.code)}</span><button class="btn sm ghost" data-newcode="${t.id}">New code</button></div>`:''}
        <div class="roster">${t.roster.map(m=>`<span>${E(m.name||'Member')}${m.username?` <small>@${E(m.username)}</small>`:''}${m.role==='owner'?' <small>· captain</small>':''}</span>`).join('')}</div>
        <div><button class="btn sm danger" data-leave="${t.id}">${t.role==='owner'?'Delete team':'Leave team'}</button></div></div>`).join('')||'<p class="muted">You\'re not on a team yet.</p>';
      $('tlist').querySelectorAll('[data-newcode]').forEach(b=>b.onclick=async()=>{const r=await SB.rpc('new_team_code',{t:+b.dataset.newcode});if(!r.error){TEAMS.find(t=>t.id===+b.dataset.newcode).code=r.data;drawT()}});
      $('tlist').querySelectorAll('[data-leave]').forEach(b=>b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed=1;b.textContent=b.textContent.startsWith('Delete')?'Click again: shared cards go back to private':'Click again to leave';return}
        const r=await SB.rpc('leave_team',{t:+b.dataset.leave});
        if(r.error){const e=r.error,missing=e.code==='42883'||e.code==='PGRST202'||/404|not found|does not exist|schema cache/i.test(e.message||'');
          b.textContent=b.textContent.startsWith('Click again: shared')?'Delete team':'Leave team';delete b.dataset.armed;
          const m=document.createElement('div');m.className='small';m.style.cssText='color:var(--over);margin-top:4px';m.textContent=missing?'Leaving teams isn\'t turned on yet. Ask Kale, or just stop using the team for now.':(e.message||'Something went wrong').replace(/^.*?: /,'');
          b.parentElement.append(m);return}
        cases('team')})};
    drawT();
    $('jgo').onclick=async()=>{const r=await SB.rpc('join_team',{c:$('jcode').value});if(r.error)return err('jmsg',r.error);location.hash='#/cases';};
    $('tgo').onclick=async()=>{const n=$('tname').value.trim();if(n.length<2)return;const r=await SB.rpc('create_team',{n});if(r.error)return err('tmsg',r.error);cases('team')};
  }
  list();
}

/* ── router ───────────────────────────────────────── */
let keys=null,cleanup=null;
document.addEventListener('keydown',e=>{if(keys)keys(e)});
function route(){
  if(cleanup){cleanup();cleanup=null}
  clearInterval(ticker);wakeLock(false);keys=null;document.querySelector('.signal')?.remove();
  const p=location.hash.replace(/^#\/?/,'').split('/');window.scrollTo(0,0);
  if(p[0]==='round')return cleanup=round(p[1]);
  if(p[0]==='speech')return speech(p[1]);
  if(p[0]==='congress')return congress();
  if(p[0]==='flow')return cleanup=flow();
  if(p[0]==='topics')return topics(p[1]);
  if(p[0]==='drill')return cleanup=drill();
  if(p[0]==='ballot')return ballot();
  if(p[0]==='cases')return cases(p[1]);
  return hub();
}
addEventListener('hashchange',route);route();
