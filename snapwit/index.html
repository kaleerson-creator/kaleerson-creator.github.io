<style>
:root{
  --bg:#EEF0EA; --bg2:#E3E7DD; --bg3:#D9DED2; --ink:#141613; --ink2:#5E645B; --ink3:#8F958B; --line:#DCE0D6;
  --accent:#FF5A1F; --accent2:#FF8A5B;
  --good:#1EAA5E; --bad:#E5352B; --warn:#F3B81E;
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --body:'Geist',system-ui,-apple-system,sans-serif;
  --sh:0 1px 2px #14161c0a,0 6px 20px #14161c0e;
  --sh2:0 2px 6px #14161c14,0 14px 40px #14161c1a;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;position:relative;overflow:hidden}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.03em}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex;animation:fadeup .28s cubic-bezier(.2,.7,.2,1)}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:100}

/* ripple + juice */
.rp{position:absolute;border-radius:50%;background:#fff;opacity:.45;transform:translate(-50%,-50%) scale(0);pointer-events:none;animation:rip .55s ease-out forwards}
.rp.dark{background:#14161C;opacity:.12}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.pop{animation:pop .32s var(--ease)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.ft{position:absolute;font-family:var(--display);font-weight:800;font-size:28px;pointer-events:none;animation:ft .9s ease-out forwards;z-index:9;text-shadow:0 2px 8px #0002}
@keyframes ft{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}30%{transform:translate(-50%,-70%) scale(1.15)}to{opacity:0;transform:translate(-50%,-160%) scale(1)}}

/* ── HOME ── */
#home header{padding:20px 20px 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#home h1{font-size:36px}
#home h1 span{color:var(--accent)}
#home header small{display:block;font-size:12px;color:var(--ink2);font-weight:500;margin-top:2px}
.ring{position:relative;width:64px;height:64px;display:grid;place-items:center;margin-bottom:12px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring b{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.03em}
.ring small{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;background:var(--bg2);margin:8px 20px 0;border-radius:999px;padding:4px}
.tab{flex:1;padding:11px;border-radius:999px;font-weight:600;color:var(--ink2);transition:.18s}
.tab.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.list{flex:1;overflow-y:auto;padding:12px 20px calc(var(--sab) + 30px);display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start}
.list .sec{grid-column:1/-1;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-top:12px;display:flex;justify-content:space-between}
.card{--c:var(--accent);background:#fff;border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:132px;box-shadow:var(--sh);transition:transform .15s var(--ease),box-shadow .15s;overflow:visible}
.card:active{transform:scale(.96)}
.card .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c),#000 22%));box-shadow:0 4px 12px color-mix(in srgb,var(--c) 35%,transparent)}
.card b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.1;margin-top:auto}
.card .tag{font-size:11px;font-weight:600;color:var(--c);letter-spacing:.04em;text-transform:uppercase}
.card .best{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:5px}
.card .best i{font-style:normal;color:var(--ink);font-weight:600}
.mbar{height:4px;border-radius:99px;background:var(--bg2);overflow:hidden}
.mbar b{display:block;height:100%;background:var(--c);border-radius:99px}
.hero{grid-column:1/-1;background:linear-gradient(135deg,#1c1f2a,#14161C);color:#fff;border-radius:24px;padding:18px 18px 18px 20px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;min-height:max-content;box-shadow:var(--sh2);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#ff5a1f55,transparent 70%)}
.hero b{font-family:var(--display);font-size:20px;display:block}
.hero small{color:#b8bccc;font-size:13px}
.hero .go{background:var(--accent);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;white-space:nowrap;box-shadow:0 6px 18px #ff5a1f55;z-index:1}
.setup{grid-column:1/-1;background:#fff;border-radius:22px;padding:14px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:var(--sh)}
.setup span{font-size:13px;color:var(--ink2);font-weight:600}
.seg{display:flex;background:var(--bg2);border-radius:999px;padding:3px}
.seg button{padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;transition:.15s}
.seg button.on{background:var(--ink);color:#fff}

/* ── GAME ── */
.bar{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;position:relative;z-index:5}
.bar .back{width:42px;height:42px;border-radius:999px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;font-size:20px}
.bar h2{font-size:18px;flex:1}
.bar .hud{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap;background:#fff;padding:7px 12px;border-radius:999px;box-shadow:var(--sh);display:flex;align-items:center;gap:6px}
.lives{display:flex;gap:3px}
.lives i{width:9px;height:9px;border-radius:50%;background:var(--bad);display:block;transition:.2s}
.lives i.off{background:var(--bg3);transform:scale(.7)}
.prog{height:4px;margin:0 14px 6px;border-radius:99px;background:var(--bg3);overflow:hidden}
.prog b{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
#stage{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column;container-type:size}
.fill{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;transition:background .12s}
.fill h2{font-size:44px}
.fill p{font-size:17px;color:var(--ink2);max-width:30ch;font-weight:500}
.fill.red{background:#E5352B;color:#fff}.fill.red p{color:#ffd}
.fill.green{background:#1EAA5E;color:#fff}.fill.green p{color:#dfe}
.fill.yellow{background:#F3B81E;color:#14161C}.fill.yellow p{color:#14161C}
.fill.dark{background:#14161C;color:#fff}.fill.dark p{color:#b8bccc}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:32px;background:var(--bg);z-index:4}
.intro .ic{width:84px;height:84px;border-radius:26px;display:grid;place-items:center;font-size:40px;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c),#000 22%));box-shadow:0 10px 30px color-mix(in srgb,var(--c) 40%,transparent);animation:pop .5s var(--ease)}
.intro .tag{font-size:11px;font-weight:700;color:var(--c);letter-spacing:.1em;text-transform:uppercase}
.intro h2{font-size:34px}
.intro p{color:var(--ink2);max-width:32ch;font-size:17px}
.intro small{color:var(--ink3);font-weight:600}
.btn{background:var(--ink);color:#fff;padding:17px 32px;border-radius:999px;font-weight:700;font-size:17px;transition:transform .15s var(--ease);box-shadow:var(--sh2)}
.btn:active{transform:scale(.95)}
.btn.acc{background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 8px 24px #ff5a1f55}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.cd{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:120px;color:var(--ink);z-index:5;pointer-events:none}
.cd span{animation:cd .9s ease-out}
@keyframes cd{from{transform:scale(1.6);opacity:0}30%{transform:scale(1);opacity:1}to{opacity:0}}
.grid{--c:4;--r:5;display:grid;gap:8px;padding:16px;align-content:center;width:min(100%,calc((100cqh - 40px) * var(--c) / var(--r)));margin:auto}
.cell{aspect-ratio:1;border-radius:14px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:22px;transition:transform .1s;position:relative;overflow:hidden}
.cell:active{transform:scale(.93)}
.cell.blk{background:var(--ink);color:transparent}
.cell.hit{background:var(--good);color:#fff}
.cell.miss{background:var(--bad);color:#fff}
.cell.lit{background:var(--accent);box-shadow:0 0 0 3px #ff5a1f44}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:20px;align-content:center;width:min(100%,calc(100cqh - 40px));margin:auto}
.pad{aspect-ratio:1;border-radius:28px;opacity:.5;transition:opacity .08s,transform .1s var(--ease);box-shadow:inset 0 -6px 0 #0002}
.pad.lit,.pad:active{opacity:1;transform:scale(1.04);box-shadow:0 0 0 4px #fff,0 0 0 8px currentColor}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 16px calc(var(--sab) + 14px);margin-top:auto}
.keys button{padding:17px;border-radius:16px;background:#fff;box-shadow:var(--sh);font-family:var(--display);font-weight:700;font-size:22px}
.keys button:active{transform:scale(.95)}
.keys button.ok{background:var(--ink);color:#fff}
.bigword{flex:1;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:60px;padding:20px;text-align:center;letter-spacing:-.02em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 16px calc(var(--sab) + 16px)}
.choices button{padding:24px 10px;border-radius:18px;font-family:var(--display);font-weight:800;font-size:20px;color:#fff;transition:transform .1s;box-shadow:inset 0 -5px 0 #0002}
.choices button:active{transform:scale(.96)}
.target{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--accent2),var(--accent));box-shadow:0 0 0 6px #ff5a1f33,0 6px 16px #ff5a1f55;transform:translate(-50%,-50%);animation:pop .25s var(--ease)}
.dot{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--ink);transform:translate(-50%,-50%)}

/* ── RESULT ── */
#result{align-items:center;justify-content:center;text-align:center;padding:32px 24px;gap:8px}
#result small.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
#result .score{font-size:92px;line-height:1}
#result .score sub{font-size:22px;vertical-align:baseline;color:var(--ink2);font-weight:500;margin-left:4px}
#result .pct{font-size:18px;color:var(--ink2);margin-top:4px}
#result .pct b{color:var(--accent)}
.ribbon{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:0 6px 18px #ff5a1f55;animation:pop .5s var(--ease);display:inline-block}
.curve{width:min(100%,320px);height:110px;margin:10px 0 0}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
.chip{background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:500;color:var(--ink2);box-shadow:var(--sh)}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px}
#result .row+.row{margin-top:-2px}
[hidden]{display:none!important}
#rchal{flex:1}
.chal{display:inline-block;background:var(--butter,#FFC531);color:#14161C;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;margin-top:6px}
.chal.ok{background:var(--good,#1EAA5E);color:#fff}.chal.no{background:#E2E5DC;color:#14161C}
.hero .days{display:flex;gap:5px;margin-top:10px}.hero .days i{width:9px;height:9px;border-radius:50%;background:#ffffff38;display:block}.hero .days i.on{background:#fff}
.podium{display:grid;gap:8px;width:min(100%,340px);margin:8px 0 22px}
.podium div{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--zc),color-mix(in srgb,var(--zc),#000 20%));box-shadow:var(--sh)}
.podium div b{margin-left:auto;font-family:var(--display);font-size:22px}
.podium div:first-child{padding:16px 14px;font-size:18px}
.podium .pb{flex:1;height:6px;border-radius:99px;background:#0003;overflow:hidden}.podium .pb i{display:block;height:100%;background:#fff}

/* ── PARTY ── */
#party{background:#0f1118}
.zones{flex:1;display:grid;gap:6px;padding:6px;padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:calc(var(--sab) + 6px)}
.zones.p2{grid-template-rows:1fr 1fr}
.zones.p3{grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr}
.zones.p3 .zone:first-child{grid-column:1/-1}
.zones.p4{grid-template-rows:1fr 1fr;grid-template-columns:1fr 1fr}
.zone{--zc:#fff;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(180deg,var(--zc),color-mix(in srgb,var(--zc),#000 16%));color:#fff;transition:filter .2s,transform .2s;box-shadow:inset 0 0 0 1px #ffffff22}
.zone.out{filter:saturate(.2) brightness(.45)}
.zone.win{animation:winflash .45s 3;z-index:2}
@keyframes winflash{50%{filter:brightness(1.35)}}
.zin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:16px}
.zone.flip .zin{transform:rotate(180deg)}
.zin h3{font-size:clamp(24px,7vw,46px);color:#fff;text-shadow:0 2px 10px #0002;transition:font-size .1s}
.zin p{font-size:16px;opacity:.92;font-weight:500;max-width:34ch;line-height:1.35}
.zin .score{position:absolute;top:12px;left:16px;font-family:var(--display);font-weight:800;font-size:22px;background:#0003;padding:2px 12px;border-radius:999px}
.zin .lbl{position:absolute;top:14px;right:16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.8}
.zbtns{display:grid;gap:8px;width:100%;max-width:360px}
.zbtns.c2{grid-template-columns:1fr 1fr}.zbtns.c4{grid-template-columns:1fr 1fr}.zbtns.c3{grid-template-columns:repeat(3,1fr)}
.zbtn{padding:18px 6px;border-radius:16px;background:#ffffff33;font-family:var(--display);font-weight:800;font-size:22px;color:#fff;border:2px solid #ffffffaa;transition:transform .1s;box-shadow:0 4px 12px #0002}
.zbtn:active{transform:scale(.95);background:#ffffff66}
.zbtn.big{padding:26px;font-size:26px}
.zgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:min(100%,260px)}
.zgrid .zc{aspect-ratio:1;border-radius:10px;box-shadow:inset 0 -3px 0 #0002;position:relative;overflow:hidden}
.zone .fx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--display);font-weight:800;font-size:40px;background:#14161Ccc;z-index:3;animation:fadeup .2s}
.zone .fx small{font-size:14px;font-weight:600;opacity:.8}
.zone.flip .fx{transform:rotate(180deg)}
/* ready state */
.zready{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:380px}
.zready .gn{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:clamp(20px,5.5vw,30px)}
.zready .gn span{width:40px;height:40px;border-radius:12px;background:#ffffff2e;display:grid;place-items:center;font-size:22px}
.rules{background:#ffffff22;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:500;line-height:1.35;max-width:36ch;backdrop-filter:blur(4px)}
.rbtn{width:100%;padding:16px;border-radius:999px;background:#fff;color:var(--ink);font-family:var(--display);font-weight:800;font-size:20px;box-shadow:0 6px 18px #0003;transition:transform .15s var(--ease),background .15s}
.rbtn:active{transform:scale(.96)}
.rbtn.on{background:#14161C;color:#fff}
.pbar{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:var(--ink);padding:14px 24px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:24px;z-index:10;box-shadow:0 10px 40px #0008;white-space:nowrap;animation:pop .3s var(--ease)}
.pbar.go{background:var(--good);color:#fff;font-size:34px}
.pmenu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:11;background:#ffffff22;color:#fff;padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;backdrop-filter:blur(6px)}
.sb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:var(--ink);border-radius:24px;padding:18px 20px;width:min(86%,340px);z-index:12;box-shadow:0 20px 60px #000a;animation:pop .35s var(--ease)}
.sb h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:12px;text-align:center}
.sb .r{display:flex;align-items:center;gap:10px;margin:8px 0;font-weight:700}
.sb .r i{width:12px;height:12px;border-radius:50%;background:var(--zc)}
.sb .r .pb{flex:1;height:10px;border-radius:99px;background:var(--bg2);overflow:hidden}
.sb .r .pb b{display:block;height:100%;width:0;background:var(--zc);border-radius:99px;transition:width .5s var(--ease)}
.sb .r em{font-style:normal;font-family:var(--display);font-size:18px;min-width:20px;text-align:right}

/* ── BRAIN ── */
.ring{cursor:pointer}
#acct a{color:var(--accent);text-decoration:none;font-weight:600;margin-left:6px}
.bscroll{flex:1;overflow-y:auto;padding:4px 20px calc(var(--sab) + 32px);display:flex;flex-direction:column;gap:14px}
.bcard{background:#fff;border-radius:22px;padding:18px;box-shadow:var(--sh)}
.bhead{display:flex;align-items:center;gap:16px}
.bnum{font-size:64px;line-height:.9;color:var(--accent)}
.bhead b{font-family:var(--display);font-size:22px;display:block}
.bhead small{color:var(--ink2);font-size:13px;display:block;margin-top:2px}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--bg2);color:var(--ink2);margin-top:6px}
.pill.live{background:#e7f6ee;color:var(--good)}
.radar{width:100%;max-width:380px;display:block;margin:0 auto}
.bh{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.cat{padding:12px 0;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0;padding-top:0}
.cat .ch{display:flex;align-items:center;gap:10px;font-weight:700}
.cat .ch em{font-style:normal;margin-left:auto;font-family:var(--display);font-size:20px}
.cat .ch em.na{color:var(--ink3);font-size:14px;font-family:var(--body)}
.cat .cb{height:6px;border-radius:99px;background:var(--bg2);margin:8px 0 6px;overflow:hidden}
.cat .cb b{display:block;height:100%;border-radius:99px;background:var(--accent)}
.gm{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 0;font-size:13px;color:var(--ink2)}
.gm i{font-style:normal;color:var(--ink);font-weight:600;white-space:nowrap}
.gm span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gm span:last-child{margin-left:auto;font-variant-numeric:tabular-nums}
.gm .play{color:var(--accent);font-weight:700}
.how{font-size:13px;color:var(--ink2);line-height:1.5}
.how b{color:var(--ink)}
.spark{width:100%;height:60px;display:block}
.est{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin-left:4px}
/* ── GATE ── */
#gate{align-items:center;justify-content:center;padding:32px 24px}
.gatebox{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;max-width:340px}
.gic{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;font-size:34px;color:#fff;background:linear-gradient(145deg,var(--accent2),var(--accent));box-shadow:0 10px 30px #ff5a1f55}
.gatebox h2{font-size:32px}
.gatebox p{color:var(--ink2);font-size:17px}
.gatebox small{color:var(--ink3);font-size:13px}
.gatebox .btn{text-decoration:none}

/* ── site integration ── */
html,body{height:100%;overflow:hidden}
.foot-site{display:none}
.chip::before{display:none}
#app{flex:1;position:relative;width:100%;max-width:1180px;margin:0 auto;min-height:0}
#game,#result,#brain,#gate{max-width:900px;margin-inline:auto}
#party{position:fixed;inset:0;z-index:60}
#home header{position:relative;isolation:isolate;padding:20px 16px 8px}
#home header .blob{width:110px;aspect-ratio:1;left:-20px;top:8px;background:var(--peach);opacity:.9}
#home h1{font-size:clamp(36px,6vw,56px)}
.tabs{max-width:440px;margin:10px 16px 0;background:var(--card);box-shadow:0 1px 0 var(--line)}
.tab.on{background:var(--ink);color:#fff;box-shadow:none}
.list{padding:14px 16px 40px;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));grid-auto-rows:max-content;gap:12px}
.bar .hud:empty{display:none}
.intro .tag{color:var(--ink2)}
/* cards become soft colour blocks */
.card{background:var(--tint,#fff);border-radius:24px;box-shadow:none;position:relative;overflow:hidden;isolation:isolate;min-height:150px;padding:16px}
.card::after{content:'';position:absolute;z-index:-1;width:110px;aspect-ratio:1;right:-34px;top:-34px;background:#ffffff70;border-radius:58% 42% 51% 49% / 46% 55% 45% 54%;animation:morph 14s ease-in-out infinite}
.card:nth-child(even)::after{animation-direction:reverse;animation-duration:17s}
.card .ic{background:#ffffffb8;color:var(--ink);box-shadow:none}
.card .tag{color:var(--ink2)}
.card b{font-size:18px;letter-spacing:-.02em}
.mbar{background:#ffffff90}.mbar b{background:var(--ink)}
.hero{background:var(--forest);color:var(--forest-ink);border-radius:28px;padding:22px;isolation:isolate}
.hero::after{background:none;width:200px;height:200px;right:-50px;top:-70px;z-index:-1;background:#2E5440;border-radius:58% 42% 51% 49% / 46% 55% 45% 54%;animation:morph 14s ease-in-out infinite}
.hero small{color:#B9C9AE}
.hero .go{background:#fff;color:var(--ink);box-shadow:none}
.setup{box-shadow:none;border-radius:24px}
.bar .back,.bar .hud,.btn.ghost,.chip,.keys button,.cell,.bcard{box-shadow:none}
.btn.acc{background:var(--ink);box-shadow:none}
.intro .ic{background:var(--tint,var(--c));color:var(--ink);box-shadow:none;border-radius:58% 42% 51% 49% / 46% 55% 45% 54%;animation:morph 12s ease-in-out infinite}
.bcard{border-radius:28px}
.gic{background:var(--peach);color:var(--ink);box-shadow:none;border-radius:58% 42% 51% 49% / 46% 55% 45% 54%;animation:morph 12s ease-in-out infinite}
@media (max-width:520px){.card{min-height:140px;padding:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ═══════════════════ UTILS ═══════════════════ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const now=()=>performance.now();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const COLORS={Red:'#FF4757',Blue:'#2E7BFF',Yellow:'#FFC531',Green:'#22C55E'};
const PCOL=['#FF4757','#2E7BFF','#FFC531','#22C55E'];
const PNAME=['Red','Blue','Yellow','Green'];
const SHAPES=['●','■','▲','★','◆','✚'];
const WORDS='apple river candle mirror pillow forest silver planet button window garden rocket saddle lemon jacket tunnel harbor bridge cloud anchor velvet marble pepper falcon meadow copper ladder blanket puzzle summer feather cactus sponge magnet basket turtle engine yogurt compass helmet violin oyster prism thunder walnut spiral canyon dolphin eclipse fossil glacier hammock iceberg jungle kettle lantern mammoth needle orbit paddle quartz ribbon shadow tomato umbrella vortex whistle xenon yacht zipper barrel cherry dragon ember flame grape honey island jelly knight lotus mango noodle olive parrot quilt rabbit sailor tiger unicorn valley wagon acorn beacon cobalt dune ferry giant hazel ivory jigsaw koala llama mosaic nectar otter pebble radar scarf tulip ultra vapor willow'.split(' ');

/* icons (24x24 stroke) */
const I={
 bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="currentColor"/>',
 waves:'<circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M7 7a7 7 0 0 0 0 10M17 7a7 7 0 0 1 0 10M4 4a11 11 0 0 0 0 16M20 4a11 11 0 0 1 0 16"/>',
 hash:'<path d="M5 9h14M5 15h14M10 3 8 21M16 3l-2 18"/>',
 aim:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
 bubble:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/>',
 eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/>',
 radar:'<circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M3 12a9 9 0 0 1 9-9M21 12a9 9 0 0 1-9 9"/><circle cx="19" cy="6" r="1.5" fill="currentColor"/><circle cx="5" cy="18" r="1.5" fill="currentColor"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 dots:'<circle cx="6" cy="7" r="2" fill="currentColor"/><circle cx="16" cy="6" r="2" fill="currentColor"/><circle cx="10" cy="14" r="2" fill="currentColor"/><circle cx="18" cy="16" r="2" fill="currentColor"/><circle cx="6" cy="19" r="2" fill="currentColor"/>',
 math:'<path d="M5 8h6M8 5v6M13 17h6M5 17l3-3M5 14l3 3"/>',
 tiles:'<rect x="3" y="3" width="5" height="5" rx="1" fill="currentColor"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1" fill="currentColor"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1" fill="currentColor"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1" fill="currentColor"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.5" fill="currentColor"/><circle cx="4.5" cy="12" r="1.5" fill="currentColor"/><circle cx="4.5" cy="18" r="1.5" fill="currentColor"/>',
 wave:'<path d="M2 12h3l2-6 3 12 3-9 2 6 2-3h5"/>',
 palette:'<circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3" fill="currentColor"/><circle cx="7" cy="17" r="3" fill="currentColor"/><circle cx="17" cy="17" r="3"/>',
 cards:'<rect x="3" y="6" width="10" height="14" rx="2"/><path d="M13 4h6a2 2 0 0 1 2 2v12"/>',
 race:'<path d="M3 12h8M8 8l4 4-4 4M21 12h-8M16 8l-4 4 4 4"/>',
 bomb:'<circle cx="11" cy="14" r="7"/><path d="M14 8l3-3M17 5l2-2M19 5l1 1M19 5l1-1"/>',
 hand:'<path d="M8 12V6a1.5 1.5 0 0 1 3 0v5M11 5.5a1.5 1.5 0 0 1 3 0V11M14 7a1.5 1.5 0 0 1 3 0v4"/><path d="M8 12v4a5 5 0 0 0 10 0v-5"/><path d="M8 12l-2-2a1.5 1.5 0 0 0-2 2l3 5"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.8-4.4 4.3 1.1 6.1L12 17l-5.5 2.8 1.1-6.1L3.2 9.4l6.1-.8z"/>',
 flash:'<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2 2M16.4 16.4l2 2M5.6 18.4l2-2M16.4 7.6l2-2"/><circle cx="12" cy="12" r="3" fill="currentColor"/>',
 odd:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor"/>',
 watch:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6M12 2v3"/>',
 updown:'<path d="M8 20V5M4 9l4-4 4 4M16 4v15M12 15l4 4 4-4"/>',
 shapes:'<circle cx="7" cy="7" r="4"/><rect x="13" y="13" width="8" height="8" rx="1.5"/><path d="M17 3l4 7h-8z"/>',
 mega:'<path d="M3 10v4h3l7 4V6l-7 4z"/><path d="M17 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/>'
};
const icon=k=>`<svg class="i" viewBox="0 0 24 24">${I[k]||I.bolt}</svg>`;

/* audio + haptics */
let AC=null;
function beep(f=600,d=.06,type='sine',g=.12){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),v=AC.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,AC.currentTime);v.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(v).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const buzz=(p=12)=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const sfx={tap(){beep(700,.04,'square',.05);buzz(8)},good(){beep(880,.08);setTimeout(()=>beep(1320,.12),60);buzz(15)},win(){[660,880,1100,1320].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle',.12),i*90));buzz([20,30,20,30,60])},bad(){beep(160,.2,'sawtooth',.1);buzz([30,40,30])},go(){beep(1000,.15,'square',.1);buzz(25)},tick(){beep(1200,.03,'sine',.05)},cd(){beep(520,.1,'square',.08)}};
document.addEventListener('pointerdown',()=>{if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}},{once:true});

/* ripple on every tappable thing */
document.addEventListener('pointerdown',e=>{const t=e.target.closest('button,.cell,.pad,.zone,.zc');if(!t)return;const r=t.getBoundingClientRect();const s=Math.max(r.width,r.height)*2;const d=el('span','rp'+(getComputedStyle(t).color==='rgb(20, 22, 28)'?' dark':''));d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left}px;top:${e.clientY-r.top}px`;if(getComputedStyle(t).position==='static')t.style.position='relative';t.append(d);setTimeout(()=>d.remove(),600)},{passive:true});
const pop=e=>{e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')};
const shake=e=>{e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')};
function floatText(parent,txt,color,x='50%',y='50%'){const f=el('div','ft',txt);f.style.left=x;f.style.top=y;f.style.color=color||'#fff';parent.append(f);setTimeout(()=>f.remove(),950)}

/* confetti */
const FX=$('#fx'),FXC=FX.getContext('2d');let parts=[],fxRun=false;
function fxSize(){FX.width=innerWidth*devicePixelRatio;FX.height=innerHeight*devicePixelRatio;FXC.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
fxSize();addEventListener('resize',fxSize);
function confetti(x,y,colors,n=60,spread=1){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=(4+Math.random()*7)*spread;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,g:.25,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:4+Math.random()*4,c:pick(colors),life:60+Math.random()*40})}if(!fxRun){fxRun=true;requestAnimationFrame(fxTick)}}
function fxTick(){FXC.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0);for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.98;p.r+=p.vr;p.life--;FXC.save();FXC.translate(p.x,p.y);FXC.rotate(p.r);FXC.globalAlpha=Math.min(1,p.life/20);FXC.fillStyle=p.c;FXC.fillRect(-p.w/2,-p.h/2,p.w,p.h);FXC.restore()}if(parts.length)requestAnimationFrame(fxTick);else fxRun=false}
const burstAt=(elm,colors,n)=>{const r=elm.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2,colors,n)};

/* storage */
const DB={get(k,d){try{const v=localStorage.getItem('sw_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('sw_'+k,JSON.stringify(v))}catch(e){}}};
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y}
const cdf=(x,m,s)=>.5*(1+erf((x-m)/(s*Math.SQRT2)));
function percentile(g,v){const p=g.lower?1-cdf(v,g.mean,g.sd):cdf(v,g.mean,g.sd);return clamp(Math.round(p*100),1,99)}
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id))};
let tab='solo',players=2,target=5;

/* ═══════════════════ SOLO GAMES ═══════════════════ */
const SOLO=[
{id:'react',name:'Green Light',tag:'Reaction',ic:'bolt',desc:'Tap the instant the screen turns green. Yellow is a fake-out. 5 rounds.',unit:'ms',lower:true,mean:270,sd:50,color:'#1EAA5E',
 run(c){let trial=0,times=[],state='wait',t0=0;const f=el('div','fill red');const h=el('h2','', 'Wait for green');const p=el('p','', 'Round 1 of 5');f.append(h,p);c.root.append(f);
  const arm=()=>{state='wait';f.className='fill red';h.textContent='Wait for green';p.textContent=`Round ${trial+1} of 5`;
    c.timeout(()=>{if(state!=='wait')return;if(Math.random()<.35){state='fake';f.className='fill yellow';h.textContent='Not yet';p.textContent='Yellow is a trick';c.timeout(()=>{if(state==='fake'){arm()}},450)}else go()},rnd(1200,3800))};
  const go=()=>{state='go';f.className='fill green';h.textContent='TAP!';p.textContent='';t0=now()};
  f.addEventListener('pointerdown',()=>{if(state==='go'){const ms=Math.round(now()-t0);times.push(ms);sfx.good();trial++;state='show';f.className='fill dark';h.textContent=ms+' ms';pop(h);p.textContent=ms<200?'Lightning!':ms<280?'Nice.':'Get ready…';c.hud(`${trial}/5`);c.prog(trial/5);c.timeout(()=>trial<5?arm():c.end(Math.round(times.reduce((a,b)=>a+b)/times.length)),900)}
    else if(state==='wait'||state==='fake'){state='early';sfx.bad();shake(f);f.className='fill dark';h.textContent='Too early';p.textContent='Wait for solid green';c.timeout(arm,900)}});
  c.hud('0/5');arm()}},

{id:'chimp',name:'Chimp Grid',tag:'Memory',ic:'grid',desc:'Numbers appear. Tap 1, then the rest in order from memory. The grid grows every round.',unit:'level',mean:9,sd:3,color:'#8B5CF6',
 run(c){let n=4,lives=3;const g=el('div','grid');g.style.gridTemplateColumns='repeat(5,1fr)';g.style.setProperty('--c',5);g.style.setProperty('--r',8);c.root.append(g);
  const round=()=>{g.innerHTML='';c.hud(`Level ${n-3}`,lives);const cells=[];for(let i=0;i<40;i++){const d=el('div','cell');d.style.visibility='hidden';cells.push(d);g.append(d)}
   const idx=shuffle([...Array(40).keys()]).slice(0,n);let next=1,hidden=false;
   idx.forEach((ci,k)=>{const d=cells[ci];d.style.visibility='visible';d.textContent=k+1;d.dataset.v=k+1;pop(d);
    d.addEventListener('pointerdown',()=>{const v=+d.dataset.v;if(v!==next){sfx.bad();d.classList.add('miss');shake(g);lives--;c.hud(`Level ${n-3}`,lives);c.timeout(()=>lives?round():c.end(n-3),700);return}
     sfx.tap();d.style.visibility='hidden';next++;if(!hidden){hidden=true;idx.forEach(j=>cells[j].classList.add('blk'))}

const MIN_RUNS=25;                 // global data takes over from the estimate after this many runs
let session=null;
let GP=DB.get('gp',{});            // cached global percentiles: "game|value" -> {p, n}
function pctInfo(g,v){const r=GP[g.id+'|'+(+v)];if(r&&r.p!=null&&r.n>=MIN_RUNS)return {p:clamp(Math.round(r.p),1,99),n:r.n,live:true};return {p:percentile(g,v),n:r?r.n:0,live:false}}
const pctOf=(g,v)=>pctInfo(g,v).p;
async function rankMany(pairs){
  if(!window.SB||!session||!pairs.length)return false;
  const {data,error}=await SB.rpc('rank_scores',{items:pairs.map(([g,v])=>({game:g.id,value:v,lower:!!g.lower}))});
  if(error||!data){console.warn(error);return false}
  data.forEach(r=>{GP[r.game+'|'+(+r.value)]={p:r.pct==null?null:+r.pct,n:r.players}});DB.set('gp',GP);return true}
async function syncGlobal(force){
  if(!window.SB||!session)return;
  if(!force&&Date.now()-DB.get('gpT',0)<5*60e3)return;
  const pairs=[];SOLO.forEach(g=>{const s=gameStats(g);if(s){pairs.push([g,s.best]);if(s.avg!==s.best)pairs.push([g,s.avg])}});
  if(await rankMany(pairs)){DB.set('gpT',Date.now());if($('#home').classList.contains('on'))renderHome();if($('#brain').classList.contains('on'))renderBrain()}}

/* ═══════════════════ BRAIN RATING ═══════════════════ */
// Per game: half your best run, half your recent form (average of last 5 runs), both as percentiles.
// Per skill: average of the games in that skill you have played.
// Overall: average of the skills you have played, so every skill counts equally.
const CATS=['Reaction','Speed','Memory','Focus','Perception','Timing'];
const TINT={Reaction:'var(--peach)',Speed:'var(--butter)',Memory:'var(--lilac)',Focus:'var(--sky)',Perception:'var(--moss)',Timing:'#F3D6E4'};
const PTINT=['var(--peach)','var(--sky)','var(--butter)','var(--moss)','var(--lilac)','#F3D6E4'];
function gameStats(g){
  const best=bestOf(g);if(best==null)return null;
  const hist=DB.get('hist_'+g.id,[]);const last=hist.slice(-5);
  let avg=last.length?last.reduce((a,b)=>a+b)/last.length:best;avg=g.unit==='s'?+avg.toFixed(2):Math.round(avg);
  const pb=pctInfo(g,best),pa=pctInfo(g,avg);
  return {best,avg,pb:pb.p,pa:pa.p,live:pb.live,skill:Math.round(.5*pb.p+.5*pa.p),runs:hist.length}}
function brain(){
  const cats=CATS.map(name=>{const games=SOLO.filter(g=>g.tag===name).map(g=>({g,s:gameStats(g)}));const pl=games.filter(x=>x.s);
    return {name,games,played:pl.length,score:pl.length?Math.round(pl.reduce((a,x)=>a+x.s.skill,0)/pl.length):null}});
  const sc=cats.filter(c=>c.score!=null);
  const overall=sc.length?Math.round(sc.reduce((a,c)=>a+c.score,0)/sc.length):null;
  const gamesPlayed=cats.reduce((a,c)=>a+c.played,0);
  const live=cats.some(c=>c.games.some(x=>x.s&&x.s.live));
  return {cats,overall,gamesPlayed,skills:sc.length,provisional:sc.length<4,live}}
const tier=s=>s>=90?'Elite':s>=75?'Sharp':s>=60?'Above average':s>=40?'Average':'Warming up';
function logRating(v){if(v==null)return;const h=DB.get('rhist',[]);const d=new Date().toISOString().slice(0,10);if(h.length&&h[h.length-1].d===d)h[h.length-1].s=v;else h.push({d,s:v});DB.set('rhist',h.slice(-60))}

  // explanation
  const how=el('div','bcard how');how.innerHTML=`<div class="bh"><span>How it's calculated</span></div>Each game scores half on your <b>best run</b> and half on your <b>recent form</b> (average of your last 5 runs), both as percentiles. Games are averaged into 6 skills, and your rating is the average of the skills you've played, so no single skill dominates. It's <b>provisional</b> until you've played 4 skills. ${B.live?'Percentiles come from every run members have played and get more accurate as more people play.':'Percentiles are estimates until enough members have played each game ('+MIN_RUNS+' runs).'}`;
  body.append(how);
}

  submitScore(g,v);lastRun={g,v};$('#rchal').hidden=false;
  if(daily&&daily.i>=2){const s=DB.get('streak',0);const last=DB.get('lastDaily','');const today=dayKey(0);if(last!==today){DB.set('streak',last===dayKey(-1)?s+1:1);DB.set('lastDaily',today);const days=DB.get('days',[]);if(!days.includes(today))days.push(today);DB.set('days',days.slice(-60))}}
  if(chal&&chal.id===g.id){const beat=g.lower?v<chal.v:v>chal.v;const n=el('div','chal '+(beat?'ok':'no'));n.textContent=beat?`You beat the challenge (${fmt(g,chal.v)})`:`Not this time · ${fmt(g,chal.v)} to beat`;$('#rrib').append(n)}}
function dayKey(off){const d=new Date();d.setDate(d.getDate()+off);return d.toDateString()}
function streakNow(){const last=DB.get('lastDaily','');return last===dayKey(0)||last===dayKey(-1)?DB.get('streak',0):0}
function setPct(pi){$('#rpct').innerHTML=pi.live?`Better than <b>${pi.p}%</b> of ${pi.n.toLocaleString()} runs`:`Better than <b>${pi.p}%</b> of players<span class="est">estimate</span>`}
async function submitScore(g,v){
  if(!window.SB||!session)return;
  const {error}=await SB.from('scores').insert({game:g.id,value:v});if(error){console.warn(error);return}
  if(await rankMany([[g,v],[g,bestOf(g)]])&&curGame===g&&$('#result').classList.contains('on')){const pi=pctInfo(g,v);if(pi.live){setPct(pi);drawCurve(g,pi.p)}}}
function probit(q){let lo=-6,hi=6;for(let i=0;i<50;i++){const m=(lo+hi)/2;cdf(m,0,1)<q?lo=m:hi=m}return (lo+hi)/2}
function drawCurve(g,p){const svg=$('#curve');svg.innerHTML='';const W=320,H=110,B=H-22;const xs=i=>g.mean+(i/100-.5)*6*g.sd;const pts=[];for(let i=0;i<=100;i++){const x=xs(i);const y=Math.exp(-.5*((x-g.mean)/g.sd)**2);pts.push([i/100*W,B-y*(B-12)])}
  const u=probit(g.lower?1-p/100:p/100);const px=clamp((u/6+.5)*W,4,W-4);const ns='http://www.w3.org/2000/svg';const mk=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e};
  const d=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join('');svg.append(mk('path',{d:d+`L${W},${B}L0,${B}Z`,fill:'#E2E5DC'}));
  const cut=pts.filter(p=>g.lower?p[0]>=px:p[0]<=px);if(cut.length>1){const d2=cut.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join('');svg.append(mk('path',{d:d2+`L${cut[cut.length-1][0]},${B}L${cut[0][0]},${B}Z`,fill:'#FF5A1F',opacity:'.28'}))}
  svg.append(mk('path',{d,fill:'none',stroke:'#c8ccc0','stroke-width':1.5}));svg.append(mk('line',{x1:px,x2:px,y1:6,y2:B,stroke:'#FF5A1F','stroke-width':3,'stroke-linecap':'round'}));svg.append(mk('circle',{cx:px,cy:6,r:5,fill:'#FF5A1F'}));
  const t=mk('text',{x:px,y:H-4,'text-anchor':'middle','font-size':'11','font-weight':'700',fill:'#5B6070'});t.textContent='you';svg.append(t);
  const l=mk('text',{x:4,y:H-4,'font-size':'10',fill:'#9AA0B0'});l.textContent=g.lower?'faster':'lower';svg.append(l);const r=mk('text',{x:W-4,y:H-4,'font-size':'10',fill:'#9AA0B0','text-anchor':'end'});r.textContent=g.lower?'slower':'higher';svg.append(r)}
$('#rhome').addEventListener('click',()=>{daily=null;rebindAgain();show('home');renderHome()});
let lastRun=null;$('#rchal').addEventListener('click',async()=>{if(!lastRun)return;const b=$('#rchal');const link=challengeLink(lastRun.g,lastRun.v);const msg=`Beat my ${lastRun.g.name} score on Snapwit: ${fmt(lastRun.g,lastRun.v)}`;if(await copyText(link)){b.textContent='Link copied';sfx.good();if(window.SITE&&SITE.toast)SITE.toast('Link copied. Send it to a friend.')}else if(navigator.share){try{await navigator.share({title:'Snapwit',text:msg,url:link})}catch(e){}}else{b.textContent=link}setTimeout(()=>{b.textContent='Challenge a friend'},2500)});
function rebindAgain(){const a=$('#ragain');const c=a.cloneNode(true);a.replaceWith(c);c.addEventListener('click',()=>{if(daily){daily.i++;if(daily.i<3)openSolo(daily.games[daily.i]);else{daily=null;show('home');renderHome()}}else openSolo(curGame)})}
rebindAgain();
function startDaily(){const seed=new Date().toDateString().split('').reduce((a,c)=>a+c.charCodeAt(0),0);const gs=[];let s=seed;while(gs.length<3){s=(s*9301+49297)%233280;const g=SOLO[s%SOLO.length];if(!gs.includes(g))gs.push(g)}daily={games:gs,i:0};openSolo(gs[0])}

/* ═══════════════════ PARTY RUNNER ═══════════════════ */
let pstate=null;
function openParty(g){show('party');pstate={g,scores:Array(players).fill(0),round:0};buildZones();nextRound()}
function buildZones(){const zc=$('#zones');zc.innerHTML='';zc.className='zones p'+players;pstate.zones=[];
  for(let i=0;i<players;i++){const z=el('div','zone');z.style.setProperty('--zc',PCOL[i]);const flip=(players===2&&i===0)||(players===3&&i===0)||(players===4&&i<2);if(flip)z.classList.add('flip');
   const zin=el('div','zin');const sc=el('div','score num',pstate.scores[i]);const lbl=el('div','lbl',PNAME[i]);const h=el('h3');const p=el('p');const body=el('div');body.style.cssText='display:contents';zin.append(sc,lbl,h,body,p);z.append(zin);zc.append(z);
   const zo={i,el:z,h,p,bodyEl:body,isOut:false,_tap:null,_down:null,_up:null,_cancel:null,onDown(fn){zo._down=fn},onUp(fn){zo._up=fn},onCancel(fn){zo._cancel=fn},set(a,b){h.textContent=a;h.style.color='';h.style.fontSize='';h.style.textShadow='';p.textContent=b??'';body.innerHTML=''},body(n){body.innerHTML='';body.append(n)},onTap(fn){zo._tap=fn},
     buttons(list,fn){body.innerHTML='';const w=el('div','zbtns c'+(list.length===3?3:list.length>=4?4:2));list.forEach(o=>{const b=el('button','zbtn'+(list.length===1?' big':''),o.label);if(o.bg)b.style.background=o.bg;if(!o.label)b.style.minHeight='60px';b.addEventListener('pointerdown',e=>{e.stopPropagation();if(zo.isOut||!pstate.live)return;fn(o.v)});w.append(b)});body.append(w)}};
   z.addEventListener('pointerdown',e=>{if(zo._down)zo._down(e);if(zo.isOut||!pstate.live||!zo._tap)return;zo._tap(e)});z.addEventListener('pointerup',e=>{if(zo._up)zo._up(e)});z.addEventListener('pointercancel',e=>{if(zo._cancel)zo._cancel(e)});pstate.zones.push(zo)}}
function banner(t,ms=900,cls=''){const b=el('div','pbar '+cls,t);$('#party').append(b);setTimeout(()=>b.remove(),ms);return b}
function nextRound(){clearTimers();const st=pstate;st.round++;st.live=false;const g=st.g||pick(PARTY);st.cur=g;
  st.zones.forEach(z=>{z.isOut=false;z.el.classList.remove('out','win');z.el.style.background='';z._tap=null;z._down=null;z._up=null;z._cancel=null;z.set('','');z.el.querySelector('.score').textContent=st.scores[z.i];z.el.querySelectorAll('.fx').forEach(x=>x.remove())});
  const ready=st.zones.map(()=>false);let stat=null;
  const upd=()=>{const n=ready.filter(Boolean).length;if(stat)stat.remove();stat=el('div','pbar',`Round ${st.round} · ${n}/${st.zones.length} ready`);stat.style.fontSize='16px';stat.style.padding='10px 18px';$('#party').append(stat)};
  st.zones.forEach(z=>{z.set('','');const w=el('div','zready');const gn=el('div','gn');gn.innerHTML=`<span>${icon(g.ic)}</span>${g.name}`;const r=el('div','rules',g.desc);const b=el('button','rbtn',"I'm ready");b.addEventListener('pointerdown',e=>{e.stopPropagation();if(ready[z.i])return;ready[z.i]=true;sfx.tap();b.textContent='Ready ✓';b.classList.add('on');upd();if(ready.every(Boolean))go()});w.append(gn,r,b);z.body(w)});upd();
  const go=()=>{if(stat)stat.remove();banner('GO!',700,'go');sfx.go();st.zones.forEach(z=>z.set('',''));
   const t=setTimeout(()=>{st.live=true;const c={zones:st.zones,timeout(fn,ms){const t=setTimeout(fn,ms);timers.push(t);return t},wait(ms){return new Promise(r=>c.timeout(r,ms))},alive:()=>st.zones.filter(z=>!z.isOut).map(z=>z.i),
    out(i,msg){const z=st.zones[i];if(z.isOut||!st.live)return;z.isOut=true;z.el.classList.add('out');const fx=el('div','fx');fx.innerHTML=`<div>${msg||'Out'}</div><small>Out this round</small>`;z.el.append(fx);shake(z.el);sfx.bad();if(!c.alive().length)c.nobody()},
    win(i){if(!st.live)return;st.live=false;clearTimers();const z=st.zones[i];st.scores[i]++;z.el.classList.add('win');sfx.win();burstAt(z.el,['#fff',PCOL[i],'#FFC531'],70);st.zones.forEach(o=>{if(o.i!==i&&!o.isOut)o.el.classList.add('out')});const fx=el('div','fx');fx.innerHTML=`<div>${PNAME[i]} wins</div><small>+1 point</small>`;z.el.append(fx);z.el.querySelector('.score').textContent=st.scores[i];setTimeout(after,1300)},
    winAll(ids,loser){if(!st.live)return;st.live=false;clearTimers();ids.forEach(i=>{st.scores[i]++;st.zones[i].el.classList.add('win');st.zones[i].el.querySelector('.score').textContent=st.scores[i];burstAt(st.zones[i].el,['#fff',PCOL[i]],30)});st.zones[loser].el.classList.add('out');sfx.win();setTimeout(after,1300)},
    nobody(){if(!st.live)return;st.live=false;clearTimers();banner('Nobody scores',1200);setTimeout(after,1300)}};
    try{g.round(c)}catch(e){console.error(e);c.nobody()}},700);timers.push(t)}}
function after(){const st=pstate;const m=Math.max(...st.scores);if(m>=target){showPartyResult(st.scores.indexOf(m));return}
  const sb=el('div','sb');sb.innerHTML=`<h3>First to ${target}</h3>`;[...st.zones].sort((a,b)=>st.scores[b.i]-st.scores[a.i]).forEach(z=>{const r=el('div','r');r.style.setProperty('--zc',PCOL[z.i]);r.innerHTML=`<i></i>${PNAME[z.i]}<div class="pb"><b></b></div><em>${st.scores[z.i]}</em>`;sb.append(r);requestAnimationFrame(()=>requestAnimationFrame(()=>r.querySelector('b').style.width=(st.scores[z.i]/target*100)+'%'))});
  $('#party').append(sb);setTimeout(()=>{sb.remove();nextRound()},1700)}
function showPartyResult(w){const st=pstate;show('result');$('#rname').textContent=(st.g?st.g.name:'Party mix')+' · match over';const sc=$('#rscore');sc.innerHTML=`<span style="color:${PCOL[w]}">${PNAME[w]}</span>`;sc.style.fontSize='64px';$('#rpct').textContent='wins the match';$('#rrib').innerHTML='<span class="ribbon">🏆 Champion</span>';$('#curve').innerHTML='';$('#rchal').hidden=true;
  const ch=$('#rchips');ch.innerHTML='';const r=el('div','podium');[...st.zones].sort((a,b)=>st.scores[b.i]-st.scores[a.i]).forEach(z=>{const d=el('div');d.style.setProperty('--zc',PCOL[z.i]);d.innerHTML=`${PNAME[z.i]}<div class="pb"><i style="width:${st.scores[z.i]/target*100}%"></i></div><b>${st.scores[z.i]}</b>`;r.append(d)});ch.append(r);
  const again=$('#ragain');again.textContent='Rematch';const clone=again.cloneNode(true);again.replaceWith(clone);clone.addEventListener('click',()=>{rebindAgain();openParty(st.g)});
  sfx.win();setTimeout(()=>confetti(innerWidth/2,innerHeight*.25,PCOL.concat('#fff'),160,1.4),200)}
$('#pquit').addEventListener('click',()=>{clearTimers();document.querySelectorAll('.sb,.pbar').forEach(x=>x.remove());show('home');renderHome()});

async function boot(){
  if(!window.SB){renderHome();openChallenge();return}
  const {data}=await SB.auth.getSession();session=data.session;
  if(!session){show('gate');return}
  $('#acct').innerHTML=' · <a href="/join/">Account</a>';
  renderHome();syncGlobal();openChallenge();
}
function openChallenge(){if(!chal)return;const g=SOLO.find(x=>x.id===chal.id);if(g)openSolo(g)}
if(window.SB)SB.auth.onAuthStateChange((evt,s)=>{session=s;if(evt==='SIGNED_OUT')show('gate')});
boot();
</script>
