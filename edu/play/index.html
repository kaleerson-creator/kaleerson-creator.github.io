<style>
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);align-items:start}

.gpick label{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--paper);cursor:pointer;font-weight:600}
.gpick input{width:auto}

html[data-theme=dark] .note.ok{color:#8fd07f}html[data-theme=dark] .note.no{color:#F0695F}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,330px)}

.ttt button.X{color:#2451C9}.ttt button.O{color:#B8322F}.ttt button.win{background:var(--butter)}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:min(100%,460px);background:#2451C9;padding:10px;border-radius:20px}

.sea .sunk{background:#7A1C1C}.sea .sunk::after{content:'✕'}

.shipq{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}

.hands b{font-size:clamp(56px,14vw,88px);line-height:1}
.hands .vs{font:800 22px/1 var(--display);color:var(--ink3)}
.cnt{font:800 96px/1 var(--display);animation:pop .9s var(--ease) infinite;min-height:96px}

.pips{display:inline-flex;gap:4px}.pips i{width:10px;height:10px;border-radius:50%;background:var(--line)}.pips i.on{background:var(--ink)}
/* reactions + chat */
.stagewrap{position:relative}
.flyer{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:inherit}

<main class="wrap">
<div class="ghead"><div><h1>Play online</h1><p>Make a room, share the code, and play friends on any device. No sign-in needed.</p></div></div>
<div id="lobby">
  <div class="box" style="margin-bottom:var(--gap)"><label class="small" for="nick">Your name</label><input id="nick" maxlength="20" placeholder="Name friends will see" style="max-width:320px"></div>
  <div class="lobby">
    <div class="box"><h2>Make a room</h2>
      <div class="gpick">
        <label><input type="radio" name="g" value="ttt" checked><span>Tic-tac-toe<small>2 players</small></span></label>
        <label><input type="radio" name="g" value="c4"><span>Connect Four<small>2 players</small></span></label>
        <label><input type="radio" name="g" value="ship"><span>Battleship<small>2 players · sink all five ships</small></span></label>
        <label><input type="radio" name="g" value="rps"><span>Rock, Paper, Scissors<small>2 players · first to 3</small></span></label>
        <label><input type="radio" name="g" value="trivia"><span>Trivia race<small>2–20 players · 10 questions</small></span></label>
        <label><input type="radio" name="g" value="rush"><span>Letter Rush race<small>2–20 players · same 7 letters · 90 seconds</small></span></label>
      </div>
      <button class="btn" id="create">Create room</button></div>
    <div class="box"><h2>Join a room</h2><p class="small">Type the 4-letter code your friend shared.</p>
      <input id="joincode" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off" style="font:800 28px/1 var(--display);letter-spacing:.15em;text-transform:uppercase;max-width:220px">
      <button class="btn" id="join">Join</button><div id="lmsg"></div></div>
  </div>
</div>
<div id="room" hidden>
  <div class="box" style="margin-bottom:var(--gap)"><div class="rhead"><div><span class="lbl" id="gname"></span><div class="code" id="rcode"></div></div>
    <div class="row"><div class="qrbox"><canvas id="qr" width="148" height="148" role="img" aria-label="QR code for the invite link"></canvas><span>Scan to join</span></div><button class="btn sm ghost" id="copy">Copy invite link</button><button class="btn sm ghost" id="leave">Leave</button></div></div>
    <div class="players" id="players"></div></div>
  <div class="stagewrap"><div class="stage" id="stage"></div><div class="flyer" id="flyer" aria-hidden="true"></div></div>
  <div class="box" style="margin-top:var(--gap)">
    <div class="saybar" id="saybar"><button class="re" data-r="👏" aria-label="Clap">👏</button><button class="re" data-r="😂" aria-label="Laugh">😂</button><button class="re" data-r="😱" aria-label="Gasp">😱</button><button class="re" data-r="🔥" aria-label="Fire">🔥</button>
      <input id="saymsg" maxlength="80" placeholder="Say something" autocomplete="off" aria-label="Message"><button class="btn sm" id="saysend">Send</button></div>
    <div class="saylog" id="saylog" aria-live="polite"></div>
  </div>
</div>
</main>

<script>
const ID=(G.local.get('play:id',null)||(()=>{const v=Math.random().toString(36).slice(2,10);G.local.set('play:id',v);return v})());
const NAMES={ttt:'Tic-tac-toe',c4:'Connect Four',ship:'Battleship',rps:'Rock, Paper, Scissors',trivia:'Trivia race',rush:'Letter Rush race'};
const SEATS={ttt:['X','O'],c4:['R','Y'],ship:['A','B'],rps:['A','B']};
const SEATCOL={ttt:{X:'#2451C9',O:'#B8322F'},c4:{R:'#D12C2C',Y:'#F3C93B'},ship:{A:'#2451C9',B:'#D12C2C'},rps:{A:'#2451C9',B:'#D12C2C'}};
const RUSH_MS=90000,PTS={3:30,4:60,5:100,6:150,7:300};
let rushStart=0,rushT=null,myRound=-1,myFound=[],guess=[],rmsg=null;
const fitsRack=(w,rack)=>{const c={};rack.forEach(x=>c[x]=(c[x]||0)+1);for(const ch of w){if(!c[ch])return false;c[ch]--}return true};
let lettersP=null;const needLetters=()=>window.LETTERS?Promise.resolve():(lettersP=lettersP||new Promise(ok=>{const sc=document.createElement('script');sc.src='/edu/assets/letters.js?v=3';sc.onload=ok;document.head.append(sc)}));
const nick=document.getElementById('nick');nick.value=G.local.get('play:nick','');
G.me.ready.then(m=>{if(!nick.value&&m.name)nick.value=m.name});
let myPick=null,ch=null,code=null,people={},isHost=false,hostId=null,S=null,gameType=null,tickT=null,recvAt=0;
const $=id=>document.getElementById(id);
const E=G.esc;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
const name=id=>people[id]?.name||'Player';
const seatOf=id=>S&&S.seats?Object.keys(S.seats).find(k=>S.seats[k]===id)||null:null;
const other=k=>k==='A'?'B':'A';
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ';return [...Array(4)].map(()=>A[Math.floor(Math.random()*A.length)]).join('')}
const inviteURL=()=>location.origin+'/edu/play/?join='+code;

/* ── QR encoder (same as /qr/): byte mode, error correction M, versions 1–10 (ISO/IEC 18004) ── */
const QR=(()=>{
  // GF(256) with 0x11D
  const EXP=new Uint8Array(512),LOG=new Uint8Array(256);
  for(let i=0,x=1;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&256)x^=0x11D}
  for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
  const mul=(a,b)=>a&&b?EXP[LOG[a]+LOG[b]]:0;
  function genPoly(n){let g=[1];for(let i=0;i<n;i++){const ng=new Array(g.length+1).fill(0);for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i])}g=ng}return g}
  function rs(data,n){const g=genPoly(n),res=new Array(n).fill(0);for(const b of data){const f=b^res[0];res.shift();res.push(0);if(f)for(let j=0;j<n;j++)res[j]^=mul(g[j+1],f)}return res}
  // level M: [ec codewords per block, [[blocks, data codewords per block], ...]]
  const EC=[null,[10,[[1,16]]],[16,[[1,28]]],[26,[[1,44]]],[18,[[2,32]]],[24,[[2,43]]],[16,[[4,27]]],[18,[[4,31]]],[22,[[2,38],[2,39]]],[22,[[3,36],[2,37]]],[26,[[4,43],[1,44]]]];
  const ALIGN=[null,[],[6,18],[6,22],[6,26],[6,30],[6,34],[6,22,38],[6,24,42],[6,26,46],[6,28,50]];
  const dataCW=v=>EC[v][1].reduce((a,[n,c])=>a+n*c,0);
  const capacity=v=>dataCW(v)-(v<10?2:3);   // bytes: mode(4)+count(8|16) bits
  const utf8=s=>{const out=[];for(const ch of s){let c=ch.codePointAt(0);if(c<0x80)out.push(c);else if(c<0x800)out.push(0xC0|c>>6,0x80|c&63);else if(c<0x10000)out.push(0xE0|c>>12,0x80|c>>6&63,0x80|c&63);else out.push(0xF0|c>>18,0x80|c>>12&63,0x80|c>>6&63,0x80|c&63)}return out};
  // BCH for format (15 bits) and version (18 bits)
  const bchDigit=d=>{let n=0;while(d){n++;d>>>=1}return n};
  function bch(data,shift,g){let d=data<<shift;const gd=bchDigit(g);while(bchDigit(d)-gd>=0)d^=g<<(bchDigit(d)-gd);return(data<<shift)|d}
  const formatBits=mask=>bch((0<<3)|mask,10,0x537)^0x5412;   // EC level M = 00
  const versionBits=v=>bch(v,12,0x1F25);
  const MASK=[(r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,(r,c)=>((r>>1)+Math.floor(c/3))%2===0,(r,c)=>(r*c)%2+(r*c)%3===0,(r,c)=>((r*c)%2+(r*c)%3)%2===0,(r,c)=>((r+c)%2+(r*c)%3)%2===0];

  function encode(text){
    const bytes=utf8(text);
    let v=1;while(v<=10&&capacity(v)<bytes.length)v++;
    if(v>10)return{error:'Too long: '+bytes.length+' bytes, max '+capacity(10)+'.'};
    // bit stream
    const bits=[];const push=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>i)&1)};
    push(4,4);push(bytes.length,v<10?8:16);bytes.forEach(b=>push(b,8));
    const total=dataCW(v)*8;
    push(0,Math.min(4,total-bits.length));while(bits.length%8)bits.push(0);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=(b<<1)|bits[i+j];data.push(b)}
    for(let p=0;data.length<dataCW(v);p++)data.push(p%2?0x11:0xEC);
    // blocks + interleave
    const [ecn,groups]=EC[v];const blocks=[];let off=0;
    for(const [n,c] of groups)for(let i=0;i<n;i++){const d=data.slice(off,off+c);off+=c;blocks.push({d,e:rs(d,ecn)})}
    const out=[];const maxD=Math.max(...blocks.map(b=>b.d.length));
    for(let i=0;i<maxD;i++)for(const b of blocks)if(i<b.d.length)out.push(b.d[i]);
    for(let i=0;i<ecn;i++)for(const b of blocks)out.push(b.e[i]);
    // matrix: fn[r][c] true for function modules; m[r][c] 0/1
    const n=v*4+17;const m=Array.from({length:n},()=>new Uint8Array(n)),fn=Array.from({length:n},()=>new Uint8Array(n));
    const set=(r,c,val)=>{m[r][c]=val;fn[r][c]=1};
    const finder=(r0,c0)=>{for(let r=-1;r<=7;r++)for(let c=-1;c<=7;c++){const rr=r0+r,cc=c0+c;if(rr<0||cc<0||rr>=n||cc>=n)continue;const dark=(r>=0&&r<=6&&(c===0||c===6))||(c>=0&&c<=6&&(r===0||r===6))||(r>=2&&r<=4&&c>=2&&c<=4);set(rr,cc,dark?1:0)}};
    finder(0,0);finder(0,n-7);finder(n-7,0);
    for(let i=8;i<n-8;i++){set(6,i,i%2===0?1:0);set(i,6,i%2===0?1:0)}
    const al=ALIGN[v];
    for(const r of al)for(const c of al){if((r<=8&&c<=8)||(r<=8&&c>=n-9)||(r>=n-9&&c<=8))continue;for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++)set(r+dr,c+dc,Math.max(Math.abs(dr),Math.abs(dc))!==1?1:0)}
    // reserve format areas (+ dark module) and version areas
    for(let i=0;i<9;i++){if(i!==6){set(8,i,0);set(i,8,0)}}
    for(let i=0;i<8;i++){set(8,n-1-i,0);set(n-1-i,8,0)}
    set(n-8,8,1);
    if(v>=7){const vb=versionBits(v);for(let i=0;i<18;i++){const b=(vb>>i)&1;set(Math.floor(i/3),n-11+(i%3),b);set(n-11+(i%3),Math.floor(i/3),b)}}
    // data placement order (zigzag, skipping column 6)
    const order=[];let inc=-1,row=n-1;

// Draws the invite link as a QR on the small canvas in the room header (white card so cameras read it in dark mode too).

/* ── connection ── */
async function enter(c,type){

  ch=SB.channel('kgroom:'+code,{config:{broadcast:{self:true},presence:{key:ID}}});
  ch.on('presence',{event:'sync'},()=>{people={};const st=ch.presenceState();for(const k in st){const p=st[k][0];people[k]=p}
    const ids=Object.keys(people).sort((a,b)=>people[a].t-people[b].t||a.localeCompare(b));
    const wasHost=isHost;isHost=ids[0]===ID;
    const hostChanged=hostId&&ids[0]&&ids[0]!==hostId;hostId=ids[0]||hostId;
    if(isHost&&!S&&gameType)S=init(gameType);

  ch.on('broadcast',{event:'state'},({payload})=>{S=payload;recvAt=Date.now();gameType=S.game;draw()});
  ch.on('broadcast',{event:'act'},({payload})=>{if(isHost&&S)act(payload)});
  ch.on('broadcast',{event:'say'},({payload})=>onSay(payload));
  ch.subscribe(async st=>{if(st==='SUBSCRIBED'){await ch.track({name:n.slice(0,20),t:Date.now()});show();
      if(!gameType){const mine=ch;setTimeout(()=>{if(ch===mine&&!S&&!gameType){leave();$('lmsg').innerHTML='<div class="msg">No room with that code. Check the letters and try again.</div>'}},4000)}}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){$('lmsg').innerHTML='<div class="msg">Couldn\'t connect. Check your internet and try again.</div>'}});

}
function show(){$('lobby').hidden=true;$('room').hidden=false;$('rcode').textContent=code;$('gname').textContent=gameType?NAMES[gameType]:'Joining…';drawQR($('qr'),inviteURL());draw()}
function push(){if(!ch||!isHost)return;if(S.game==='trivia'&&S.phase==='question')S.left=Math.max(0,15000-(Date.now()-tqStart));if(S.game==='rush'&&S.phase==='play')S.left=Math.max(0,RUSH_MS-(Date.now()-rushStart));ch.send({type:'broadcast',event:'state',payload:S})}
function send(a){if(!ch)return;a.from=ID;if(isHost)act(a);else ch.send({type:'broadcast',event:'act',payload:a})}
function seatColor(id){const col=SEATCOL[gameType];if(!col||!S||!S.seats)return 'var(--ink3)';const k=Object.keys(col).find(k=>S.seats[k]===id);return k?col[k]:'var(--ink3)'}
function drawPeople(){const ids=Object.keys(people).sort((a,b)=>people[a].t-people[b].t);
  $('players').innerHTML=ids.map((id,i)=>`<span class="pl ${id===ID?'me':''}"><i style="background:${seatColor(id)}"></i>${E(people[id].name)}${i===0?' · host':''}${id===ID?' (you)':''}</span>`).join('')}

/* ── host logic ── */
function init(type){
  if(type==='ttt')return {game:'ttt',board:Array(9).fill(''),turn:'X',seats:{},win:null,line:[],starter:'X',round:1};
  if(type==='c4')return {game:'c4',board:Array(42).fill(''),turn:'R',seats:{},win:null,line:[],starter:'R',round:1};
  if(type==='ship')return {game:'ship',seats:{},phase:'place',ready:{},shots:{A:{},B:{}},sunk:{A:[],B:[]},turn:'A',starter:'A',win:null,last:null,round:1};
  if(type==='rps')return {game:'rps',seats:{},phase:'pick',picked:{},reveal:null,score:{A:0,B:0},round:1,win:null,match:1};
  if(type==='rush')return {game:'rush',phase:'lobby',rack:[],seed:'',left:0,scores:{},counts:{},found:{},round:0};
  return {game:'trivia',phase:'lobby',qi:0,total:10,scores:{},answers:{},q:null,left:0,reveal:null,order:[]};
}
function seat(){if(!S.seats)return;const ids=Object.keys(people).sort((a,b)=>people[a].t-people[b].t);const keys=SEATS[S.game];let left=false;
  keys.forEach(k=>{if(S.seats[k]&&!people[S.seats[k]]){delete S.seats[k];left=true}});
  keys.forEach(k=>{if(!S.seats[k]){const free=ids.find(id=>!Object.values(S.seats).includes(id));if(free)S.seats[k]=free}});
  // A Battleship or RPS game can't continue without the player who left: back to the start.
  if(left&&S.game==='ship')shipReset();if(left&&S.game==='rps')rpsReset()}
const LINES3=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function c4win(b){for(let r=0;r<6;r++)for(let c=0;c<7;c++){const v=b[r*7+c];if(!v)continue;for(const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){const cells=[0,1,2,3].map(k=>[r+dr*k,c+dc*k]);if(cells.every(([R,C])=>R>=0&&R<6&&C>=0&&C<7&&b[R*7+C]===v))return {v,line:cells.map(([R,C])=>R*7+C)}}}return null}
let tq=null;
function act(a){
  if(S.game==='ttt'||S.game==='c4'){
    if(a.type==='again'&&S.win){const keys=SEATS[S.game];S.starter=S.starter===keys[0]?keys[1]:keys[0];Object.assign(S,{board:Array(S.game==='ttt'?9:42).fill(''),turn:S.starter,win:null,line:[],round:S.round+1});return push()}
    if(a.type!=='move'||S.win||S.seats[S.turn]!==a.from)return;
    if(S.game==='ttt'){const i=a.i|0;if(i<0||i>8||S.board[i])return;S.board[i]=S.turn;const L=LINES3.find(l=>l.every(k=>S.board[k]===S.turn));if(L){S.win=S.turn;S.line=L}else if(S.board.every(Boolean))S.win='draw';else S.turn=S.turn==='X'?'O':'X'}
    else{const c=a.c|0;if(c<0||c>6)return;let r=5;while(r>=0&&S.board[r*7+c])r--;if(r<0)return;S.board[r*7+c]=S.turn;const w=c4win(S.board);if(w){S.win=w.v;S.line=w.line}else if(S.board.every(Boolean))S.win='draw';else S.turn=S.turn==='R'?'Y':'R'}
    return push();
  }
  if(S.game==='ship')return actShip(a);
  if(S.game==='rps')return actRps(a);
  if(S.game==='rush'){
    if(a.type==='start'&&a.from===ID&&S.phase!=='play'){needLetters().then(()=>{const seed=LETTERS.seeds[Math.floor(Math.random()*LETTERS.seeds.length)];
      Object.assign(S,{phase:'play',seed:'',rack:shuffle(seed.split('')),scores:{},counts:{},found:{},round:S.round+1});rushSeed=seed;rushStart=Date.now();push();
      clearTimeout(rushT);rushT=setTimeout(endRush,RUSH_MS)});return}
    if(a.type==='found'&&S.phase==='play'&&window.LETTERS){const w=String(a.w||'').toLowerCase();S.found=S.found||{};const f=S.found[a.from]=S.found[a.from]||[];
      if(w.length<3||w.length>7||f.includes(w)||!LETTERS.words.has(w)||!fitsRack(w,S.rack))return;
      f.push(w);S.scores[a.from]=(S.scores[a.from]||0)+PTS[w.length];S.counts[a.from]=(S.counts[a.from]||0)+1;push()}
    return;
  }
  // trivia
  if(a.type==='start'&&a.from===ID&&(S.phase==='lobby'||S.phase==='end')){S.order=shuffle([...TRIVIA.keys()]).slice(0,S.total);S.qi=0;S.scores={};nextQ();return}
  if(a.type==='answer'&&S.phase==='question'&&!S.answers[a.from]){const q=TRIVIA[S.order[S.qi]];const ms=Date.now()-tqStart;
    S.answers[a.from]={c:a.c,ok:a.c===q[2],ms};if(S.answers[a.from].ok)S.scores[a.from]=(S.scores[a.from]||0)+100+Math.round(100*Math.max(0,15000-ms)/15000);
    if(Object.keys(people).every(id=>S.answers[id]))reveal();else push()}
}
let tqStart=0,rushSeed='';
function endRush(){clearTimeout(rushT);if(S.phase!=='play')return;S.phase='end';S.left=0;S.seed=rushSeed||S.seed||'';push()}
// A new host picks up a game where the old host left off.
function resumeHost(){
  if(S.game==='ship'){fleets={};return}   // players re-send their placements (resendFleet) and the new host checks them against the shots so far
  if(S.game==='rps'){picks={};clearTimeout(rpsT);if(S.phase==='reveal'&&!S.win)rpsT=setTimeout(rpsNext,RPS_MS);else if(S.phase==='pick')S.picked={};return}
  if(S.game==='rush'){if(S.phase==='play'){needLetters();rushStart=Date.now()-(RUSH_MS-Math.max(0,S.left-(Date.now()-recvAt)));clearTimeout(rushT);rushT=setTimeout(endRush,Math.max(500,RUSH_MS-(Date.now()-rushStart)))}return}
  if(S.game!=='trivia')return;clearTimeout(tq);
  if(S.phase==='question'){tqStart=Date.now()-(15000-Math.max(0,S.left-(Date.now()-recvAt)));tq=setTimeout(reveal,Math.max(1000,15000-(Date.now()-tqStart)))}
  else if(S.phase==='reveal')tq=setTimeout(()=>{S.qi++;if(S.qi>=S.total){S.phase='end';push()}else nextQ()},2000)}
function nextQ(){const q=TRIVIA[S.order[S.qi]];S.phase='question';S.answers={};S.reveal=null;S.q={cat:q[0],text:q[1],opts:shuffle(q.slice(2))};S.left=15000;tqStart=Date.now();push();
  clearTimeout(tq);tq=setTimeout(reveal,15000)}
function reveal(){clearTimeout(tq);if(S.phase!=='question')return;S.phase='reveal';S.reveal=TRIVIA[S.order[S.qi]][2];S.left=0;push();
  tq=setTimeout(()=>{S.qi++;if(S.qi>=S.total){S.phase='end';push()}else nextQ()},3500)}

/* ── Battleship (host side). Ship positions never go into S: the host keeps them in `fleets`. ── */
const FLEET=[['Carrier',5],['Battleship',4],['Cruiser',3],['Submarine',3],['Destroyer',2]];
let fleets={};
// Returns [{n,len,c:[cells],h:0}] or null. Each ship must be the right length, in one row or column, inside the grid, no overlaps.
function validFleet(ships){
  if(!Array.isArray(ships)||ships.length!==5)return null;const used=new Set(),out=[];
  for(let k=0;k<5;k++){const c=ships[k],len=FLEET[k][1];if(!Array.isArray(c)||c.length!==len)return null;
    const cells=c.map(x=>x|0);if(cells.some(x=>x<0||x>99||used.has(x)))return null;cells.sort((a,b)=>a-b);
    const row=cells.every((x,i)=>Math.floor(x/10)===Math.floor(cells[0]/10)&&x===cells[0]+i);
    const col=cells.every((x,i)=>x===cells[0]+10*i);
    if(!row&&!col)return null;cells.forEach(x=>used.add(x));out.push({n:FLEET[k][0],len,c:cells,h:0})}
  return out}
function shipReset(){fleets={};Object.assign(S,{phase:'place',ready:{},shots:{A:{},B:{}},sunk:{A:[],B:[]},turn:S.starter,win:null,last:null})}
function actShip(a){
  const k=seatOf(a.from);
  if(a.type==='again'&&S.win&&k){S.starter=other(S.starter);S.round++;shipReset();return push()}
  if(!k)return;
  if(a.type==='place'){const f=validFleet(a.ships);if(!f)return;
    if(S.phase==='place'){fleets[k]=f;S.ready[k]=true;if(S.ready.A&&S.ready.B&&S.seats.A&&S.seats.B){S.phase='play';S.turn=S.starter}return push()}
    // A new host has no fleets: accept a re-sent one only if it matches every shot result so far.
    if(S.phase==='play'&&!fleets[k]){const at=S.shots[other(k)];
      for(const i in at){const hit=f.some(s=>s.c.includes(+i));if(hit!==(at[i]===1))return}
      for(const su of S.sunk[k]){if(!f.some(s=>s.n===su.n&&s.c.join()===su.c.slice().sort((x,y)=>x-y).join()))return}
      f.forEach(s=>s.h=s.c.filter(i=>at[i]===1).length);fleets[k]=f}
    return}
  if(a.type!=='fire'||S.phase!=='play'||S.win||S.seats[S.turn]!==a.from)return;
  const i=a.i|0;if(i<0||i>99||S.shots[k][i]!==undefined)return;
  const o=other(k),f=fleets[o];if(!f)return;
  const ship=f.find(s=>s.c.includes(i));let sunk=null;
  S.shots[k][i]=ship?1:0;
  if(ship){ship.h++;if(ship.h>=ship.len){sunk=ship.n;S.sunk[o].push({n:ship.n,c:ship.c})}}
  S.last={by:k,i,h:!!ship,s:sunk};
  if(S.sunk[o].length===5)S.win=k;else S.turn=o;
  push()}
// Clients keep their own fleet; after a host change they send it again so the new host can score shots.
function resendFleet(){if(!S||S.game!=='ship'||!ch)return;const k=seatOf(ID);if(!k||!S.ready[k]||!myShips.every(Boolean))return;send({type:'place',ships:myShips})}

/* ── Rock, Paper, Scissors (host side). Picks stay in `picks` until both are in. ── */
const RPS_MS=5200,HAND={rock:'✊',paper:'✋',scissors:'✌️'},BEATS={rock:'scissors',scissors:'paper',paper:'rock'};
let picks={},rpsT=null;
function rpsReset(){picks={};clearTimeout(rpsT);Object.assign(S,{phase:'pick',picked:{},reveal:null,score:{A:0,B:0},round:1,win:null})}
function rpsNext(){if(!S||S.game!=='rps'||S.phase!=='reveal'||S.win)return;S.phase='pick';S.picked={};S.reveal=null;S.round++;push()}
function actRps(a){
  const k=seatOf(a.from);if(!k)return;
  if(a.type==='again'&&S.win){S.match=(S.match||1)+1;rpsReset();return push()}
  if(a.type!=='pick'||S.phase!=='pick'||S.win||S.picked[k]||!HAND[a.c]||!S.seats.A||!S.seats.B)return;
  picks[k]=a.c;S.picked[k]=true;
  if(picks.A&&picks.B){const w=picks.A===picks.B?'draw':BEATS[picks.A]===picks.B?'A':'B';
    S.reveal={A:picks.A,B:picks.B,w};if(w!=='draw')S.score[w]++;S.phase='reveal';if(S.score[w]>=3)S.win=w;picks={};
    clearTimeout(rpsT);if(!S.win)rpsT=setTimeout(rpsNext,RPS_MS)}
  push()}

/* ── drawing ── */
function draw(){
  $('gname').textContent=gameType?NAMES[gameType]:'Joining…';drawPeople();
  const st=$('stage');clearInterval(tickT);
  if(!S){st.innerHTML='<p class="muted">Waiting for the host…</p>';return}

    else if(S.win==='draw')status='Draw!';

    const board=S.game==='ttt'
      ?`<div class="ttt">${S.board.map((v,i)=>`<button data-i="${i}" class="${v} ${S.line.includes(i)?'win':''}" aria-label="Square ${i+1} ${v}">${v}</button>`).join('')}</div>`
      :`<div class="c4">${S.board.map((v,i)=>`<button data-c="${i%7}" class="${v} ${S.line.includes(i)?'win':''}" aria-label="Column ${i%7+1}"></button>`).join('')}</div>`;
    st.innerHTML=`<div class="status">${status}</div>${spect}${board}${S.win&&mine?'<button class="btn" id="again">Rematch</button>':''}`;

  }
  if(S.game==='ship')return drawShip(st);

  // trivia race
  const board=()=>{const ids=Object.keys(people).sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0));return `<div class="score">${ids.map(id=>`<div class="${id===ID?'me':''}"><span>${E(name(id))}</span><span>${S.scores[id]||0}</span></div>`).join('')}</div>`};
  if(S.phase==='lobby'||S.phase==='end'){
    st.innerHTML=`<div class="status">${S.phase==='end'?'Final scores':'Trivia race'}</div>${S.phase==='end'?board():`<p class="muted">${Object.keys(people).length} in the room. ${isHost?'Start when everyone has joined.':'The host will start soon.'}</p>`}${isHost?`<button class="btn" id="start">${S.phase==='end'?'Play again':'Start game'}</button>`:''}`;

  st.innerHTML=`<div class="tq"><div class="row" style="justify-content:space-between"><span class="lbl">${E(S.q.cat)} · ${S.qi+1}/${S.total}</span><b>${S.scores[ID]||0} pts</b></div><div class="tbar"><i id="bar" style="width:100%"></i></div>
    <div class="qtext">${E(S.q.text)}</div><div class="opts">${S.q.opts.map(o=>{const cls=S.reveal?(o===S.reveal?'right':mineAns&&mineAns.c===o?'wrong':'dim'):mineAns&&mineAns.c===o?'picked':'';return `<button data-o="${E(o)}" class="${cls}" ${mineAns||S.reveal?'disabled':''}>${E(o)}</button>`}).join('')}</div>
    <p class="small">${S.reveal?(mineAns?.ok?'Correct!':'Answer: '+E(S.reveal)):mineAns?'Locked in. Waiting for others…':Object.keys(S.answers).length+' of '+Object.keys(people).length+' answered'}</p>${S.reveal?board():''}</div>`;
  st.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(!S.answers[ID]&&!myPick){myPick={qi:S.qi,c:b.dataset.o};send({type:'answer',c:b.dataset.o});draw()}});
  if(S.phase==='question'){const end=recvAt+S.left-(isHost?0:150);tickT=setInterval(()=>{const l=Math.max(0,end-Date.now());const bar=$('bar');if(bar)bar.style.width=(100*l/15000)+'%'},100)}
}

/* ── Battleship (client side) ── */
let myShips=[null,null,null,null,null],shipDir='h',shipSel=0,shipMsg=null;
const cellName=i=>'ABCDEFGHIJ'[Math.floor(i/10)]+(i%10+1);
function shipCells(k,anchor,dir){const len=FLEET[k][1];let r=Math.floor(anchor/10),c=anchor%10;if(dir==='h')c=Math.min(c,10-len);else r=Math.min(r,10-len);return [...Array(len)].map((_,j)=>dir==='h'?r*10+c+j:(r+j)*10+c)}
function randomFleet(){for(let t=0;t<200;t++){const out=[],used=new Set();let ok=true;
    for(let k=0;k<5&&ok;k++){let placed=false;for(let n=0;n<60&&!placed;n++){const cells=shipCells(k,Math.floor(Math.random()*100),Math.random()<.5?'h':'v');if(cells.every(x=>!used.has(x))){cells.forEach(x=>used.add(x));out.push(cells);placed=true}}if(!placed)ok=false}
    if(ok)return out}return null}
function saveFleet(){G.local.set('play:fleet',{code,ships:myShips})}
function placeAt(i){const owner=myShips.findIndex(c=>c&&c.includes(i));
  if(owner>=0){myShips[owner]=null;shipSel=owner;shipMsg=null;return}
  let k=shipSel;if(myShips[k])k=myShips.findIndex(c=>!c);if(k<0)return;
  const cells=shipCells(k,i,shipDir);if(cells.some(x=>myShips.some(c=>c&&c.includes(x)))){shipMsg=['That overlaps another ship.','no'];return}
  myShips[k]=cells;shipMsg=null;const nx=myShips.findIndex(c=>!c);shipSel=nx<0?k:nx}
// aim: cells are tappable; placing: every cell stays tappable (tap a ship to pick it up), otherwise cells already shot are disabled.
function seaGrid(cls,cell,aim,placing){return `<div class="seawrap"><div class="sea ${cls}">${[...Array(100)].map((_,i)=>{const c=cell(i);return `<button class="${c} ${aim?'aim':''}" ${aim?`data-f="${i}"`:''} ${!aim||(c&&!placing)?'disabled':''} aria-label="${cellName(i)}${c?' '+c:''}"></button>`}).join('')}</div></div>`}
function drawShip(st){
  const mine=seatOf(ID),opp=mine?other(mine):null;
  const myCell=i=>{const onShip=myShips.some(c=>c&&c.includes(i));const shot=mine?S.shots[opp][i]:undefined;const sunk=mine&&S.sunk[mine].some(s=>s.c.includes(i));
    return sunk?'sunk':shot===1?'hit':shot===0?'miss':onShip?'ship':''};
  const theirCell=(by,at)=>i=>{const shot=S.shots[by][i];const sunk=S.sunk[at].some(s=>s.c.includes(i));return sunk?'sunk':shot===1?'hit':shot===0?'miss':''};
  const names=k=>S.seats[k]?E(name(S.seats[k])):'…';
  let status,note='',body='',again='';
  if(S.win){status=S.seats[S.win]===ID?'You win! 🎉':names(S.win)+' wins';note=S.seats[S.win]===ID?'Every enemy ship is on the bottom.':'All your ships are sunk.';if(mine)again='<button class="btn" id="again">Rematch</button>'}
  else if(!S.seats.B)status='Waiting for a second player. Share the code!';
  else if(S.phase==='place')status=mine?(S.ready[mine]?'Waiting for '+names(opp)+' to place ships…':'Place your ships'):names('A')+' and '+names('B')+' are placing ships';
  else status=mine?(S.seats[S.turn]===ID?'Your turn: tap their waters':names(S.turn)+'\'s turn'):names(S.turn)+'\'s turn';
  if(S.last&&!S.win&&S.phase==='play'){const l=S.last,me=l.by===mine;const who=me?'You':names(l.by);const them=l.by===opp?'your':me?'their':names(other(l.by))+'\'s';
    note=l.s?`${who} sunk ${them} ${E(l.s)}!`:`${who} ${l.h?'hit':'missed'} at ${cellName(l.i|0)}.`}
  if(S.phase==='place'&&mine&&!S.ready[mine]&&!S.win){
    const all=myShips.every(Boolean);
    body=`<div class="shipq">${FLEET.map(([n,len],k)=>`<button data-s="${k}" class="${myShips[k]?'done':''} ${k===shipSel&&!myShips[k]?'on':''}">${n} · ${len}</button>`).join('')}</div>
      <div class="note ${shipMsg?shipMsg[1]:''}">${shipMsg?E(shipMsg[0]):all?'All five placed. Tap a ship to move it, or press Ready.':'Tap a square to put the '+FLEET[shipSel][0]+' there.'}</div>
      ${seaGrid('',i=>myShips.some(c=>c&&c.includes(i))?'ship':'',true,true)}
      <div class="row" style="justify-content:center"><button class="btn sm ghost" id="rot">Rotate: ${shipDir==='h'?'across':'down'}</button><button class="btn sm ghost" id="rnd">Random</button><button class="btn sm ghost" id="clr">Clear</button><button class="btn sm" id="ready" ${all?'':'disabled'}>Ready</button></div>`;
    st.innerHTML=`<div class="status">${status}</div>${body}`;
    st.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{placeAt(+b.dataset.f);drawShip(st)});
    st.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=+b.dataset.s;if(myShips[k])myShips[k]=null;shipSel=k;shipMsg=null;drawShip(st)});
    $('rot').onclick=()=>{shipDir=shipDir==='h'?'v':'h';drawShip(st)};
    $('rnd').onclick=()=>{const f=randomFleet();if(f){myShips=f;shipSel=0;shipMsg=null}drawShip(st)};
    $('clr').onclick=()=>{myShips=[null,null,null,null,null];shipSel=0;shipMsg=null;drawShip(st)};
    $('ready').onclick=()=>{if(!myShips.every(Boolean))return;saveFleet();send({type:'place',ships:myShips})};
    return}
  const myTurn=S.phase==='play'&&!S.win&&mine&&S.seats[S.turn]===ID;
  const boards=mine
    ?`<div class="seas"><div class="seabox"><span class="lbl">Their waters</span>${seaGrid(myTurn?'':'dim',theirCell(mine,opp),myTurn)}</div><div class="seabox"><span class="lbl">Your fleet</span>${seaGrid('',myCell,false)}</div></div>`
    :`<div class="seas"><div class="seabox"><span class="lbl">${names('A')}'s shots</span>${seaGrid('',theirCell('A','B'),false)}</div><div class="seabox"><span class="lbl">${names('B')}'s shots</span>${seaGrid('',theirCell('B','A'),false)}</div></div>`;
  const spect=!mine?`<p class="small">You're watching ${names('A')} vs ${names('B')}.</p>`:'';
  st.innerHTML=`<div class="status">${status}</div><div class="note">${note}</div>${spect}${boards}${again}`;
  st.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{if(!myTurn)return;send({type:'fire',i:+b.dataset.f})});
  if($('again'))$('again').onclick=()=>send({type:'again'});
}

/* ── Rock, Paper, Scissors (client side) ── */
let rpsAnim=null;
function drawRps(st){
  const mine=seatOf(ID),opp=mine?other(mine):null;const names=k=>S.seats[k]?E(name(S.seats[k])):'…';
  const score=`<div class="rscore"><span>${names('A')}</span><span class="pips">${[0,1,2].map(i=>`<i class="${S.score.A>i?'on':''}"></i>`).join('')}</span><b>${S.score.A|0}</b><span class="muted">–</span><b>${S.score.B|0}</b><span class="pips">${[0,1,2].map(i=>`<i class="${S.score.B>i?'on':''}"></i>`).join('')}</span><span>${names('B')}</span></div>`;
  let status,body='';
  if(!S.seats.B){status='Waiting for a second player. Share the code!'}
  else if(S.phase==='reveal'&&S.reveal){
    const key=(S.match||1)+':'+S.round;if(!rpsAnim||rpsAnim.key!==key)rpsAnim={key,at:Date.now()};
    const left=3000-(Date.now()-rpsAnim.at);
    if(left>0){status='Round '+S.round;body=`<div class="cnt" id="cnt" aria-live="polite">${Math.ceil(left/1000)}</div>`;
      tickT=setInterval(()=>{const l=3000-(Date.now()-rpsAnim.at);const c=$('cnt');if(l<=0){clearInterval(tickT);drawRps(st)}else if(c)c.textContent=Math.ceil(l/1000)},100)}
    else{const r=S.reveal;
      if(S.win)status=S.seats[S.win]===ID?'You win the match! 🎉':names(S.win)+' wins the match';
      else status=r.w==='draw'?'Draw':(S.seats[r.w]===ID?'You win the round':names(r.w)+' wins the round');
      body=`<div class="hands"><div><b>${HAND[r.A]}</b>${names('A')}</div><span class="vs">vs</span><div><b>${HAND[r.B]}</b>${names('B')}</div></div>${S.win&&mine?'<button class="btn" id="again">Rematch</button>':S.win?'':'<p class="small">Next round in a moment…</p>'}`}}
  else{
    const picked=mine&&S.picked[mine];
    status=mine?(picked?'Locked in. Waiting for '+names(opp)+'…':'Round '+S.round+': pick one'):'Round '+S.round;
    body=mine?`<div class="rps">${Object.keys(HAND).map(h=>`<button data-h="${h}" aria-label="${h}" ${picked?'disabled':''}>${HAND[h]}</button>`).join('')}</div>`:`<p class="small">You're watching ${names('A')} vs ${names('B')}. ${S.picked.A?names('A')+' is in.':''} ${S.picked.B?names('B')+' is in.':''}</p>`}
  st.innerHTML=`<div class="status">${status}</div>${score}${body}`;
  st.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>send({type:'pick',c:b.dataset.h}));
  if($('again'))$('again').onclick=()=>send({type:'again'});
}

/* ── reactions + chat: a plain broadcast, no host logic ── */
let chat=[],lastSay=0;
function say(k,v){if(!ch)return;v=String(v||'').trim().slice(0,80);if(!v||Date.now()-lastSay<400)return;lastSay=Date.now();ch.send({type:'broadcast',event:'say',payload:{from:ID,n:name(ID),k,v}})}
function onSay(p){if(!p||typeof p.v!=='string')return;const k=p.k==='r'?'r':'m',v=p.v.slice(0,80),n=String(p.n||'Player').slice(0,20);
  if(k==='r'&&!/^(👏|😂|😱|🔥)$/.test(v))return;
  chat.push({n,k,v});chat=chat.slice(-5);
  $('saylog').innerHTML=chat.map(c=>`<div><b>${E(c.n)}</b> ${E(c.v)}</div>`).join('');
  const f=document.createElement('span');f.className='fly '+k;f.textContent=k==='r'?v:n+': '+v;f.style.left=(8+Math.random()*(k==='r'?80:30))+'%';
  $('flyer').append(f);setTimeout(()=>f.remove(),2700)}
$('saybar').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b)say('r',b.dataset.r)});
$('saysend').onclick=()=>{say('m',$('saymsg').value);$('saymsg').value=''};
$('saymsg').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('saysend').click()}};

/* ── Letter Rush race ── */
function rushBoard(){const ids=Object.keys(people).sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0));
  return `<div class="score">${ids.map(id=>`<div class="${id===ID?'me':''}"><span>${E(name(id))} <small class="muted">${S.counts[id]||0} words</small></span><span>${S.scores[id]||0}</span></div>`).join('')}</div>`}
function drawRush(st){
  clearInterval(tickT);
  if(S.phase!=='play'){
    st.innerHTML=`<div class="status">${S.phase==='end'?'Time! Final scores':'Letter Rush race'}</div>
      ${S.phase==='end'?`${rushBoard()}<p class="muted">${S.seed?`The 7-letter word was <b>${E(S.seed.toUpperCase())}</b>. `:''}You found ${myFound.length} word${myFound.length===1?'':'s'}.</p><div class="found">${myFound.map(w=>`<span>${E(w)}</span>`).join('')}</div>`
        :`<p class="muted">Everyone gets the same 7 letters. Make as many words (3+ letters) as you can in 90 seconds. ${Object.keys(people).length} in the room. ${isHost?'Start when everyone has joined.':'The host will start soon.'}</p>`}
      ${isHost?`<button class="btn" id="start">${S.phase==='end'?'Play again':'Start game'}</button>`:''}`;
    if($('start'))$('start').onclick=()=>send({type:'start'});return}
  needLetters();
  if(myRound!==S.round){myRound=S.round;myFound=[];guess=[];rmsg=null}
  const word=guess.map(i=>S.rack[i]).join('');
  st.innerHTML=`<div class="lr"><div class="lhead"><span>${S.scores[ID]||0} pts · ${myFound.length} words</span><span class="lclock" id="rclock"></span></div>
    <div class="guess">${E(word)}</div><div class="lmsg ${rmsg?rmsg[1]:''}">${rmsg?E(rmsg[0]):''}</div>
    <div class="tiles">${S.rack.map((c,i)=>`<button class="tile" data-t="${i}"${guess.includes(i)?' disabled':''}>${c}</button>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn sm ghost" id="rdel">⌫</button><button class="btn sm ghost" id="rclr">Clear</button><button class="btn sm" id="rent">Enter</button></div>
    <div class="found">${myFound.slice().sort((a,b)=>b.length-a.length).map(w=>`<span>${E(w)}</span>`).join('')}</div>${rushBoard()}</div>`;
  st.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{guess.push(+b.dataset.t);drawRush(st)});
  $('rdel').onclick=()=>{guess.pop();drawRush(st)};$('rclr').onclick=()=>{guess=[];drawRush(st)};$('rent').onclick=()=>rushSubmit(st);
  const end=recvAt+S.left-(isHost?0:150);const upd=()=>{const l=Math.max(0,end-Date.now())/1000,c=$('rclock');if(c){c.textContent=Math.floor(Math.ceil(l)/60)+':'+String(Math.ceil(l)%60).padStart(2,'0');c.classList.toggle('low',l<=10)}};
  upd();tickT=setInterval(upd,200);
}
function rushSubmit(st){const w=guess.map(i=>S.rack[i]).join('');guess=[];
  if(w.length<3)rmsg=['3 letters or more.','no'];else if(myFound.includes(w))rmsg=['Already found.','no'];
  else if(!window.LETTERS||!LETTERS.words.has(w))rmsg=['Not in the word list.','no'];
  else{myFound.push(w);rmsg=[w.length===7?'All seven! +300':'+'+PTS[w.length],'ok'];send({type:'found',w})}
  drawRush(st)}
document.addEventListener('keydown',e=>{if(!S||S.game!=='rush'||S.phase!=='play'||e.target.matches('input,textarea'))return;const st=$('stage'),k=e.key.toLowerCase();
  if(k==='enter'){e.preventDefault();rushSubmit(st)}else if(k==='backspace'){e.preventDefault();guess.pop();drawRush(st)}
  else if(/^[a-z]$/.test(k)){const i=S.rack.findIndex((c,j)=>c===k&&!guess.includes(j));if(i>=0){guess.push(i);drawRush(st)}}});

/* ── lobby buttons ── */
$('create').onclick=()=>enter(newCode(),document.querySelector('[name=g]:checked').value);
$('join').onclick=()=>{const c=$('joincode').value.trim().toUpperCase();if(!/^[A-Z]{4}$/.test(c)){$('lmsg').innerHTML='<div class="msg">Codes are 4 letters.</div>';return}enter(c)};
$('joincode').onkeydown=e=>{if(e.key==='Enter')$('join').click()};
$('copy').onclick=()=>{const u=inviteURL();(navigator.share?navigator.share({text:'Play '+(NAMES[gameType]||'a game')+' with me: '+u,url:u}).catch(()=>{}):navigator.clipboard.writeText(u).then(()=>{$('copy').textContent='Copied ✓';setTimeout(()=>$('copy').textContent='Copy invite link',1500)}))};
function leave(){if(ch)SB.removeChannel(ch);ch=null;S=null;people={};isHost=false;hostId=null;gameType=null;fleets={};picks={};chat=[];rpsAnim=null;shipSel=0;shipMsg=null;$('saylog').innerHTML='';$('flyer').innerHTML='';clearInterval(tickT);clearTimeout(tq);clearTimeout(rushT);clearTimeout(rpsT);history.replaceState(null,'',location.pathname);$('room').hidden=true;$('lobby').hidden=false}
$('leave').onclick=()=>{leave();$('lmsg').innerHTML=''};
// Invite links: /edu/play/?join=CODE (older links used #CODE).
const fromLink=(new URLSearchParams(location.search).get('join')||location.hash.replace('#','')).toUpperCase();
if(/^[A-Z]{4}$/.test(fromLink)){$('joincode').value=fromLink;if(nick.value)enter(fromLink);else{nick.focus();$('lmsg').innerHTML='<div class="msg ok">Type your name, then press Join.</div>'}}
</script>
