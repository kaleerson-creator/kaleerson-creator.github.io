<style>
.phead .blob{background:var(--moss)}
.tabs{display:flex;background:var(--card);border-radius:999px;padding:4px;gap:2px;margin-bottom:12px;width:max-content;max-width:100%}
.tabs button{font:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:999px;border:0;background:transparent;color:var(--ink2);cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.stage{min-height:360px;align-items:center;justify-content:center;text-align:center;gap:18px}
.stage .blob{width:60%;aspect-ratio:1;right:-20%;bottom:-35%;background:#ffffff66}
.stage.done .blob{background:#ffffffa6}
.pane{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(50px,12.5vw,136px);letter-spacing:-.06em;line-height:.9;font-variant-numeric:tabular-nums;white-space:nowrap;max-width:100%}
.clock.long{font-size:clamp(40px,10vw,110px)}
.clock small{font-size:.5em;letter-spacing:-.04em;color:var(--ink2);font-weight:700}
.phase{font-size:14px;font-weight:600;color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;min-height:1.4em}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.big{padding:14px 28px;font-size:17px;min-width:120px;justify-content:center}
.btn.sm,.btn.big{white-space:nowrap}
.ic{width:40px;height:40px;border-radius:999px;border:0;background:#ffffff8c;color:var(--ink);display:grid;place-items:center;cursor:pointer}
html[data-theme=dark] .ic{background:#ffffff14}
.ic svg{width:18px;height:18px}
.ic[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.hint{font-size:14px;color:var(--ink2)}
.kb{display:inline-block;padding:1px 6px;border-radius:6px;background:#ffffff8c;font-size:12px;font-weight:600}
html[data-theme=dark] .kb{background:#ffffff14}
.setrow{display:flex;gap:10px;align-items:end;justify-content:center;flex-wrap:wrap}
.setrow label{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.setrow input{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.03em;width:96px;padding:8px 10px;border:0;border-radius:12px;background:#ffffffa6;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.pre{font:inherit;font-size:13px;font-weight:600;padding:8px 12px;border-radius:999px;border:0;background:#ffffff8c;color:var(--ink);cursor:pointer}
html[data-theme=dark] .pre{background:#ffffff14}
.pre[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.laps{display:grid;gap:4px;max-height:420px;overflow-y:auto;font-variant-numeric:tabular-nums}
.lap{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:baseline;padding:8px 10px;border-radius:12px;background:var(--paper);font-size:15px}
.lap b{font-family:var(--display);font-weight:800;font-size:15px;color:var(--ink2);min-width:2.2em}
.lap .sp{font-weight:600}
.lap .tt{color:var(--ink2);font-size:14px}
.lap.best{outline:2px solid var(--ink)}
.lap.best b::after{content:' best';font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.lap.worst .sp{color:var(--ink2)}
@media (max-width:520px){.btn.big{min-width:0}}
</style>

<body data-page="tools">
<main class="wrap">
<section class="phead"><span class="blob"></span><h1>Stopwatch</h1><p>Laps and splits, plus a timer that beeps. Both keep going if you reload.</p></section>
<div class="tabs" role="tablist"><button data-m="sw" aria-pressed="true">Stopwatch</button><button data-m="tm" aria-pressed="false">Timer</button></div>
<div class="bento">
  <section class="b s4 moss stage wide-m" id="stage" aria-live="polite">
    <span class="blob"></span>
    <div class="pane" id="p-sw">
      <div class="clock" id="swclock">00:00<small>.00</small></div>
      <div class="phase" id="swphase">Ready</div>
      <div class="row" style="justify-content:center;align-items:center">
        <button class="btn big" id="swstart">Start</button>
        <button class="btn light sm" id="swlap" disabled>Lap</button>
        <button class="btn light sm" id="swreset" disabled>Reset</button>
      </div>
      <div class="hint"><span class="kb">Space</span> start or stop · <span class="kb">L</span> lap · <span class="kb">R</span> reset</div>
    </div>
    <div class="pane" id="p-tm" hidden>
      <div class="clock" id="tmclock">05:00</div>
      <div class="phase" id="tmphase">Ready</div>
      <div class="setrow" id="setrow">
        <label>min<input id="tmin" type="number" inputmode="numeric" min="0" max="999" value="5"></label>
        <label>sec<input id="tsec" type="number" inputmode="numeric" min="0" max="59" value="0"></label>
      </div>
      <div class="row" id="presets" style="justify-content:center"><button class="pre" data-min="1">1 min</button><button class="pre" data-min="5">5 min</button><button class="pre" data-min="10">10 min</button><button class="pre" data-min="30">30 min</button></div>
      <div class="row" style="justify-content:center;align-items:center">
        <button class="btn big" id="tmstart">Start</button>
        <button class="btn light sm" id="tmreset">Reset</button>
        <button class="ic" id="mute" aria-pressed="false" aria-label="Mute beep" title="Beep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path id="wave" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg></button>
      </div>
      <div class="hint"><span class="kb">Space</span> start or pause · <span class="kb">R</span> reset</div>
    </div>
  </section>
  <section class="b s2 wide-m">
    <span class="lbl">Laps</span>
    <div class="laps" id="laps"><div class="hint">No laps yet. Press Lap while it runs.</div></div>
    <div class="foot"><span class="muted" id="lapsum"></span><button class="btn ghost sm" id="copylaps" disabled>Copy laps</button></div>
  </section>
</div>
</main>
<script src="/assets/site.js?v=20261008"></script>
<script>
const S=window.SITE;
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
const J=(k,d)=>{try{const v=JSON.parse(ls(k));return v==null?d:v}catch(e){return d}};
const $=id=>document.getElementById(id);
const toast=m=>{if(S&&typeof S.toast==='function')S.toast(m)};
const BASE_TITLE=document.title;
const pad=n=>String(n).padStart(2,'0');
// mm:ss.cs, with hours in front once it gets that far
const fmtCs=ms=>{ms=Math.max(0,Math.floor(ms));const h=Math.floor(ms/36e5),m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60,cs=Math.floor(ms/10)%100;return{main:(h?h+':':'')+pad(m)+':'+pad(s),cs:'.'+pad(cs)}};
const fmtS=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s/60)%60;return (h?h+':':'')+pad(m)+':'+pad(s%60)};

// ── tabs ──
let mode=ls('stopwatch_tab')==='tm'?'tm':'sw';
function setMode(m){mode=m;ls('stopwatch_tab',m);document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));$('p-sw').hidden=m!=='sw';$('p-tm').hidden=m!=='tm';$('stage').classList.toggle('done',m==='tm'&&tm.done);title()}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m)});

// ── stopwatch: stopwatch_state {run, start (wall clock ms when this run began), acc (ms before it), laps:[total ms]} ──
let sw=J('stopwatch_state',null);
if(!sw||typeof sw!=='object'||!Array.isArray(sw.laps)||!isFinite(sw.acc)||(sw.run&&!(sw.start>0&&Date.now()-sw.start<7*864e5)))sw={run:false,start:0,acc:0,laps:[]};
sw.laps=sw.laps.filter(x=>isFinite(x)&&x>=0);
const saveSw=()=>ls('stopwatch_state',JSON.stringify(sw));
const elapsed=()=>sw.acc+(sw.run?Date.now()-sw.start:0);
let raf=0,lastSec=-1;
function paintSw(){
  const e=elapsed(),f=fmtCs(e);
  $('swclock').innerHTML=f.main+'<small>'+f.cs+'</small>';$('swclock').classList.toggle('long',e>=36e5);
  $('swstart').textContent=sw.run?'Stop':e?'Resume':'Start';
  $('swphase').textContent=sw.run?'Running':e?'Stopped':'Ready';
  $('swlap').disabled=!sw.run;$('swreset').disabled=!e&&!sw.laps.length;
  const sec=Math.floor(e/1000);if(sec!==lastSec){lastSec=sec;title()}
}
function loop(){paintSw();if(sw.run&&!document.hidden)raf=requestAnimationFrame(loop);else raf=0}
function startLoop(){if(!raf&&sw.run)raf=requestAnimationFrame(loop)}
function swToggle(){if(sw.run){sw.acc=elapsed();sw.run=false;sw.start=0}else{sw.start=Date.now();sw.run=true}saveSw();paintSw();startLoop()}
function swLap(){if(!sw.run)return;sw.laps.push(elapsed());saveSw();drawLaps();if(S&&S.toast&&sw.laps.length===1)toast('Lap saved')}
function swReset(){sw={run:false,start:0,acc:0,laps:[]};saveSw();paintSw();drawLaps()}
$('swstart').onclick=swToggle;$('swlap').onclick=swLap;$('swreset').onclick=swReset;
function drawLaps(){
  const L=sw.laps,n=L.length;
  const splits=L.map((t,i)=>t-(i?L[i-1]:0));
  const best=n>1?splits.indexOf(Math.min(...splits)):-1,worst=n>1?splits.indexOf(Math.max(...splits)):-1;
  $('laps').innerHTML=n?L.map((t,i)=>{const s=fmtCs(splits[i]),tt=fmtCs(t);return `<div class="lap${i===best?' best':''}${i===worst?' worst':''}"><b>${i+1}</b><span class="sp">${s.main}${s.cs}</span><span class="tt">${tt.main}${tt.cs}</span></div>`}).reverse().join(''):'<div class="hint">No laps yet. Press Lap while it runs.</div>';
  $('lapsum').textContent=n?n+(n===1?' lap':' laps')+(n>1?' · avg '+(a=>a.main+a.cs)(fmtCs(L[n-1]/n)):''):'';
  $('copylaps').disabled=!n;
}
$('copylaps').onclick=async()=>{
  const L=sw.laps;if(!L.length)return;
  const txt=L.map((t,i)=>{const s=fmtCs(t-(i?L[i-1]:0)),tt=fmtCs(t);return 'Lap '+(i+1)+'\t'+s.main+s.cs+'\ttotal '+tt.main+tt.cs}).join('\n');
  let done=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);done=true}}catch(e){}
  if(!done){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();done=document.execCommand('copy');ta.remove()}catch(e){}}
  toast(done?'Laps copied':'Could not copy');
};

// ── timer: stopwatch_timer {set (ms), run, endAt, remaining, done} ──
let tm=J('stopwatch_timer',null);
if(!tm||typeof tm!=='object'||!isFinite(tm.set)||tm.set<=0)tm={set:5*6e4,run:false,endAt:0,remaining:5*6e4,done:false};
if(tm.run&&!(tm.endAt>0&&Date.now()-tm.endAt<12*36e5)){tm.run=false;tm.remaining=tm.set}
let mute=ls('stopwatch_mute')==='1',tmT=null;
const saveTm=()=>ls('stopwatch_timer',JSON.stringify(tm));
const tmLeft=()=>tm.run?tm.endAt-Date.now():tm.remaining;
function paintTm(){
  const left=tmLeft();
  $('tmclock').textContent=fmtS(left);$('tmclock').classList.toggle('long',left>=36e5);
  $('tmphase').textContent=tm.done?"Time's up":tm.run?'Counting down':tm.remaining<tm.set?'Paused':'Ready';
  $('tmstart').textContent=tm.run?'Pause':tm.done?'Again':tm.remaining<tm.set?'Resume':'Start';
  $('stage').classList.toggle('done',mode==='tm'&&tm.done);
  $('setrow').querySelectorAll('input').forEach(i=>i.disabled=tm.run);
  document.querySelectorAll('.pre').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.min*6e4===tm.set));
  title();
}
function tmTick(){if(!tm.run)return;const left=tmLeft();if(left<=0){tmEnd();return}paintTm();tmT=setTimeout(tmTick,Math.min(1000,(left%1000)||1000))}
function tmStart(){
  if(tm.run)return;
  if(tm.done){tm.done=false;tm.remaining=tm.set}
  if(tm.remaining<=0)tm.remaining=tm.set;
  tm.run=true;tm.endAt=Date.now()+tm.remaining;clearTimeout(tmT);saveTm();tmTick();paintTm();
  if(actx&&actx.state==='suspended')actx.resume();
}
function tmPause(){if(!tm.run)return;tm.remaining=Math.max(0,tm.endAt-Date.now());tm.run=false;clearTimeout(tmT);saveTm();paintTm()}
function tmReset(){tm.run=false;tm.done=false;tm.remaining=tm.set;clearTimeout(tmT);saveTm();paintTm()}
function tmEnd(){
  tm.run=false;tm.done=true;tm.remaining=0;clearTimeout(tmT);saveTm();paintTm();
  beep();if('vibrate' in navigator){try{navigator.vibrate([200,100,200,100,400])}catch(e){}}
  if(S&&S.confetti)try{S.confetti()}catch(e){}
  toast("Time's up");
}
function readSet(){const m=Math.min(999,Math.max(0,parseInt($('tmin').value,10)||0)),s=Math.min(59,Math.max(0,parseInt($('tsec').value,10)||0));const v=(m*60+s)*1000;if(v>0){tm.set=v;if(!tm.run){tm.remaining=v;tm.done=false}saveTm();paintTm()}}
function writeSet(){$('tmin').value=Math.floor(tm.set/6e4);$('tsec').value=Math.floor(tm.set/1000)%60}
$('tmin').addEventListener('input',readSet);$('tsec').addEventListener('input',readSet);
$('presets').addEventListener('click',e=>{const b=e.target.closest('[data-min]');if(!b||tm.run)return;tm.set=+b.dataset.min*6e4;tm.remaining=tm.set;tm.done=false;writeSet();saveTm();paintTm()});
$('tmstart').onclick=()=>tm.run?tmPause():tmStart();
$('tmreset').onclick=tmReset;

// beep: three short tones, then two long ones (WebAudio, nothing to download)
let actx=null;
function beep(){
  if(mute)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime;
    [[880,0,.12],[880,.2,.12],[880,.4,.12],[1046.5,.75,.35],[1046.5,1.25,.5]].forEach(([f,d,len])=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.12,t+d+.01);g.gain.setValueAtTime(.12,t+d+len-.03);g.gain.linearRampToValueAtTime(0,t+d+len);o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+len+.02)});
  }catch(e){}
}
function drawMute(){$('mute').setAttribute('aria-pressed',mute);$('mute').setAttribute('aria-label',mute?'Unmute beep':'Mute beep');$('wave').style.display=mute?'none':''}
$('mute').onclick=()=>{mute=!mute;ls('stopwatch_mute',mute?'1':null);drawMute();if(!mute)beep()};
drawMute();

// ── shared: title, keys, visibility ──
function title(){
  if(mode==='sw'&&(sw.run||elapsed()))document.title=fmtCs(elapsed()).main+' · Stopwatch';
  else if(mode==='tm'&&(tm.run||tm.done))document.title=(tm.done?"Time's up":fmtS(tmLeft()))+' · Timer';
  else document.title=BASE_TITLE;
}
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  // Space on a focused button already clicks it, so leave that to the browser
  if(e.code==='Space'){if(e.target.matches('button,a'))return;e.preventDefault();mode==='sw'?swToggle():(tm.run?tmPause():tmStart())}
  else if(k==='l'&&mode==='sw')swLap();
  else if(k==='r'){mode==='sw'?swReset():tmReset()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;startLoop();if(tm.run){clearTimeout(tmT);tmTick()}paintSw()});

writeSet();paintTm();if(tm.run)tmTick();
drawLaps();paintSw();startLoop();
setMode(mode);
</script>
</body>
</html>
