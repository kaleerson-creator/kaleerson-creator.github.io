<style>
.phead .blob{background:var(--sky)}
.eyebrow{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;margin-top:8px}
.eyebrow:first-child{margin-top:0}
.eyebrow .lbl{color:var(--ink)}
.eyebrow .muted{font-size:14px}
.tool{min-height:240px}
.tool .blob{width:80%;aspect-ratio:1;right:-30%;bottom:-40%;background:#ffffff66}
.tool h2{font-size:clamp(32px,3.6vw,44px)}
.quick{min-height:168px;padding:20px}
.quick h2{font-size:clamp(24px,2.4vw,30px);line-height:1}
.quick>.art{width:clamp(64px,24%,92px)}
.quick .foot .muted{font-size:14px}
.ask{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.ask .lbl{color:var(--ink2)}
</style>

<body data-page="tools">
<main class="wrap">
<section class="phead"><span class="blob"></span><h1>Tools</h1><p>Most of these are open to anyone. A few need a free account: <a href="/join/" style="text-decoration:underline;text-underline-offset:3px">join</a> with your email.</p></section>
<div class="bento" id="grid"></div>
</main>
<script src="/assets/content.js?v=20261008"></script>
<script src="/assets/site.js?v=20261009"></script>
<script>
const C=window.CONTENT,S=window.SITE;

const BIG=C.tools.filter(t=>!t.quick),QUICK=C.tools.filter(t=>t.quick);
// even rows on the 6-column grid: 3 per row when divisible by 3, 2 per row when even, else 3 + 2
const size=(n,i)=>n%3===0?'s2':n%2===0?'s3':i<3?'s2':'s3';
const chips=t=>`<div class="row"><span class="chip">${S.esc(t.tag)}</span>${t.status?S.statusChip(t.status):t.open?'<span class="chip live">Open to all</span>':'<span class="chip">Members</span>'}</div>`;
const tile=(t,cls)=>{const tag=t.href?'a':'div',open=t.href?`a href="${t.href}"`:'div';return `<${open} class="b ${cls} ${t.color} wide-m"><span class="art" data-art="${t.art||''}"></span>${cls.includes('quick')?`<span class="lbl">${S.esc(t.tag)}${t.open?' · Open to all':''}</span>`:chips(t)}<h2>${S.esc(t.name)}</h2><div class="foot"><span class="muted">${S.esc(t.note)}</span>${t.href?S.arrow:'<span class="soon">Coming soon</span>'}</div></${tag}>`};
document.getElementById('grid').innerHTML=
  `<div class="eyebrow"><span class="lbl">Big tools</span><span class="muted">Games, study and debate</span></div>`+
  BIG.map((t,i)=>tile(t,size(BIG.length,i)+' tool')).join('')+
  `<div class="eyebrow"><span class="lbl">Quick tools</span><span class="muted">No account needed, work offline</span></div>`+
  QUICK.map(t=>tile(t,'s2 quick')).join('')+
  `<a class="b s2 quick ask wide-m" href="/forum/#/cat/ideas"><span class="lbl">Missing something?</span><h2>Request a tool</h2><div class="foot"><span class="muted">Post it in the forum's Ideas category.</span>${S.arrow}</div></a>`;
</script>
</body>
