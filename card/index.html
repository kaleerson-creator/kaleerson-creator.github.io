<style>
body{background:var(--forest)}
main.c{flex:1;width:100%;max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);display:grid;gap:12px;align-content:start}
